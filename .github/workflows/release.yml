# On every version tag, builds the installer and publishes it together with latest.yml (checksum for the updater, see
# src/updater.js) as a GitHub release. Tags with a suffix (v0.2.0-beta.1) become pre-releases: only the
# “Beta” channel sees them. Flow QA → Live: see README.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Installer
    # While the repo is private, the Windows runners cost minutes; then `npm run release` builds locally (see README).
    if: ${{ !github.event.repository.private }}
    # Windows from GitHub: our own runners are Linux, and the installer is built on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax and tests
        run: |
          node scripts/check.js
          node --test
      # The version comes from the tag; package.json in the repo stays unchanged.
      - name: Version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Tag $GITHUB_REF_NAME is not a version"; exit 1; }
          npm version "$version" --no-git-tag-version --allow-same-version
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "RunClub ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          # Next to the installer the file for the updater (latest.yml, beta.yml for betas), not builder-debug.yml.
          files=(dist/*.exe dist/*.blockmap)
          for channel in latest beta alpha; do if [[ -f "dist/$channel.yml" ]]; then files+=("dist/$channel.yml"); fi; done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
