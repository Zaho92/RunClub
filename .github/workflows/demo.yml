name: Demo pipeline

# Does nothing but wait: a multi-stage pipeline to look at the network plan in RunClub.
# Start by hand:  gh workflow run demo.yml   (with a failure:  gh workflow run demo.yml -f fail=true)

on:
  workflow_dispatch:
    inputs:
      fail:
        description: Make the job “Unit tests” fail, so that red and skipped jobs show up
        type: boolean
        default: false

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Check environment
        run: sleep 8

  build:
    name: Build
    needs: prepare
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Fetch dependencies
        run: sleep 10
      - name: Compile
        run: sleep 25
      - name: Store artifacts
        run: sleep 5

  lint:
    name: Lint
    needs: prepare
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Check style
        run: sleep 18

  unit:
    name: Unit tests
    needs: prepare
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Prepare tests
        run: sleep 6
      - name: Run tests
        run: |
          sleep 20
          if [ "${{ inputs.fail }}" = "true" ]; then echo "failed on purpose"; exit 1; fi

  integration:
    name: Integration tests
    needs: [build, unit]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Start services
        run: sleep 10
      - name: Run tests
        run: sleep 25

  package:
    name: Package
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Pack
        run: sleep 15

  docs:
    name: Build docs
    needs: lint
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Generate pages
        run: sleep 14

  smoke:
    name: Smoke test
    needs:
      - integration
      - package
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Start package
        run: sleep 8
      - name: Check reachability
        run: sleep 12

  publish:
    name: Publish
    needs: [smoke, docs]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Wait for approval
        run: sleep 6
      - name: Upload
        run: sleep 8
