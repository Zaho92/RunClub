name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Syntax and tests
    # GitHub's runners: the repo is public, and RunClub never pools a public repo (so `CI_RUNNER`, see README, has
    # nothing to switch to here). A fork's pull request brings its own copy of this file anyway.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Without `npm ci`: syntax check and tests only need Node, not Electron.
      - name: Syntax
        run: node scripts/check.js
      - name: Tests
        run: node --test
