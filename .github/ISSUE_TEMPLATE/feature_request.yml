name: Idea
description: Something RunClub should do, or do differently.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. How you imagine it.
