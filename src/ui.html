<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunClub</title>
<style>
  @font-face { font-family: Overpass; src: url(/fonts/overpass-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; unicode-range: U+0000-00B6, U+00B8-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  :root {
    color-scheme: dark;
    --ground:#0c1838; --rail:#091230; --surface:#14224f; --raised:#1a2b60; --edge:#26366e; --rule:#1f2d62; --track:#6a7bb5; --track-open:#5b6a94; --cap:#33427a;
    --ink:#dfe5f5; --text:#c9d2ea; --muted:#8793b8; --chart:#8fa4e0;
    --run:#ffc53d; --done:#3fcf8e; --fail:#f0524a; --fail-text:#f58a8f; --cancel:#c084fc; --skip:#7a85a3; --wait:#5b6a94; --fail-edge:#7a2f38; --rail-hover:#0f1b44; --select:#2c4391;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 300 14px/1.45 Overpass, "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden; }
  ::selection { background: var(--select); color: var(--ink); }
  * { scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
  :focus-visible { outline: 2px solid var(--chart); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  #app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
  /* The app window has no Windows title bar. The top 32 px across the full width are the
     handle for dragging; at the top right the Windows buttons lie above it. Below it the bar and main area start
     at the same height. In the browser the strip is dropped. */
  #bar { display: none; }
  .shell #app { grid-template-rows: 32px minmax(0, 1fr); }
  .shell #bar { display: block; grid-column: 2; grid-row: 1; -webkit-app-region: drag; }
  .shell #rail { grid-row: 1 / 3; padding-top: 37px; }
  .shell #rail::before { content: ""; position: fixed; top: 0; left: 0; width: 232px; height: 32px; -webkit-app-region: drag; }
  .shell .brand { -webkit-app-region: drag; }
  .shell #main { grid-row: 2; padding-top: 6px; }
  .shell .band { top: -6px; margin-top: -6px; padding-top: 6px; }
  /* On quit the whole window belongs to the teardown (see renderShutdown): no bar, the wordmark in the strip. */
  .ending #app { grid-template-columns: minmax(0, 1fr); }
  .ending #rail { display: none; }
  .shell.ending #bar { grid-column: 1; padding: 0 14px; font-weight: 600; font-size: 15px; line-height: 32px; color: var(--muted); }
  .shell.ending #bar::before { content: "RunClub"; }
  .ending #main { grid-column: 1; padding: 30px 64px 40px; }
  .ending #main > .stack { max-width: 820px; margin: 0 auto; gap: 30px; }
  .ending .lede { max-width: 56ch; margin: 6px 0 0; }
  .ending .eta .sub { display: block; margin-bottom: 4px; }
  .ending .plan { gap: 48px; }
  .ending .plan > .col:first-of-type { flex-grow: 1.4; }
  .ending .plan > .col:not(:first-of-type) { min-width: 220px; }
  .ending .col { max-width: none; }
  .ending .pill { pointer-events: none; }
  .ending .s-wait .tm { color: var(--muted); }
  /* In the abort line only the job name is truncated, never what happens to it or its quotation marks. */
  .ending .abort { display: flex; min-width: 0; }
  .ending .abort > span { flex: none; }
  .ending .abort > span:first-child { margin-right: .3em; }
  .ending .abort > .jn { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* Project bar */
  #rail { background: var(--rail); padding: 22px 14px 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .brand { font-weight: 600; font-size: 22px; color: var(--ink); padding: 0 12px 14px; }
  .nav { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 12px 8px 36px; position: relative; cursor: pointer; }
  .nav:hover { background: var(--rail-hover); }
  .nav[aria-current="true"] { background: var(--surface); }
  .nav b { display: block; font-weight: 400; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav > span:not(.ic) { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .ic { position: absolute; left: 11px; top: 10px; width: 16px; height: 16px; }
  .nav .ic svg { width: 10px; height: 10px; }
  .nav.plain { padding-left: 12px; }
  .nav > span > .c-fail { display: block; overflow: hidden; text-overflow: ellipsis; }
  .railfoot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 16px; }

  /* Main area */
  #main { overflow-y: auto; padding: 26px 44px 40px; }
  .stack { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .head { display: flex; align-items: flex-end; gap: 24px; }
  .head > div:first-child { min-width: 0; }
  h1 { font-weight: 400; font-size: 26px; line-height: 1.2; color: var(--ink); margin: 0 0 2px; text-wrap: balance; overflow-wrap: anywhere; }
  h2 { font-weight: 400; font-size: 18px; color: var(--ink); margin: 0; }
  .sub { font-size: 13px; font-weight: 400; color: var(--muted); }
  .sub a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .eta { margin-left: auto; text-align: right; white-space: nowrap; }
  .eta b { display: block; font-weight: 200; font-size: 56px; line-height: 1; color: var(--ink); }
  .eta b.small { font-size: 34px; font-weight: 300; }
  .c-fail { color: var(--fail-text) !important; } .c-done { color: var(--done) !important; } .c-run { color: var(--run) !important; }
  .note { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; border: 1px solid var(--edge); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
  .tag.c-fail { border-color: var(--fail-edge); }

  /* Network map */
  .planwrap { overflow-x: auto; padding: 4px 0 72px; margin-bottom: -72px; }
  .plan { position: relative; display: flex; align-items: center; gap: clamp(40px, 6vw, 96px); width: 100%; }
  .plan > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .plan > svg path { fill: none; stroke: var(--track); stroke-width: 2.5; stroke-linecap: round; }
  .plan > svg path { transition: opacity .15s, stroke .15s; }
  .plan > svg path.open { stroke: var(--track-open); stroke-dasharray: 2 7; }
  .plan.tracing > svg path { opacity: .3; }
  .plan.tracing > svg path.on { opacity: 1; stroke: var(--ink); }
  .col { display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; flex: 1 1 0; min-width: 180px; max-width: 280px; }
  .pill { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; width: 100%; min-height: 40px; padding: 8px 16px 8px 9px; border-radius: 21px; background: var(--surface); border: 1px solid var(--edge); position: relative; isolation: isolate; transition: background .2s var(--ease), border-color .2s var(--ease); }
  .pill:hover, .pill:focus-visible { background: var(--raised); border-color: var(--track); z-index: 3; }
  .pill > .ic, .pill > .n, .pill > .tm, .pill > .line { position: relative; z-index: 1; }
  .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--wait); display: grid; place-items: center; color: var(--ground); }
  .ic svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .s-run .ic { background: var(--run); border-color: var(--run); } .s-done .ic { background: var(--done); border-color: var(--done); }
  .s-fail .ic { background: var(--fail); border-color: var(--fail); } .s-cancel .ic { background: var(--cancel); border-color: var(--cancel); }
  .s-skip .ic { border-color: var(--skip); color: var(--skip); } .s-wait .ic { color: var(--wait); }
  .pill .n { color: var(--ink); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill .tm { color: var(--text); }
  .pill .tm.over { color: var(--run); }
  .pill .line { grid-column: 2 / 4; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 2px; }
  /* The details are a second surface in the shape of the pill, congruent behind its content. On hover
     this one shape grows downwards; corners and border do not change. */
  .pill .more { position: absolute; z-index: 0; left: -1px; right: -1px; top: -1px; min-height: calc(100% + 2px); padding-top: 38px; display: grid; grid-template-rows: 0fr; opacity: 0; pointer-events: none; background: var(--raised); border: 1px solid var(--track); border-radius: 21px; transition: grid-template-rows .28s var(--ease), opacity .12s linear; }
  .pill.lined .more { padding-top: 33px; }
  .pill .line { transition: opacity .12s linear; }
  .pill.lined:hover .line, .pill.lined:focus-visible .line { opacity: 0; }
  .pill .more > div { overflow: hidden; font-size: 12px; color: var(--muted); padding: 0 16px 0 41px; }
  .pill .more p { margin: 0; padding: 2px 0 0; overflow-wrap: anywhere; }
  .pill .more p:last-child { padding-bottom: 12px; }
  .pill .more .bit { white-space: nowrap; }
  .pill:hover .more, .pill:focus-visible .more { grid-template-rows: 1fr; opacity: 1; transition-delay: .08s; }
  .pill .pg, .s-run .more::after { position: absolute; z-index: 1; left: 18px; bottom: -1px; height: 2px; width: var(--p, 0%); max-width: calc(100% - 36px); background: var(--run); transition: width 1s linear, opacity .12s linear; }
  .s-run .more::after { content: ""; bottom: 0; }
  .pill:hover > .pg, .pill:focus-visible > .pg { opacity: 0; }
  .col:has(.pill:hover) .pill:not(:hover) .pg, .col:has(.pill:focus-visible) .pill:not(:focus-visible) .pg { opacity: 0; }
  .s-fail.pill { border-color: var(--fail-edge); } .s-fail .line, .s-fail .more > div { color: var(--fail-text); }
  .s-wait.pill, .s-skip.pill { background: transparent; border-style: dashed; }
  .s-wait .n, .s-skip .n { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend .ic { width: 18px; height: 18px; } .legend .ic svg { width: 11px; height: 11px; }

  /* Usage */
  .band { position: sticky; top: -26px; z-index: 4; background: var(--ground); margin-top: -26px; padding: 26px 0 16px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.7fr); gap: 34px; }
  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px; }
  /* Slots: as tall as the curves next to them; the rows scroll within, the legend stays at the bottom. */
  #seats { display: flex; flex-direction: column; min-width: 0; }
  .seatlist { flex: 1 1 0; min-height: 0; contain: size; overflow-y: auto; align-content: start; display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 18px; padding-right: 6px; }
  .seatlist.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seat { display: flex; align-items: center; gap: 8px; height: 22px; font-size: 13px; min-width: 0; }
  .seat b { flex: 1 1 auto; min-width: 0; font-weight: 400; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .dots { display: flex; align-items: center; gap: 4px; flex: none; }
  .seat .ic, .seatkey .ic { width: 14px; height: 14px; border-width: 1.5px; } .seat .ic svg, .seatkey .ic svg { width: 10px; height: 10px; }
  .seat .s-wait circle, .seatkey .s-wait circle { r: 3px; }
  /* The reserve is equally wide in all rows (--rsv dots), so the slot symbols end at one edge. */
  .rsvs { display: flex; align-items: center; gap: 4px; flex: none; width: calc(var(--rsv) * 11px - 4px); margin-left: 4px; }
  .rsv { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--track); }
  .rsv.on { background: var(--track); } .rsv.half { background: linear-gradient(90deg, var(--track) 50%, transparent 50%); }
  .seatlist.one .seat { gap: 10px; } .seatlist.one .seat b { flex: none; }
  .seatlist.one .seat .ic { width: 16px; height: 16px; }
  .seatlist.one .rsvs { width: auto; min-width: 16px; margin: 0; justify-content: center; gap: 2px; }
  .seatkey { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-top: 8px; font-size: 11px; color: var(--muted); }
  .seatkey > span { display: inline-flex; align-items: center; gap: 5px; }
  .k { font-size: 12px; font-weight: 400; color: var(--muted); }
  .v { font-size: 26px; line-height: 1.25; color: var(--ink); }
  .v small { font-size: 13px; color: var(--muted); }
  .chart { display: block; width: 100%; height: 74px; margin-top: 6px; cursor: crosshair; }
  .chart polyline { fill: none; stroke: var(--chart); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .chart polygon { fill: var(--chart); opacity: .16; }
  .chart.warn polyline { stroke: var(--fail); } .chart.warn polygon { fill: var(--fail); }
  .chart line { vector-effect: non-scaling-stroke; stroke-width: 1; }
  .chart .cap { stroke: var(--cap); } .chart .mid { stroke: var(--rule); } .chart .mark { stroke: var(--wait); stroke-dasharray: 2 3; }
  .chart .peak { stroke: var(--chart); stroke-dasharray: 1 4; opacity: .7; } .chart.warn .peak { stroke: var(--fail); } .chart .cross { stroke: var(--ink); }
  .ax { display: flex; justify-content: space-between; font-size: 11px; font-weight: 400; color: var(--muted); margin: 3px 0 4px; }
  .label { font-size: 12px; font-weight: 400; color: var(--muted); margin-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  th { font-weight: 400; color: var(--muted); }
  table.fixed { table-layout: fixed; min-width: 640px; } table.fixed th.r { width: 96px; }
  td.top { color: var(--ink); font-weight: 400; }
  table.set td { vertical-align: middle; } table.set td.r { width: 96px; }
  td.cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; width: 60%; }
  td.r, th.r { text-align: right; padding: 6px 0 6px 12px; white-space: nowrap; }
  .dim { color: var(--muted); }
  .scroll { overflow-x: auto; }
  .scroll::-webkit-scrollbar { height: 8px; } .scroll::-webkit-scrollbar-button { display: none; } .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 999px; }
  .quiet { display: grid; grid-template-columns: 190px minmax(0, 1fr) auto; column-gap: 20px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .quiet a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .quiet .who { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 400; min-width: 0; }
  .quiet .who:hover { text-decoration: underline; text-underline-offset: 3px; }
  .quiet .ic, .mini .ic { width: 16px; height: 16px; flex: none; } .quiet .ic svg, .mini .ic svg { width: 10px; height: 10px; }
  .mini { display: inline-flex; align-items: center; margin-right: 12px; vertical-align: -3px; } .mini i { width: 9px; height: 2px; background: var(--track); }
  .quiet .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Controls */
  section + section { border-top: 1px solid var(--rule); padding-top: 22px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .g { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 30px; background: var(--surface); border: 1px solid var(--edge); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 400; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--raised); border-color: var(--track); }
  .btn:active { background: var(--edge); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
  .btn[aria-disabled="true"]:hover, .btn[aria-disabled="true"]:active { background: var(--surface); border-color: var(--edge); }
  .btn[aria-expanded] .g { transition: transform .2s var(--ease); }
  .btn[aria-expanded="true"] .g { transform: rotate(90deg); }
  .push { margin-left: auto; }
  .btn.danger { color: var(--fail-text); border-color: var(--fail-edge); }
  .btn.step, .btn.only { width: 30px; padding: 5px 0; }
  /* "Re-run job": the button is not inside the pill's link but next to it in the same frame
     (.job) and appears on the right in the expanded details. Over it the pill behaves as if hovered. It sits
     on `raised` and therefore takes the border tones as steps, like the buttons of the confirmation. */
  .job { position: relative; }
  .job:hover > .pill, .job:has(:focus-visible) > .pill { background: var(--raised); border-color: var(--track); z-index: 3; }
  .job:hover > .pill.lined .line, .job:has(:focus-visible) > .pill.lined .line { opacity: 0; }
  .job:hover > .pill .more, .job:has(:focus-visible) > .pill .more { grid-template-rows: 1fr; opacity: 1; transition-delay: .08s; }
  .job .more > div { padding-right: 46px; }
  .job .more p:last-child { padding-bottom: 19px; }
  .job > .rejob { position: absolute; z-index: 4; right: 6px; top: 40px; opacity: 0; pointer-events: none; background: var(--edge); border-color: var(--cap); transition: opacity .12s linear, background .15s, border-color .15s; }
  .job:has(.lined) > .rejob { top: 35px; }
  .job:hover > .rejob, .job:has(:focus-visible) > .rejob { opacity: 1; pointer-events: auto; transition-delay: .08s, 0s, 0s; }
  .job > .rejob:hover { background: var(--cap); border-color: var(--track); }
  .job > .rejob:active { background: var(--raised); }
  .job:hover > .rejob[aria-disabled="true"], .job:has(:focus-visible) > .rejob[aria-disabled="true"] { opacity: .5; background: var(--edge); border-color: var(--cap); }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper b { min-width: 22px; text-align: center; font-weight: 400; color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 5px 14px; cursor: pointer; font-size: 13px; font-weight: 400; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
  .seg button[aria-disabled="true"] { opacity: .5; cursor: default; }
  input[type=text] { background: var(--rail); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; min-width: 0; }
  input[type=text]::placeholder { color: var(--muted); }
  input.sw { appearance: none; flex: none; width: 38px; height: 22px; margin: 0; border-radius: 999px; background: var(--rail); border: 1px solid var(--edge); position: relative; cursor: pointer; transition: background .15s, border-color .15s; }
  input.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s var(--ease), background .15s; }
  input.sw:checked { background: var(--raised); border-color: var(--track); }
  input.sw:checked::after { transform: translateX(16px); background: var(--ink); }
  input[type=range] { appearance: none; width: 100%; height: 22px; margin: 0; background: none; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--chart) var(--v), var(--edge) var(--v)); }
  input[type=range]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--ink); border: 0; }
  input[type=range]:disabled { opacity: .5; cursor: default; }
  code { font: 12px Consolas, monospace; color: var(--text); overflow-wrap: anywhere; }
  /* Log: one row per message of time, project, state symbol and text; the newest is on top. */
  .log { list-style: none; margin: 0; padding: 0; }
  .log.open { max-height: 496px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: 92px 128px 16px minmax(0, 1fr); column-gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .log.noproject li { grid-template-columns: 92px 16px minmax(0, 1fr); }
  .log time, .log .lp { font-size: 13px; font-weight: 400; color: var(--muted); }
  .log time { white-space: nowrap; } .log .lp { overflow-wrap: anywhere; }
  .log .ic { width: 16px; height: 16px; align-self: start; margin-top: 2px; } .log .ic svg { width: 10px; height: 10px; }
  .log .lm { overflow-wrap: anywhere; }
  .seg.wide { flex-wrap: wrap; max-width: 100%; }
  .empty { max-width: 52ch; }

  /* Settings: a line with one stop per section */
  .set { max-width: 860px; }
  .route { display: flex; flex-direction: column; gap: 44px; padding-left: 44px; }
  .route section + section { border-top: 0; padding-top: 0; }
  .stop { position: relative; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 20px; }
  .stop:not(:last-child)::before { content: ""; position: absolute; left: -37px; top: 14px; width: 2.5px; height: calc(100% + 44px); background: var(--track); }
  .stophead { display: flex; align-items: baseline; gap: 16px; padding-bottom: 8px; }
  .stopdot { position: absolute; left: -44px; top: 4px; width: 17px; height: 17px; padding: 0; border-radius: 50%; background: var(--ground); border: 2.5px solid var(--track); cursor: pointer; transition: border-color .15s, background .15s; }

    infoAbout: 'Mehr zu „{0}“', authWhatShort: 'RunClub verwaltet damit Runner und Läufe in den Repos, auf denen die App installiert ist.',
    authOutInfo: 'GitHub fragt dabei, ob du die App RunClub für dein Konto zulässt. Sie darf nur in den Repos, auf denen sie installiert ist, Runner an- und abmelden, Läufe lesen und erneut starten und CI_RUNNER setzen, dazu deine Abrechnung für die GitHub-Minuten lesen.',
    projectsInfo: 'Jedes Projekt hat einen eigenen Pool. Plätze sind Jobs, die zugleich laufen können; jeder Job bekommt einen frischen Linux-Container mit eigenem Docker. Eine Reserve vorbereiteter Runner und die Caches (Pakete, Build-Layer, aus den Jobs gelernte Abbilder) fangen den Aufbau ab.', routeNoneInfo: 'Mit diesem Ausdruck nehmen die Jobs deine Runner, solange CI_RUNNER gesetzt ist, und sonst ubuntu-latest bei GitHub. CI_RUNNER setzt RunClub mit „Auf eigene Runner umschalten“.', fitGenerousInfo: 'Das schadet nicht, schützt den Rechner aber weniger: Ein Job, der aus dem Ruder läuft, darf mehr belegen, bevor er abbricht.',
    limitsInfo: 'Ein Limit begrenzt, wie viel Speicher und wie viele Kerne ein Job belegen darf, getrennt für den Runner und sein Docker. Es schützt den Rechner vor einem Job, der aus dem Ruder läuft; reicht es dem Job nicht, bricht er ab. Projekte ohne eigene Werte nehmen die Limits hier.', budgetOverInfo: 'Jobs schöpfen ihr Limit selten aus; eng wird es erst, wenn mehrere es zugleich tun. Mehr Sicherheit geben niedrigere Limits, weniger Plätze oder eine größere Docker-VM.', budgetHow: 'Der Balken zeigt je Platz ein Feld, so breit wie das Limit seines Projekts. Ein Projekt mit Cache hat dazu seinen Build-Dienst; er zählt zuerst und läuft auch, während der Pool pausiert. Gefüllt ist, was mit vollem Limit in die Docker-VM passt, gestrichelt der Rest.', logInfo: 'Die letzten Meldungen aus runclub.log, die neueste oben. Kopieren und Speichern nehmen die ganze Datei. Auf ein Projekt gefiltert bleiben die allgemeinen Fehler dabei, weil dort oft die Ursache steht.',
    dayInfo: 'Je Zeitabschnitt der höchste gemessene Wert. Wo eine Kurve abreißt, lief RunClub nicht.', quotaInfo: 'Das Limit gilt für dein ganzes GitHub-Konto; auch gh im Terminal und andere Werkzeuge zählen mit. Ab der gepunkteten Marke fragt RunClub seltener ab. Ist nur noch die Reserve übrig, fragt es gar nicht mehr, bis das Fenster wieder voll ist.', quotaTightInfo: 'Läufe und Restzeiten erscheinen so lange mit Verzögerung. Die Runner arbeiten unverändert.', quotaOutInfo: 'Laufende Jobs arbeiten weiter, die Anzeige bleibt so lange stehen. Die letzten Anfragen sind für neue Runner reserviert.',

    minutesOtherPlan: 'Für andere Tarife steht nur das Verbrauchte da, ohne Obergrenze.', minutesTightInfo: 'Sind sie weg, startet GitHub in privaten Repos auf seinen Runnern keine Läufe mehr, solange dort kein Budget gesetzt ist.', minutesOutInfo: 'Die enthaltenen Minuten sind aufgebraucht; das betrifft private Repos auf GitHubs Runnern. Mit einem Pool („Pool anlegen“ in den Einstellungen) laufen die Jobs auf diesem Rechner und brauchen keine Minuten. Ob bei GitHub ein Budget gesetzt ist, sieht RunClub nicht.', minutesBudgetInfo: 'Das gilt für private Repos auf GitHubs Runnern. Wie hoch das Budget ist und wann es erreicht ist, sieht RunClub nicht.',

// The app's confirmation: the heading names what is about to happen, below it the consequence. "Cancel" has
// focus; Escape and a click beside the box cancel as well.
function ask({ title, text, ok, danger }) {
  const box = document.getElementById('ask');
  const yes = document.getElementById('askYes');
  const no = document.getElementById('askNo');
  document.getElementById('askTitle').textContent = title;
  document.getElementById('askText').textContent = text;
  yes.textContent = ok;
  yes.className = 'btn' + (danger ? ' danger' : '');
  no.textContent = t('cancel');
  return new Promise((resolve) => {
    box.returnValue = '';
    yes.onclick = () => box.close('yes');
    no.onclick = () => box.close('');
    box.onclick = (event) => { if (event.target === box) box.close(''); };
    box.onclose = () => resolve(box.returnValue === 'yes');
    box.showModal();
    no.focus();
  });
}

let toastTimer;
function toast(text) { const el = document.getElementById('toast'); el.textContent = text; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 5000); }
async function call(action, body) {
  try {
    const response = await fetch('/api/' + action, { method: 'POST', headers: { 'content-type': 'application/json', 'x-rc-token': TOKEN }, body: JSON.stringify(body ?? {}) });
    const answer = await response.json();
    if (!response.ok) { toast(answer.msg ? said(answer.msg) : answer.error || t('stale')); return false; }
    refresh(); return true;
  } catch { toast(t('noAnswer')); return false; }
}

// --- Project bar ---

function projectState(entry) {
  const jobs = entry.pipelines.flatMap((p) => p.jobs);
  const failed = jobs.filter((j) => jobState(j) === 'fail').length;
  if (entry.pipelines.length) {
    const finish = entry.pipelines.map((p) => p.finishAt).filter(Boolean).sort().pop();
    return { dot: failed ? 'fail' : 'run', text: [failed ? t('failedN', failed) : '', finish ? '<span data-finish="' + esc(finish) + '"></span>' : t('noRunner')].filter(Boolean).join(' · ') };
  }
  if (entry.notFound) return { dot: 'fail', text: t('notFoundTag') };
  if (entry.pool?.blocked) return { dot: 'fail', text: t('blockedTag') };
  if (entry.pool?.paused) return { dot: 'idle', text: t('paused') };
  if (entry.pool && !entry.pool.checked) return { dot: 'wait', text: t('checking') };
  const last = entry.lastRun;
  if (last?.conclusion === 'failure') return { dot: 'fail', text: t('failed') + ' <span data-ago="' + esc(last.updatedAt) + '"></span>' };
  if (last && secondsSince(last.updatedAt) < 1800) return { dot: 'done', text: t('finished') + ' <span data-ago="' + esc(last.updatedAt) + '"></span>' };
  return { dot: 'idle', text: t('ready') };
}

// Projects whose jobs reached their limit or came close to it: there is something to do in the settings.
function limitTrouble() {
  const at = (state) => data.repos.filter((entry) => entry.pool?.limits?.fit?.state === state);
  const full = at('full');
  const repos = full.length ? full : at('tight');
  return repos.length ? { text: t(full.length ? 'tagFull' : 'tagTight'), repos: repos.map((entry) => entry.repo) } : null;
}

function columnsOf(pipeline) {
  const jobs = pipeline.jobs;
  if (!pipeline.graph || jobs.every((j) => !j.needs.length)) { // without dependencies: in start order, six per column
    const ordered = [...jobs].sort((a, b) => String(a.startedAt ?? '9').localeCompare(String(b.startedAt ?? '9')));
    return Array.from({ length: Math.ceil(ordered.length / 6) }, (_, i) => ordered.slice(i * 6, i * 6 + 6));
  }
  const columns = [];
  for (const job of jobs) (columns[job.stage] ??= []).push(job);
  const rowOf = new Map();
  columns.filter(Boolean).forEach((column, index) => { // order as for the predecessors, so that lines cross little
    if (index) column.sort((a, b) => Math.min(...a.needs.map((n) => rowOf.get(n) ?? 99), 99) - Math.min(...b.needs.map((n) => rowOf.get(n) ?? 99), 99));
    column.forEach((job, row) => rowOf.set(job.name, row / Math.max(1, column.length - 1)));
  });
  return columns.filter(Boolean);
}

// `again`: the repo if the jobs of this run can be re-run (the run is finished), otherwise empty.
// Runs and jobs that were just re-run ("repo/id" -> when): their buttons stay disabled until
// GitHub shows the new attempt and they disappear with it; a second click would only bring a refusal.
const restarted = new Map();
const RESTART_HOLD_MS = 60000;
const held = (repo, id) => (Date.now() - (restarted.get(repo + '/' + id) ?? 0) < RESTART_HOLD_MS ? ' aria-disabled="true"' : '');

function pill(j, again) {
  const state = jobState(j);
  const bit = (text) => (text ? '<span class="bit">' + esc(text) + '</span>' : '');
  const lines = [];
  let time = '';
  const usual = j.estimate ? t('usual', clock(j.estimate)) : '';
  const step = j.step ? t('step', j.step.number, j.step.total, j.step.name) : '';
  if (state === 'run') {
    time = '<span class="tm" data-since="' + esc(j.startedAt) + '" data-est="' + (j.estimate ?? '') + '"></span>';
    if (step) lines.push(esc(step));
    lines.push([bit(seatOf.get(j.runner) ? t('seatN', seatOf.get(j.runner)) : ''), j.estimate ? '<span class="bit" data-usual="' + esc(j.startedAt) + '" data-est="' + j.estimate + '"></span>' : ''].filter(Boolean).join(' · '));
  } else if (state === 'wait') {
    time = j.estimate ? '<span class="tm dim">' + t('approx', clock(j.estimate)) + '</span>' : '';
    lines.push([bit(j.status === 'pending' ? t('notYet') : ''), esc(j.needs.length ? t('waitsFor', j.needs.join(', ')) : t('waitsRunner'))].filter(Boolean).join(' · '));
  } else {
    time = j.duration != null && state !== 'skip' ? '<span class="tm">' + clock(j.duration) + '</span>' : '';
    lines.push(state === 'fail' && step ? esc(step) : state === 'done' && usual ? bit(usual) : bit(t('s_' + state)));
  }
  const full = lines.filter(Boolean);
  const lined = Boolean(full.length) && (mode === 'detail' || state === 'fail');
  const link = '<a class="pill s-' + state + (lined ? ' lined' : '') + '" data-job="' + esc(j.name) + '" data-needs="' + esc(JSON.stringify(j.needs)) + '" href="' + esc(j.url) + '" target="_blank" rel="noopener">' + icon(state) +
    '<span class="n">' + esc(j.name) + '</span>' + time + (lined ? '<span class="line">' + full[0] + '</span>' : '') + '<div class="more"><div>' + full.map((line) => '<p>' + line + '</p>').join('') + '</div></div>' +
    (state === 'run' ? '<i class="pg" data-progress="' + esc(j.startedAt) + '" data-est="' + (j.estimate ?? '') + '"></i>' : '') + '</a>';
  // The pill is a link; the button therefore sits next to it, not inside it.
  // A skipped job never ran: there is nothing to re-run.
  if (!again || !j.id || j.status !== 'completed' || state === 'skip') return link;
  return '<div class="job">' + link + '<button class="btn only rejob" data-do="job/rerun" data-repo="' + esc(again) + '" data-id="' + esc(j.id) + '"' + held(again, j.id) + ' aria-label="' + esc(t('rerunJob')) + '" data-tip="' + esc(t('rerunJob')) + '">' + glyph('rerun') + '</button></div>';
}

// `repo` is in the header if `named`. A finished run carries below the header what can be re-run.
function runBlock(pipeline, running, repo, named) {
  const jobs = pipeline.jobs;
  const done = jobs.filter((j) => j.status === 'completed').length;
  const failed = jobs.filter((j) => jobState(j) === 'fail').length;
  let big;
  let sub;
  if (running) {
    big = pipeline.finishAt ? '<b data-finish="' + esc(pipeline.finishAt) + '" data-short="1"></b>' : '<b class="small">' + t('noRunner') + '</b>';
    sub = [t('untilDone'), t('jobsDone', done, jobs.length), failed ? '<span class="c-fail">' + t('failedN', failed) + '</span>' : '', pipeline.rough ? t('rough') : ''].filter(Boolean).join(' · ');
  } else {
    const word = { success: ['finished', 'c-done'], failure: ['failed', 'c-fail'], cancelled: ['cancelled', ''] }[pipeline.conclusion] ?? ['finished', ''];
    big = '<b class="small ' + word[1] + '">' + t(word[0]) + '</b>';
    sub = '<span data-ago="' + esc(pipeline.updatedAt) + '"></span> · ' + t('took', clock(secondsSince(pipeline.startedAt) - secondsSince(pipeline.updatedAt)));
  }
  const again = !running && repo && pipeline.id ? repo : '';
  const rerun = (text, tip, only) => '<button class="btn" data-do="run/rerun" data-repo="' + esc(repo) + '" data-id="' + esc(pipeline.id) + '"' + (only ? ' data-failed-only="1"' : '') + held(repo, pipeline.id) + ' data-tip="' + esc(t(tip)) + '">' + (only ? '' : glyph('rerun')) + t(text) + '</button>';
  const acts = again ? '<div class="row">' + rerun('rerun', 'rerunTip') + (failed || ['failure', 'cancelled', 'timed_out'].includes(pipeline.conclusion) ? rerun('rerunFailed', 'rerunFailedTip', true) : '') + '</div>' : '';
  const meta = [named ? esc(repo) : '', esc(pipeline.workflow), esc(pipeline.branch || pipeline.event), running ? '<span data-running="' + esc(pipeline.startedAt) + '"></span>' : t('lastRun')].filter(Boolean).join(' · ');
  return '<div class="stack" style="gap:14px"><div class="head"><div><h1>' + esc(pipeline.title || pipeline.workflow) + '</h1><div class="sub"><a href="' + esc(pipeline.url) + '" target="_blank" rel="noopener">' + meta + '</a></div></div><div class="eta">' + big + '<div class="sub">' + sub + '</div></div></div>' + acts +
    '<div class="planwrap"><div class="plan' + (mode === 'detail' ? ' detail' : '') + '"><svg aria-hidden="true"></svg>' + columnsOf(pipeline).map((column) => '<div class="col">' + column.map((j) => pill(j, again)).join('') + '</div>').join('') + '</div></div>' +
    (pipeline.graph ? '' : '<div class="note">' + t('noGraph') + '</div>') + '</div>';
}

// Lines between the pills: from the right middle of the predecessor into the left middle of the successor.
function drawLinks(plan) {
  const box = plan.getBoundingClientRect();
  const pills = new Map([...plan.querySelectorAll('.pill')].map((el) => [el.dataset.job, el]));
  let paths = '';
  for (const [, el] of pills) {
    const to = el.getBoundingClientRect();
    for (const name of JSON.parse(el.dataset.needs)) {
      const parent = pills.get(name);
      if (!parent) continue;
      const from = parent.getBoundingClientRect();
      const x1 = from.right - box.left, y1 = from.top + from.height / 2 - box.top, x2 = to.left - box.left, y2 = to.top + to.height / 2 - box.top, split = x1 + (x2 - x1) * 0.3, join = x2 - (x2 - x1) * 0.3, bend = Math.max(12, (join - split) * 0.55);
      const on = traced && plan.contains(traced) && (name === traced.dataset.job || el.dataset.job === traced.dataset.job);
      paths += '<path data-from="' + esc(name) + '" data-to="' + esc(el.dataset.job) + '" class="' + (/s-(wait|skip)/.test(el.className) ? 'open' : '') + (on ? ' on' : '') + '"' + ' d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' H' + split.toFixed(1) + ' C' + (split + bend).toFixed(1) + ' ' + y1.toFixed(1) + ' ' + (join - bend).toFixed(1) + ' ' + y2.toFixed(1) + ' ' + join.toFixed(1) + ' ' + y2.toFixed(1) + ' H' + x2.toFixed(1) + '"/>';
    }
  }
  plan.querySelector('svg').innerHTML = paths;
  plan.classList.toggle('tracing', Boolean(traced && plan.contains(traced)));
}
const observer = new ResizeObserver((entries) => { for (const plan of new Set(entries.map((entry) => entry.target.closest('.plan')).filter(Boolean))) drawLinks(plan); });
function watchPlans(root) {
  observer.disconnect();
  for (const plan of root.querySelectorAll('.plan')) {
    drawLinks(plan);
    for (const el of plan.querySelectorAll('.pill')) observer.observe(el);
  }
}
// On hovering a pill, highlight its lines and tone down the rest.
let traced = null;
function trace(event) {
  // The button next to a pill (see .job) belongs to it.
  const pill = event.target.closest ? event.target.closest('.pill') ?? event.target.closest('.job')?.querySelector('.pill') ?? null : null;
  const active = pill && (event.type === 'mouseover' || event.type === 'focusin');
  traced = active ? pill : null;
  for (const plan of document.querySelectorAll('.plan')) {
    const here = active && plan.contains(pill);
    plan.classList.toggle('tracing', Boolean(here));
    for (const path of plan.querySelectorAll('path')) path.classList.toggle('on', Boolean(here) && (path.dataset.from === pill.dataset.job || path.dataset.to === pill.dataset.job));
  }
}
for (const type of ['mouseover', 'mouseout', 'focusin', 'focusout']) document.addEventListener(type, trace);

const legend = () => '<div class="legend">' + ['run', 'done', 'fail', 'cancel', 'skip', 'wait'].map((state) => '<span class="s-' + state + '">' + icon(state) + t('s_' + state) + '</span>').join('') + '</div>';

// --- Usage ---

function chart(id, label, value, of, source, max, format, warn, marks, note) {
  const at = source.at || [];
  const values = source.values || [];
  const span = source.span;
  charts[id] = { at, values, span, format };
  const headline = '<div class="k">' + label + '</div>' + (value ? '<div class="v' + (warn ? ' c-fail' : '') + '">' + value + ' <small>' + of + '</small></div>' : '');
  if (values.length < 2) return '<div>' + headline + '<div class="ax"><span>' + t('follows') + '</span></div></div>';
  const end = Date.now();
  const x = (time) => ((1 - (end - time) / span) * 300);
  const y = (v) => 70 - Math.min(1, v / max) * 62;
  const first = Math.max(0, at.findIndex((time) => end - time <= span));
  // Where nothing was measured for a while (the app was off), the curve breaks off instead of bridging the gap.
  const pieces = [];
  values.slice(first).forEach((v, i) => {
    if (!i || at[first + i] - at[first + i - 1] > span / 48) pieces.push([]);
    pieces.at(-1).push(x(at[first + i]).toFixed(1) + ',' + y(v).toFixed(1));
  });
  for (const points of pieces) if (points.length === 1) { const [px, py] = points[0].split(','); points.push((Number(px) + 1).toFixed(1) + ',' + py); } // a single point would be invisible
  const edge = (point) => point.split(',')[0] + ',74';
  const curve = pieces.map((points) => '<polygon points="' + edge(points[0]) + ' ' + points.join(' ') + ' ' + edge(points.at(-1)) + '"/><polyline points="' + points.join(' ') + '"/>').join('');
  const peak = Math.max(...values.slice(first));
  const peakAt = at[first + values.slice(first).indexOf(peak)];
  const shown = marks.filter((time) => end - time < span);
  return '<div>' + headline + '<svg class="chart' + (warn ? ' warn' : '') + '" data-chart="' + id + '" viewBox="0 0 300 74" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
    '<line class="cap" x1="0" x2="300" y1="8" y2="8"/><line class="mid" x1="0" x2="300" y1="39" y2="39"/>' + shown.map((time) => '<line class="mark" x1="' + x(time).toFixed(1) + '" x2="' + x(time).toFixed(1) + '" y1="0" y2="74"/>').join('') +
    curve + '<line class="peak" x1="0" x2="300" y1="' + y(peak).toFixed(1) + '" y2="' + y(peak).toFixed(1) + '"/></svg>' +
    '<div class="ax"><span>' + (span > 3600000 ? t('before24') : t('before30')) + '</span>' + (shown.length ? '<span class="wide">' + t('started') + '</span>' : '') + '<span>' + t('now') + '</span></div><div class="k' + (warn ? ' c-fail' : '') + '">' + (note ? note + ' · ' : '') + t('peak', format(peak), ago(new Date(peakAt).toISOString())) + '</div></div>';
}

function bandCharts(marks) {
  const m = data.machine;
  const u = m.usage;
  const s = m.series;
  const tight = m.memoryFree < m.memoryTotal * 0.08;
  const src = (key) => ({ at: s.at, values: s[key], span: 30 * 60000 });
  const vmTight = m.vmTight; // the Docker VM itself reports hardly any free memory: { free }
  return chart('vmMem', t('vmMem'), num((u.vmUsed ?? u.vmMemory + u.otherMemory) / 1073741824), t('of', gb(m.dockerMemory || m.memoryTotal)), src('vmMemory'), m.dockerMemory || m.memoryTotal, gb, Boolean(vmTight), marks, vmTight ? t('freeOnly', gb(vmTight.free)) : '') +
    chart('vmCpu', t('vmCpu'), num(u.vmCpu + u.otherCpu), t('cores', m.dockerCpus), src('vmCpu'), m.dockerCpus, (v) => num(v), false, marks) +
    chart('hostMem', t('hostMem'), num((m.memoryTotal - m.memoryFree) / 1073741824), t('of', gb(m.memoryTotal)), src('hostMemory'), m.memoryTotal, gb, tight, marks, tight ? t('freeOnly', gb(m.memoryFree)) : '');
}

// A slot as a state symbol like in the network map: working is running, ready is the empty ring, everything preparatory
// (starting, waiting, cleaning up) is waiting. Red only if the slot is faulty; a paused or switched-off one is skipped.
const SEAT_STATE = { [SLOT.WORKING]: 'run', [SLOT.READY]: 'idle', [SLOT.BROKEN]: 'fail', [SLOT.PAUSED]: 'skip', [SLOT.OFF]: 'skip' };
const seatState = (r) => SEAT_STATE[r.state] ?? 'wait';

// Slots: one row per project with one symbol per slot and one dot per runner of the reserve. The reserve is equally
// wide in all rows so the slot symbols end at one edge. A single project shows one row per slot
// with the state in words and needs no legend. Otherwise the legend sits outside the scrolling part
// and so stays at the bottom of the band.
function seats(entries) {
  const single = entries.length === 1;
  const reserveOf = (entry) => Math.max(entry.pool?.reserveWanted ?? 0, entry.pool?.reserve ?? 0);
  const active = entries.filter((entry) => !entry.pool?.paused);
  const widest = Math.max(0, ...active.map(reserveOf));
  const seatIcon = (r, index) => '<span class="s-' + seatState(r) + '" data-tip="' + esc([t('seatN', index + 1), runnerState(r), r.state === SLOT.WORKING ? r.job?.job : ''].filter(Boolean).join(' · ')) + '">' + icon(seatState(r)) + '</span>';
  const reserveDots = (entry) => {
    const count = reserveOf(entry);
    const ready = entry.pool?.reserve ?? 0;
    return '<span class="rsvs">' + Array.from({ length: count }, (_, k) => '<i class="rsv ' + (k < ready ? 'on' : 'half') + '" data-tip="' + esc(t('reserveTip', ready, count)) + '"></i>').join('') + '</span>';
  };
  // A resting pool shows why instead of the slots: blocked (see blocks.js) as a fault, otherwise "paused".
  const paused = (entry) => (entry.pool?.blocked ? '<span class="s-fail">' + icon('fail') + '</span><span class="dim">' + t('blockedTag') + '</span>' : '<span class="dim">' + t('paused') + '</span>');
  const row = (inner) => '<div class="seat">' + inner + '</div>';
  const rows = single
    ? (entries[0].pool?.paused ? row(paused(entries[0])) : entries[0].runners.map((r, index) => row(seatIcon(r, index) + '<b>' + t('seatN', index + 1) + '</b><span class="dim">' + esc(runnerState(r)) + '</span>')).join('') +
      (reserveOf(entries[0]) ? row(reserveDots(entries[0]) + '<b>' + t('reserveWord') + '</b><span class="dim">' + t('reserveSum', entries[0].pool?.reserve ?? 0, reserveOf(entries[0])) + '</span>') : ''))
    : entries.map((entry) => row('<b data-tip="' + esc(entry.repo) + '">' + esc(shortRepo(entry.repo)) + '</b><span class="dots">' + (entry.pool?.paused ? paused(entry) : entry.runners.map(seatIcon).join('') + (widest ? reserveDots(entry) : '')) + '</span>')).join('');
  const shown = new Set(active.flatMap((entry) => entry.runners.map(seatState)));
  const keys = ['run', 'idle', 'wait', ...['fail', 'skip'].filter((state) => shown.has(state))];
  const words = { run: SLOT.WORKING, idle: SLOT.READY, wait: SLOT.STARTING, fail: SLOT.BROKEN, skip: SLOT.OFF };
  const open = active.some((entry) => (entry.pool?.reserve ?? 0) < (entry.pool?.reserveWanted ?? 0));
  return '<div class="label">' + t('seats') + '</div><div class="seatlist ' + (single ? 'one' : 'two') + '" style="--rsv:' + widest + '">' + rows + '</div>' + (single ? '' :
    '<div class="seatkey">' + keys.map((state) => '<span class="s-' + state + '">' + icon(state) + stateText(words[state]) + '</span>').join('') +
    '<span data-tip="' + esc(t('reserveKeyTip')) + '"><i class="rsv on"></i>' + (open ? '<i class="rsv half"></i>' : '') + t('reserveWord') + '</span></div>');
}

// --- Views ---

// The GitHub account's rate limit if it is tight or used up; otherwise null.
// `out` means: RunClub no longer queries at all. Only that is a fault and red.
// The only place that knows the backend's state words (see STATE in github.js).
const quotaState = () => ({ tight: data.quota?.state === 'tight', out: data.quota?.state === 'out' });
const quotaTrouble = () => { const { tight, out } = quotaState(); return tight || out ? { out, text: t(out ? 'quotaOutShort' : 'quotaTightShort') } : null; };
// The same for the GitHub Actions minutes quota (see STATE in minutes.js, the rules are there). `out`
// means: without a budget GitHub starts nothing more on its runners.
const minutesState = () => ({ tight: data.minutes?.state === 'tight', out: data.minutes?.state === 'out' });
const minutesTrouble = () => { const { tight, out } = minutesState(); return tight || out ? { out, text: t(out ? 'minutesOutShort' : 'minutesTightShort') } : null; };
// What "Usage" reports in the bar: one row, even if both apply. Used up goes before tight; on a
// tie, requests go before minutes, because without requests the display stops too.
const usageTrouble = () => { const found = [quotaTrouble(), minutesTrouble()].filter(Boolean); return found.find((entry) => entry.out) ?? found[0] ?? null; };
// A rail: filled up to `share` (0 to 1), red on `alarm`, with the dotted mark at `mark`.
const fillBar = (share, alarm, mark) => '<i' + (alarm ? ' class="alarm"' : '') + ' style="--v:' + (Math.min(1, Math.max(0, share || 0)) * 100).toFixed(1) + '%;--mark:' + (mark * 100).toFixed(1) + '%"></i>';
const warnings = (entries) => [data.machine.docker.ready || setupMissing().length ? '' : t('docker', data.machine.docker.error ? said(data.machine.docker.error) : t('dockerStarting')), authTrouble() ?? '', quotaTrouble()?.out ? t('quotaOutTag', hourMinute(data.quota.resetAt)) : '', ...entries.filter((e) => e.error).map((e) => t('github', said(e.error))), ...entries.filter((e) => e.pool?.blocked).map((e) => t('blockedWarn', shortRepo(e.repo)))].filter(Boolean).map((text) => '<span class="tag c-fail">' + esc(text) + '</span>').join(' ');

// Heading of a view with a sentence below; `cls` colours the sentence, `more` is an info element at the title.
const viewHead = (title, sub, cls, more = '') => '<div class="head"><div>' + (more ? '<div class="h1row"><h1>' + title + '</h1>' + more + '</div>' : '<h1>' + title + '</h1>') + '<div class="sub' + (cls ? ' ' + cls : '') + '">' + sub + '</div></div></div>';

// Repos without a pool where nothing moves: one row each with the offer to create a pool. Either
// jobs are waiting for one of your own runners (which ones is in the tooltip), or runs did not start because the minutes at
// GitHub are used up. That is a fault with a way out: the symbol is red, the tooltip names the way out.
function unservedRows() {
  return (data.unserved ?? []).map((entry) => {
    // Per reason: state symbol, stem of the text keys, how many there are, what the tooltip says.
    const row = entry.reason === 'minutes' ? { state: 'fail', text: 'noMinutes', count: entry.runs, tip: t('noMinutesTip') } : { state: 'wait', text: 'unserved', count: entry.jobs.length, tip: entry.jobs.join(', ') };
    return '<div class="quiet"><a class="who s-' + row.state + '" href="' + esc(entry.url) + '" target="_blank" rel="noopener" data-tip="' + esc(entry.repo) + '">' + icon(row.state) + esc(shortRepo(entry.repo)) + '</a>' +
      '<div class="what" data-tip="' + esc(row.tip) + '">' + esc(t(row.text + (row.count === 1 ? 'One' : 'Many'), row.count, span(secondsSince(entry.since)))) + '</div>' +
      '<button class="btn" data-pick="' + esc(entry.repo) + '">' + glyph('plus') + t('addButton') + '</button></div>';
  }).join('');
}

// "All projects": what runs is shown large; quiet projects one row each.
function quietRows(entries) {
  return entries.map((entry) => {
    const last = entry.lastRun;
    const state = entry.pool?.blocked ? 'fail' : entry.pool?.paused ? 'idle' : last ? jobState({ status: 'completed', conclusion: last.conclusion }) : 'idle';
    const jobs = last ? [...last.jobs].sort((a, b) => a.stage - b.stage) : [];
    const mini = jobs.length > 1 ? '<span class="mini">' + jobs.slice(0, 14).map((j) => '<span class="s-' + jobState(j) + '" title="' + esc(j.name) + '">' + icon(jobState(j)) + '</span>').join('<i></i>') + '</span>' : '';
    return '<div class="quiet"><button class="who s-' + state + '" data-view="' + esc(entry.repo) + '">' + icon(state) + esc(shortRepo(entry.repo)) + '</button>' +
      '<div class="what">' + (last ? mini + '<a href="' + esc(last.url) + '" target="_blank" rel="noopener">' + esc(last.title || last.workflow) + '</a>' : '<span class="dim">' + t('nothing') + '</span>') + '</div>' +
      '<div class="sub">' + (entry.pool?.blocked ? t('blockedTag') : entry.pool?.paused ? t('paused') : last ? t('s_' + state) + ' <span data-ago="' + esc(last.updatedAt) + '"></span>' : '') + '</div></div>';
  }).join('');
}

function projectBlocks(entry, withRepo) {
  if (entry.pipelines.length) return entry.pipelines.map((p) => runBlock(p, true, entry.repo, withRepo)).join('');
  if (entry.lastRun) return runBlock(entry.lastRun, false, entry.repo);
  return '<div class="head"><div><h1>' + esc(entry.repo) + '</h1><div class="sub">' + t('nothing') + '</div></div></div>';
}

function renderOverview(entries, single) {
  const main = document.getElementById('main');
  if (main.dataset.shape !== 'overview') { main.dataset.shape = 'overview'; main.dataset.html = ''; main.innerHTML = '<div class="stack"><div class="band"><div id="charts" style="display:contents"></div><div id="seats"></div></div><div id="warn"></div><div id="runs" class="stack" style="gap:34px"></div></div>'; }
  // If the machine lacks something for Docker, below the warning tags it says how to fix it; the rows then replace
  // the Docker tag.
  put(document.getElementById('warn'), warnings(entries) + (setupMissing().length ? '<div class="setup">' + setupRows(false) + '</div>' : ''));
  const busy = entries.filter((entry) => entry.pipelines.length);
  const idleHead = viewHead(t('all'), t('idleAll'));
  const blocks = single ? projectBlocks(entries[0]) + legend() : (busy.length ? busy.map((entry) => projectBlocks(entry, true)).join('') + legend() : idleHead) + '<div>' + unservedRows() + quietRows(entries.filter((entry) => !entry.pipelines.length)) + '</div>';
  if (put(document.getElementById('runs'), blocks)) {
    watchPlans(main);

    if (window.innerWidth <= NARROW) main.querySelector('.pill.s-fail, .pill.s-run')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  put(document.getElementById('charts'), bandCharts(entries.flatMap((entry) => entry.pipelines.map((p) => new Date(p.startedAt).getTime()))));
  put(document.getElementById('seats'), seats(entries));
}

// Stop "GitHub requests": figure and rail show what was used, as with the memory peaks with the
// mark from which it is tight; from there RunClub queries less often. What is still free and when it resumes is in the header.
// Only the reached limit is red: tight asks for nothing and passes by itself. A sentence appears only when it is tight or
// reached; what the limit is and what follows from it is in the info at the heading.
function quotaStop() {
  const q = data.quota;
  if (!q) return '';
  const count = whole;
  const { tight, out } = quotaState();
  const until = hourMinute(q.resetAt);
  const left = Math.max(1, Math.round((new Date(q.resetAt) - Date.now()) / 60000)); // minutes until the end of the window
  return routeStop('github', t('quotaTitle'), t('quotaReset', count(q.remaining), until, left),
    '<div><div class="k">' + t('quotaLabel') + '</div><div class="v' + (out ? ' c-fail' : '') + '">' + count(q.limit - q.remaining) + ' <small>' + t('quotaOf', count(q.limit)) + '</small></div></div>' +
    '<div class="um solo">' + fillBar((q.limit - q.remaining) / q.limit, out, q.tightAt) + '</div>' +
    (out ? '<div class="note measure strong"><span class="c-fail">' + t('quotaOut', until) + '</span> <span class="ink">' + t('quotaOutMore') + '</span></div>' : tight ? '<div class="note measure strong">' + t('quotaTight', until) + '</div>' : ''),
    [out ? t('quotaOutInfo') : tight ? t('quotaTightInfo') : '', t('quotaInfo')]);
}

// Stop "GitHub minutes": what the account used this month on GitHub's own runners, built like
// the GitHub requests. The limit is the plan's included minutes (table in minutes.js); without it there is only
// the figure. The surface states the state briefly, reasons and consequences are in the info at the heading. Tight asks for nothing. Used up is red because there is a way out: your own runners or a budget.
// Whoever pays beyond what is included has a budget: that is neither tight nor red, but the header names the cost.
// While there is no data yet, a sentence says so, so that the stop does not only appear later.
function minutesStop() {
  const m = data.minutes;
  const only = (body) => routeStop('minutes', t('minutesTitle'), '', body);
  if (!m) return '';
  if (m.state === 'reading') return only('<div class="note measure">' + t('minutesReading') + '</div>');
  if (m.state === 'failed') return only('<div class="row"><span class="rt note">' + t('minutesFailed') + '</span><button class="btn" data-view="settings" data-goto="log">' + t('toLog') + '</button></div>');
  const count = whole;
  const { tight, out } = minutesState();
  const paid = m.state === 'paid';
  const money = m.cost.toLocaleString(locale(), { style: 'currency', currency: 'USD' });
  const planName = (name) => name.charAt(0).toUpperCase() + name.slice(1);
  // The billing month changes by UTC.
  const day = new Date(m.resetAt).toLocaleDateString(locale(), { day: 'numeric', month: 'long', timeZone: 'UTC' });
  const systems = [['Linux', m.systems.linux], ['Windows', m.systems.windows], ['macOS', m.systems.macos], [t('minutesOther'), m.systems.other]].filter(([, value]) => value > 0);
  // What the number consists of, what of it is charged, and the plan with its included minutes.
  const about = [
    systems.length > 1 ? t('minutesParts', systems.map(([name, value]) => name + ' ' + count(value)).join(', ')) : systems.length ? t('minutesAll', systems[0][0]) : '',
    m.paid && !paid ? t('minutesBilled', count(m.paid), money) : '',
    m.included ? t('minutesPlan', esc(planName(m.plan)), count(m.included)) : m.plan ? t('minutesPlanUnknown', esc(planName(m.plan))) : t('minutesNoPlan'),
  ].filter(Boolean).join(' ');
  // In the info: what the plans include (the table comes with the data), that every minute counts the same, and what
  // applies to another plan.
  const plans = Object.entries(m.plans ?? {}).map(([name, minutes]) => esc(planName(name)) + ' ' + count(minutes)).join(', ');
  const general = [plans ? t('minutesPlans', plans) : '', t('minutesEqual'), t(m.included ? 'minutesOtherPlan' : 'minutesOtherPlanHere')].filter(Boolean).join(' ');
  const side = !m.included ? t('minutesResetOnly', day) : paid ? t('minutesOver', count(m.paid), money, day) : t('minutesReset', count(Math.max(0, m.included - m.used)), day);
  // Paid: what it costs is already in the header; here only what follows from it.
  const lead = out ? '<span class="c-fail">' + t('minutesOut', day) + '</span> <span class="ink">' + t('minutesOutMore') + '</span>' : paid ? t('minutesBudget') : tight ? t('minutesTight') : '';
  const leadMore = out ? t('minutesOutInfo') : paid ? t('minutesBudgetInfo') : tight ? t('minutesTightInfo') : m.paid ? t('minutesBilledInfo') : '';
  return routeStop('minutes', t('minutesTitle'), side,
    '<div><div class="k">' + t('minutesLabel') + '</div><div class="v' + (out ? ' c-fail' : '') + '">' + count(m.used) + (m.included ? ' <small>' + t('of', count(m.included)) + '</small>' : '') + '</div></div>' +
    (m.included ? '<div class="um solo">' + fillBar(m.used / m.included, out, m.tightAt) + '</div>' : '') +
    (lead ? '<div class="note measure strong">' + lead + '</div>' : '') +
    (out ? '<div class="row"><button class="btn" data-view="settings" data-goto="projects">' + t('toProjects') + '</button></div>' : '') +
    '<div class="note measure">' + about + '</div>', [leadMore, general]);
}

function renderUsage() {
  const main = document.getElementById('main');
  main.dataset.shape = 'usage';
  const m = data.machine;
  const day = dayData ?? [];
  const src = (key) => ({ at: day.map((p) => p.at), values: day.map((p) => p[key + 'Max']), span: 24 * 3600000 });
  // The highest measured peak of a project, relative to what a job may use.
  const tightAt = m.limitsView.tightAt; // from this share of the limit on, a peak counts as tight
  const meter = (label, peak, allowed) => {
    const tight = peak > allowed * tightAt;
    return '<div class="um"><span>' + label + '</span>' + fillBar(allowed ? peak / allowed : 0, tight, tightAt) + '<b' + (tight ? ' class="c-fail"' : '') + '>' + mb(peak) + ' <small>' + t('of', gb(allowed)) + '</small></b></div>';
  };
  const projects = data.repos.map((entry, index) => {
    const u = entry.usage ?? { jobs: [] };
    // Measured against this project's limit; without own values that is the limit for all.
    const allowRunner = entry.pool?.limits ? entry.pool.limits.values.runnerMemory * GIB : limitBytes(m.limits.runnerMemory);
    const allowDocker = entry.pool?.limits ? entry.pool.limits.values.dockerMemory * GIB : limitBytes(m.limits.dockerMemory);
    const peakRunner = Math.max(0, ...u.jobs.map((j) => j.peakRunner));
    const peakDocker = Math.max(0, ...u.jobs.map((j) => j.peakDocker));
    // The value that determines the rail stands out in the table.
    const cell = (value, peak) => '<td class="r' + (value > 0 && value === peak ? ' top' : '') + '">' + (value > 0 ? mb(value) : '–') + '</td>';
    // Two workflows can name a job the same: only then is the workflow shown with it.
    // If a job name occurs more than once in the project, the workflow is shown with it: muted in the table, with a dot in the sentence.
    const sharesName = (j) => j.workflow && u.jobs.some((other) => other !== j && other.job === j.job);
    const jobLabel = (j, dim) => esc(j.job) + (sharesName(j) ? (dim ? ' <span class="dim">' + esc(j.workflow) + '</span>' : ' · ' + esc(j.workflow)) : '');
    const rows = u.jobs.map((j) => '<tr><td>' + jobLabel(j, true) + '</td>' + cell(j.peakRunner, peakRunner) + cell(j.peakDocker, peakDocker) + '<td class="r">' + (j.peakMemory ? num(j.peakCpu) : '–') + '</td><td class="r">' + (j.peakMemory ? num(j.cpu) : '–') + '</td><td class="r">' + clock(j.duration) + '</td><td class="r">' + j.runs + '</td></tr>').join('');
    // What is closest to its limit: which job, which side, how much.
    const near = [['Runner', peakRunner, allowRunner, 'peakRunner'], ['Docker', peakDocker, allowDocker, 'peakDocker']].filter(([, peak, allowed]) => peak > allowed * tightAt).sort((a, b) => b[1] / b[2] - a[1] / a[2])[0];
    const peaks = peakRunner + peakDocker > 0 ? '<div><div class="k">' + t('peakTitle') + info(t('peakTitle'), t('peakInfo', Math.round(tightAt * 100))) + '</div><div class="meters">' + meter('Runner', peakRunner, allowRunner) + meter('Docker', peakDocker, allowDocker) + '</div></div>' +
      (near ? '<div class="row"><span class="rt note c-fail">' + t('nearLimit', jobLabel(u.jobs.find((j) => j[near[3]] === near[1])), mb(near[1]), gb(near[2]), near[0]) + '</span><button class="btn" data-view="settings" data-goto="limits">' + glyph('gauge') + t('toLimits') + '</button></div>' : '') : '';
    const body = !rows ? '<div class="note">' + t('noUsage') + '</div>' : peaks +
      '<div class="scroll"><table class="fixed"><tr><th>' + t('job') + '</th><th class="r">' + t('ramRunner') + '</th><th class="r">' + t('ramDocker') + '</th><th class="r">' + t('cpuPeak') + '</th><th class="r">' + t('cpuAvg') + '</th><th class="r">' + t('usualTime') + '</th><th class="r">' + t('runs') + '</th></tr>' + rows + '</table></div>' +
      (u.wait ? '<div class="note">' + t('wait', span(u.wait.usual), span(u.wait.longest), u.wait.jobs) + '</div>' : '');
    return routeStop('p' + index, shortRepo(entry.repo), u.jobs.length ? t(u.jobs.length === 1 ? 'jobMeasured' : 'jobsMeasured', u.jobs.length) : '', body);
  }).join('');
  put(main, '<div class="stack set"><div class="head"><div><h1>' + t('usage') + '</h1></div></div><div class="route">' +
    routeStop('day', t('day'), '', '<div class="trio">' + chart('dayVmMem', t('vmMem'), '', '', src('vmMemory'), m.dockerMemory || m.memoryTotal, gb, false, []) + chart('dayVmCpu', t('vmCpu'), '', '', src('vmCpu'), m.dockerCpus, (v) => num(v), false, []) + chart('dayHostMem', t('hostMem'), '', '', src('hostMemory'), m.memoryTotal, gb, false, []) + '</div>', [t('dayInfo')]) +
    quotaStop() + minutesStop() + projects + '</div></div>');
}

// Drawn symbols of the controls: 16 grid, one stroke, in text colour – never in a state colour.
const GLYPHS = {
  minus: '<path d="M4 8h8"/>', plus: '<path d="M8 4v8M4 8h8"/>', open: '<path d="M6 4l4 4-4 4"/>',
  clear: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/>',
  pause: '<path d="M6 4v8M10 4v8"/>', resume: '<path d="M5.5 4v8l6.5-4z"/>',
  power: '<path d="M8 2.5v5M4.6 4.8a4.8 4.8 0 1 0 6.8 0"/>',
  remove: '<circle cx="8" cy="8" r="5.5"/><path d="M6 6l4 4M10 6l-4 4"/>',
  route: '<path d="M2 8h3.5M5.5 8c3.5 0 3-4 6.5-4h2M5.5 8c3.5 0 3 4 6.5 4h2"/>',
  cache: '<path d="M8 3l5 2.5-5 2.5-5-2.5zM3 8.5l5 2.5 5-2.5"/>',
  gauge: '<path d="M2.5 11a5.5 5.5 0 0 1 11 0M8 11l2.5-3.5"/>',
  rebuild: '<path d="M12.6 8a4.6 4.6 0 1 1-1.5-3.4M12.6 2.6v2.6H10"/>',
  // Re-run: the arc back to the start, inside it the triangle for "go". Applies to run and job.
  rerun: '<path d="M3.4 8a4.6 4.6 0 1 0 1.5-3.4M3.4 2.6v2.6H6M7 6.2v3.6l3-1.8z"/>',
  copy: '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/>',
  save: '<path d="M8 2.5v8M4.8 7.4L8 10.5l3.2-3.1M3 13.5h10"/>',
  update: '<path d="M8 13.5v-8M4.8 8.6L8 5.5l3.2 3.1M3 2.5h10"/>',
  // More on this: the "i" in a circle; only used on the info element.
  info: '<circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.6M8 4.9v.1"/>',
};
const glyph = (name, cls) => '<svg class="g' + (cls ? ' ' + cls : '') + '" viewBox="0 0 16 16" aria-hidden="true">' + GLYPHS[name] + '</svg>';
// The info element next to a title: the surface says briefly what it is and what to do; reasons, consequences and
// background go here. `about` is the title it belongs to (for screen readers). `parts` are the paragraphs,
// finished HTML from the text table in which values from outside have already gone through esc; empty ones are dropped.
// The explanation sits hidden in the button and is its description for screen readers; the info surface shows a
// copy. The id follows from the content so the same data gives the same HTML; equal ids carry equal text.
const info = (about, ...parts) => {
  const html = parts.filter(Boolean).map((part) => '<p>' + part + '</p>').join('');
  if (!html) return '';
  let hash = 0;
  for (const c of about + html) hash = (hash * 31 + c.charCodeAt(0)) | 0;
  const id = 'info-' + (hash >>> 0).toString(36);
  return '<button type="button" class="info" aria-label="' + esc(t('infoAbout', about)) + '" aria-describedby="' + id + '">' + glyph('info') + '<span class="ib" id="' + id + '" hidden>' + html + '</span></button>';
};
const GIB = 1073741824;
const LIMIT_KEYS = ['runnerMemory', 'dockerMemory', 'runnerCpus', 'dockerCpus'];
let openRepo = store.get('open', ''); // the expanded project in the settings
let logOpen = false;
const LOG_GENERAL = '-'; // as a filter: the messages without a project
let logRepo = ''; // the project the log is filtered to ('' = all)
let logData = []; // entries { at, repo, text, kind } and for jobs { job, runner }, the oldest first
let logStamp = ''; // id of the state logData belongs to (see logStamp in backend.js)
const LOG_SHORT = 8;
// Only what is a result gets a symbol. The start of a job goes without: yellow means "running now".
const LOG_STATE = { error: 'fail', done: 'done', fail: 'fail', cancel: 'cancel' };
// Messages about a job are built by the interface in its language from job name, runner and kind; everything else is the
// backend's sentence.
const logText = (entry) => (entry.msg ? said(entry.msg) : entry.text); // without a key: a text from outside or an entry of an older version
// For today the time of day is enough; older entries name the day and skip the seconds instead.
function logTime(iso) {
  const at = new Date(iso);
  return at.toDateString() === new Date().toDateString() ? at.toLocaleTimeString(locale())
    : at.toLocaleDateString(locale(), { day: '2-digit', month: '2-digit' }) + ' ' + hourMinute(at);
}
// The first stop of a view. In the settings that is "GitHub"; a backend that does not report the sign-in yet
// (the page is newer than the running program) does not have it.
const firstStop = () => (view === 'usage' ? 'day' : data?.auth ? 'auth' : 'projects');
let hereStop = ''; // the stop the page is currently at; empty means: at the first
const here = () => hereStop || firstStop();
// A section on the line: ring, heading, a side note on the right, the content below. `more`: the paragraphs
// of the info element at the heading.
const routeStop = (key, title, side, body, more = []) => '<section class="stop' + (here() === key ? ' here' : '') + '" id="stop-' + key + '"><button class="stopdot" data-stop="' + key + '" aria-label="' + esc(title) + '"></button>' +
  '<div class="stophead"><div class="grow"><h2>' + esc(title) + '</h2>' + info(title, ...more) + '</div>' + (side ? '<span class="note">' + side + '</span>' : '') + '</div>' + body + '</section>';
let draft = null; // limits while a slider is being moved: { repo ('' = for all), values: { runnerMemory, … } }

function renderSettings() {
  const main = document.getElementById('main');
  main.dataset.shape = 'settings';
  // Names with capitals become `data-runner-memory` so that they come back as `dataset.runnerMemory`.
  const attrs = (values) => Object.entries(values).map(([k, v]) => ' data-' + k.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase()) + '="' + esc(v) + '"').join('');
  // Symbol with word. `only` shows just the symbol; the action is then attached as a tooltip and for screen readers.
  // `why` disables the button and names the reason in the tooltip.
  const button = (name, text, values, { cls = '', only = false, why = '', describedBy = '' } = {}) => '<button class="btn' + (only ? ' only' : '') + (cls ? ' ' + cls : '') + '"' + (only ? ' aria-label="' + esc(text) + '"' : '') + (only || why ? ' data-tip="' + esc(why || text) + '"' : '') + (why ? ' aria-disabled="true"' + (describedBy ? ' aria-describedby="' + esc(describedBy) + '"' : '') : '') + attrs(values) + '>' + glyph(name) + (only ? '' : esc(text)) + '</button>';
  const seg = (name, options, current) => '<span class="seg">' + options.map(([value, text]) => '<button data-set="' + name + '" data-value="' + value + '" aria-pressed="' + (current === value) + '">' + text + '</button>').join('') + '</span>';
  const stop = routeStop;

  const withPool = data.repos.filter((entry) => entry.pool);

  // --- Limits: for all projects or per project ---
  const m = data.machine;
  const lv = m.limitsView ?? {
    values: { runnerMemory: limitBytes(m.limits.runnerMemory) / GIB, dockerMemory: limitBytes(m.limits.dockerMemory) / GIB, runnerCpus: m.limits.runnerCpus, dockerCpus: m.limits.dockerCpus },
    bounds: { memory: { min: 1, max: 8, step: 0.5 }, cpus: { min: 1, max: m.dockerCpus || 1, step: 1 } }, suggestion: null,
  };
  const gbShort = (value) => num(value, value % 1 ? 1 : 0);
  // A slider being moved takes precedence over the saved state.
  const moved = (repo) => (draft && draft.repo === repo ? draft.values : {});
  const shared = { ...lv.values, ...moved('') };
  const limitsFor = (entry) => ({ ...(entry.pool.limits?.own ? entry.pool.limits.values : shared), ...moved(entry.repo) });
  const slider = (key, label, range, unit, values, hints, repo) => {
    const share = (value) => (range.max > range.min ? Math.min(1, Math.max(0, (value - range.min) / (range.max - range.min))) : 0);
    const hint = hints?.[key];
    return '<label class="sl"><span>' + label + '</span><span class="tr" style="--s:' + (hint == null ? 0 : share(hint).toFixed(3)) + '"><input type="range" data-limit="' + key + '" data-repo="' + esc(repo) + '" min="' + range.min + '" max="' + range.max + '" step="' + range.step + '" value="' + values[key] + '" style="--v:' + (share(values[key]) * 100).toFixed(1) + '%">' +
      '<u' + (hint == null ? ' hidden' : '') + '></u></span><b>' + unit(values[key]) + '</b></label>';
  };
  // A job's runner and Docker share an upper limit. The hint is always there; whoever goes over it while
  // dragging reads instead what happens on release.
  const cap = lv.bounds.memory.total;
  const capNote = (values) => (cap === undefined ? '' : '<div class="note' + (values.runnerMemory + values.dockerMemory > cap ? ' strong' : '') + '">' +
    (values.runnerMemory + values.dockerMemory > cap ? t('capOver', gbShort(values.runnerMemory + values.dockerMemory), gbShort(cap)) : t('capNote', gbShort(cap))) + '</div>');
  const sliders = (values, hints, repo) => '<div class="sliders">' + slider('runnerMemory', t('memRunner'), lv.bounds.memory, (v) => gbShort(v) + ' GB', values, hints, repo) + slider('dockerMemory', t('memDocker'), lv.bounds.memory, (v) => gbShort(v) + ' GB', values, hints, repo) +
    slider('runnerCpus', t('cpuRunner'), lv.bounds.cpus, (v) => v, values, hints, repo) + slider('dockerCpus', t('cpuDocker'), lv.bounds.cpus, (v) => v, values, hints, repo) + '</div>' + capNote(values);
  // The suggestion from the measurements, with a button, as long as the saved limits differ from it.
  const suggested = (hints, saved, repo) => {
    if (!hints) return '<div class="note">' + t('suggestNone') + '</div>';
    const same = LIMIT_KEYS.every((key) => hints[key] === saved[key]);
    return '<div class="row"><span class="rt note"><span class="ink">' + (same ? t('suggestSame') : t('suggestText', gbShort(hints.runnerMemory), gbShort(hints.dockerMemory), hints.runnerCpus)) + '</span>' + info(t('infoSuggest'), t('suggestWhy')) + '</span>' +
      (same ? '' : button('gauge', t('suggestApply'), { do: 'limits/set', ...(repo ? { repo } : {}), ...Object.fromEntries(LIMIT_KEYS.map((key) => [key, hints[key]])) })) + '</div>';
  };

  // --- Projects: one row per project, one of them expanded ---
  const projects = withPool.map((entry) => {
    const p = entry.pool;
    const repo = entry.repo;
    const open = openRepo === repo;
    const size = (key) => (p.sizes ? mb(p.sizes[key]) : '…');
    const crow = (title, detail, amount, action) => '<div class="crow"><span>' + title + (detail ? '<small>' + detail + '</small>' : '') + '</span><span>' + amount + '</span>' + action + '</div>';
    const clear = (what, text) => button('clear', text, { do: 'pool/clear', repo, what, confirm: t('confirmClear', repo) }, { only: true });
    // A blocked pool (see blocks.js) like a fault with a way out (cf. quotaOut): briefly in red, the way out in
    // `ink`, the why in the info. Resume and redirect are disabled and point here with `aria-describedby`.
    const blocked = p.blocked ? t('blocked_' + p.blocked) + ' ' + t('blockedWay_' + p.blocked) : '';
    const noteId = 'block-' + repo.replace(/[^A-Za-z0-9_-]/g, '-');
    const guardNote = p.blocked ? '<div class="note measure strong" id="' + noteId + '"><span class="c-fail">' + esc(t('blocked_' + p.blocked)) + '</span> <span class="ink">' + esc(t('blockedWay_' + p.blocked)) + '</span>' + info(t('blockedTag'), esc(t('blockedInfo_' + p.blocked))) + '</div>'
      : !p.checked && !p.paused ? '<div class="note measure">' + esc(t('unchecked')) + info(t('checking'), esc(t('uncheckedInfo'))) + '</div>' : '';
    // GitHub answers 404 for the repo: usually the app is missing on its account.
    const missing = entry.notFound ? '<div class="row"><span class="rt c-fail">' + esc(t('notFound')) + '</span>' + githubButton(data.auth?.install, t('grantAccess')) + '</div>' : '';
    const r = p.routing;
    const snippet = '<code>${{ fromJSON(vars.CI_RUNNER || \'"ubuntu-latest"\') }}</code>';
    // If GitHub cannot find the repo, the redirect state no longer holds either.
    const route = !r || entry.notFound ? '' : '<div class="row"><span class="rt' + (!r.here && r.uses !== 'fixed' && !p.blocked ? ' c-fail' : '') + '">' +
      (r.error ? esc(said(r.error)) : r.uses === 'fixed' ? t('routeFixed') : r.uses === 'none' ? t('routeNone') + ' ' + snippet + info('runs-on', t('routeNoneInfo')) : r.here ? t('routeOn') : t('routeOff')) + '</span>' +
      (r.uses === 'fixed' ? '' : r.here ? button('route', t('routeBack'), { do: 'pool/routing', repo, on: '', confirm: t('confirmBack', repo) }) : button('route', t('routeTo'), { do: 'pool/routing', repo, on: '1' }, { why: blocked, describedBy: noteId })) + '</div>';
    const caches = (p.cache ? crow(t('packages'), '', size('packages'), clear('packages', t('clearOf', t('packages')))) + crow(t('layers'), '', size('build'), clear('build', t('clearOf', t('layers'))))
      : '<div class="crow"><span class="dim">' + t('cacheIsOff') + '</span><span></span><span></span></div>') +
      crow(t('images', p.images.length), p.images.map(esc).join(' · '), size('images'), clear('images', t('forgetImages')));
    // Limits: like all projects or own values, so that a hungry project does not force high limits on all.

    const foot = '<div class="row">' + button(p.paused ? 'resume' : 'pause', p.paused ? t('resume') : t('pause'), { do: 'pool/set', repo, paused: p.paused ? '' : '1' }, { why: p.paused ? blocked : '', describedBy: noteId }) +
      button('cache', p.cache ? t('cacheOff') : t('cacheOn'), { do: 'pool/set', repo, cache: p.cache ? '' : '1' }) +
      // What deletes stands apart at the right end.
      '<span class="row push">' + button('clear', t('clearAll'), { do: 'pool/clear', repo, what: 'all', confirm: t('confirmClear', repo) }) + button('remove', t('remove'), { do: 'pool/remove', repo, confirm: t('confirmRemove', repo) }, { cls: 'danger' }) + '</span></div>';
    return '<div class="proj" data-open="' + open + '"><div class="phead"><button class="popen" data-open-repo="' + esc(repo) + '" aria-expanded="' + open + '" data-tip="' + esc(repo) + '">' + glyph('open') + '<b>' + esc(shortRepo(repo)) + '</b>' +
      (entry.notFound ? '<span class="tag c-fail">' + t('notFoundTag') + '</span>' : '') + (p.blocked ? '<span class="tag c-fail">' + t('blockedTag') + '</span>' : p.paused ? '<span class="tag">' + t('paused') + '</span>' : '') + (p.limits?.own ? '<span class="tag">' + t('ownTag') + '</span>' : '') + (fitTag ? '<span class="tag' + (pressing ? ' c-fail' : '') + '">' + fitTag + '</span>' : '') + (p.busy ? '<span class="tag">' + t('rebuilding') + '</span>' : '') +
      '<span class="sz">' + t('cachesSum', p.sizes ? mb(p.sizes.packages + p.sizes.images + p.sizes.build) : '…') + '</span></button>' +
      '<span class="note">' + t('slots') + '</span><span class="stepper">' + button('minus', t('fewer'), { do: 'pool/set', repo, parallel: p.parallel - 1 }, { only: true, why: p.parallel <= 1 ? t('minSlots') : '' }) + '<b>' + p.parallel + '</b>' +
