<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunClub</title>
<style>
  @font-face { font-family: Overpass; src: url(/fonts/overpass-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; unicode-range: U+0000-00B6, U+00B8-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  :root {
    color-scheme: dark;
    --ground:#0c1838; --rail:#091230; --surface:#14224f; --raised:#1a2b60; --edge:#26366e; --rule:#1f2d62; --track:#6a7bb5; --track-open:#5b6a94; --cap:#33427a;
    --ink:#dfe5f5; --text:#c9d2ea; --muted:#8793b8; --chart:#8fa4e0;
    --run:#ffc53d; --done:#3fcf8e; --fail:#f0524a; --fail-text:#f58a8f; --cancel:#c084fc; --skip:#7a85a3; --wait:#5b6a94; --fail-edge:#7a2f38; --rail-hover:#0f1b44; --select:#2c4391;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 300 14px/1.45 Overpass, "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden; }
  ::selection { background: var(--select); color: var(--ink); }
  * { scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
  :focus-visible { outline: 2px solid var(--chart); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  #app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
  /* Im Fenster der App gibt es keine Titelleiste von Windows. Die obersten 32 px sind über die ganze Breite der
     Griff zum Ziehen; rechts oben liegen darüber die Knöpfe von Windows. Darunter beginnen Leiste und Hauptbereich
     auf derselben Höhe. Im Browser entfällt der Streifen. */
  #bar { display: none; }
  .shell #app { grid-template-rows: 32px minmax(0, 1fr); }
  .shell #bar { display: block; grid-column: 2; grid-row: 1; -webkit-app-region: drag; }
  .shell #rail { grid-row: 1 / 3; padding-top: 37px; }
  .shell #rail::before { content: ""; position: fixed; top: 0; left: 0; width: 232px; height: 32px; -webkit-app-region: drag; }
  .shell .brand { -webkit-app-region: drag; }
  .shell #main { grid-row: 2; padding-top: 6px; }
  .shell .band { top: -6px; margin-top: -6px; padding-top: 6px; }

  /* Projektleiste */
  #rail { background: var(--rail); padding: 22px 14px 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .brand { font-weight: 600; font-size: 22px; color: var(--ink); padding: 0 12px 14px; }
  .nav { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 12px 8px 36px; position: relative; cursor: pointer; }
  .nav:hover { background: var(--rail-hover); }
  .nav[aria-current="true"] { background: var(--surface); }
  .nav b { display: block; font-weight: 400; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav > span:not(.ic) { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .ic { position: absolute; left: 11px; top: 10px; width: 16px; height: 16px; }
  .nav .ic svg { width: 10px; height: 10px; }
  .nav.plain { padding-left: 12px; }
  .nav > span > .c-fail { display: block; overflow: hidden; text-overflow: ellipsis; }
  .railfoot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 16px; }

  /* Hauptbereich */
  #main { overflow-y: auto; padding: 26px 44px 40px; }
  .stack { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .head { display: flex; align-items: flex-end; gap: 24px; }
  .head > div:first-child { min-width: 0; }
  h1 { font-weight: 400; font-size: 26px; line-height: 1.2; color: var(--ink); margin: 0 0 2px; text-wrap: balance; overflow-wrap: anywhere; }
  h2 { font-weight: 400; font-size: 18px; color: var(--ink); margin: 0; }
  .sub { font-size: 13px; font-weight: 400; color: var(--muted); }
  .sub a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .eta { margin-left: auto; text-align: right; white-space: nowrap; }
  .eta b { display: block; font-weight: 200; font-size: 56px; line-height: 1; color: var(--ink); }
  .eta b.small { font-size: 34px; font-weight: 300; }
  .c-fail { color: var(--fail-text) !important; } .c-done { color: var(--done) !important; } .c-run { color: var(--run) !important; }
  .note { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; border: 1px solid var(--edge); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
  .tag.c-fail { border-color: var(--fail-edge); }

  /* Netzplan */
  .planwrap { overflow-x: auto; padding: 4px 0 72px; margin-bottom: -72px; }
  .plan { position: relative; display: flex; align-items: center; gap: clamp(40px, 6vw, 96px); width: 100%; }
  .plan > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .plan > svg path { fill: none; stroke: var(--track); stroke-width: 2.5; stroke-linecap: round; }
  .plan > svg path { transition: opacity .15s, stroke .15s; }
  .plan > svg path.open { stroke: var(--track-open); stroke-dasharray: 2 7; }
  .plan.tracing > svg path { opacity: .3; }
  .plan.tracing > svg path.on { opacity: 1; stroke: var(--ink); }
  .col { display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; flex: 1 1 0; min-width: 180px; max-width: 280px; }
  .pill { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; width: 100%; min-height: 40px; padding: 8px 16px 8px 9px; border-radius: 21px; background: var(--surface); border: 1px solid var(--edge); position: relative; isolation: isolate; transition: background .2s var(--ease), border-color .2s var(--ease); }
  .pill:hover, .pill:focus-visible { background: var(--raised); border-color: var(--track); z-index: 3; }
  .pill > .ic, .pill > .n, .pill > .tm, .pill > .line { position: relative; z-index: 1; }
  .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--wait); display: grid; place-items: center; color: var(--ground); }
  .ic svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .s-run .ic { background: var(--run); border-color: var(--run); } .s-done .ic { background: var(--done); border-color: var(--done); }
  .s-fail .ic { background: var(--fail); border-color: var(--fail); } .s-cancel .ic { background: var(--cancel); border-color: var(--cancel); }
  .s-skip .ic { border-color: var(--skip); color: var(--skip); } .s-wait .ic { color: var(--wait); }
  .pill .n { color: var(--ink); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill .tm { color: var(--text); }
  .pill .tm.over { color: var(--run); }
  .pill .line { grid-column: 2 / 4; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 2px; }
  /* Die Details sind eine zweite Fläche in der Form der Pill, deckungsgleich hinter ihrem Inhalt. Beim Überfahren
     wächst diese eine Form nach unten; Ecken und Rand ändern sich dabei nicht. */
  .pill .more { position: absolute; z-index: 0; left: -1px; right: -1px; top: -1px; min-height: calc(100% + 2px); padding-top: 38px; display: grid; grid-template-rows: 0fr; opacity: 0; pointer-events: none; background: var(--raised); border: 1px solid var(--track); border-radius: 21px; transition: grid-template-rows .28s var(--ease), opacity .12s linear; }
  .pill.lined .more { padding-top: 33px; }
  .pill .line { transition: opacity .12s linear; }
  .pill.lined:hover .line, .pill.lined:focus-visible .line { opacity: 0; }
  .pill .more > div { overflow: hidden; font-size: 12px; color: var(--muted); padding: 0 16px 0 41px; }
  .pill .more p { margin: 0; padding: 2px 0 0; overflow-wrap: anywhere; }
  .pill .more p:last-child { padding-bottom: 12px; }
  .pill .more .bit { white-space: nowrap; }
  .pill:hover .more, .pill:focus-visible .more { grid-template-rows: 1fr; opacity: 1; transition-delay: .08s; }
  .pill .pg, .s-run .more::after { position: absolute; z-index: 1; left: 18px; bottom: -1px; height: 2px; width: var(--p, 0%); max-width: calc(100% - 36px); background: var(--run); transition: width 1s linear, opacity .12s linear; }
  .s-run .more::after { content: ""; bottom: 0; }
  .pill:hover > .pg, .pill:focus-visible > .pg { opacity: 0; }
  .col:has(.pill:hover) .pill:not(:hover) .pg, .col:has(.pill:focus-visible) .pill:not(:focus-visible) .pg { opacity: 0; }
  .s-fail.pill { border-color: var(--fail-edge); } .s-fail .line, .s-fail .more > div { color: var(--fail-text); }
  .s-wait.pill, .s-skip.pill { background: transparent; border-style: dashed; }
  .s-wait .n, .s-skip .n { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend .ic { width: 18px; height: 18px; } .legend .ic svg { width: 11px; height: 11px; }

  /* Auslastung */
  .band { position: sticky; top: -26px; z-index: 4; background: var(--ground); margin-top: -26px; padding: 26px 0 16px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.25fr); gap: 34px; }
  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px; }
  .seats { max-height: 132px; overflow-y: auto; padding-right: 6px; }
  .k { font-size: 12px; font-weight: 400; color: var(--muted); }
  .v { font-size: 26px; line-height: 1.25; color: var(--ink); }
  .v small { font-size: 13px; color: var(--muted); }
  .chart { display: block; width: 100%; height: 74px; margin-top: 6px; cursor: crosshair; }
  .chart polyline { fill: none; stroke: var(--chart); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .chart polygon { fill: var(--chart); opacity: .16; }
  .chart.warn polyline { stroke: var(--fail); } .chart.warn polygon { fill: var(--fail); }
  .chart line { vector-effect: non-scaling-stroke; stroke-width: 1; }
  .chart .cap { stroke: var(--cap); } .chart .mid { stroke: var(--rule); } .chart .mark { stroke: var(--wait); stroke-dasharray: 2 3; }
  .chart .peak { stroke: var(--chart); stroke-dasharray: 1 4; opacity: .7; } .chart.warn .peak { stroke: var(--fail); } .chart .cross { stroke: var(--ink); }
  .ax { display: flex; justify-content: space-between; font-size: 11px; font-weight: 400; color: var(--muted); margin: 3px 0 4px; }
  .label { font-size: 12px; font-weight: 400; color: var(--muted); margin-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  th { font-weight: 400; color: var(--muted); }
  table.fixed { table-layout: fixed; min-width: 640px; } table.fixed th.r { width: 96px; }
  td.top { color: var(--ink); font-weight: 400; }
  table.set td { vertical-align: middle; } table.set td.r { width: 96px; }
  td.cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; width: 60%; }
  td.r, th.r { text-align: right; padding: 6px 0 6px 12px; white-space: nowrap; }
  .dim { color: var(--muted); }
  .scroll { overflow-x: auto; }
  .scroll::-webkit-scrollbar { height: 8px; } .scroll::-webkit-scrollbar-button { display: none; } .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 999px; }
  .quiet { display: grid; grid-template-columns: 190px minmax(0, 1fr) auto; column-gap: 20px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .quiet a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .quiet .who { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 400; min-width: 0; }
  .quiet .who:hover { text-decoration: underline; text-underline-offset: 3px; }
  .quiet .ic, .mini .ic { width: 16px; height: 16px; flex: none; } .quiet .ic svg, .mini .ic svg { width: 10px; height: 10px; }
  .mini { display: inline-flex; align-items: center; margin-right: 12px; vertical-align: -3px; } .mini i { width: 9px; height: 2px; background: var(--track); }
  .quiet .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Bedienelemente */
  section + section { border-top: 1px solid var(--rule); padding-top: 22px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .g { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 30px; background: var(--surface); border: 1px solid var(--edge); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 400; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--raised); border-color: var(--track); }
  .btn:active { background: var(--edge); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
  .btn[aria-disabled="true"]:hover, .btn[aria-disabled="true"]:active { background: var(--surface); border-color: var(--edge); }
  .btn[aria-expanded] .g { transition: transform .2s var(--ease); }
  .btn[aria-expanded="true"] .g { transform: rotate(90deg); }
  .push { margin-left: auto; }
  .btn.danger { color: var(--fail-text); border-color: var(--fail-edge); }
  .btn.step, .btn.only { width: 30px; padding: 5px 0; }
  /* „Job erneut starten“: Die Schaltfläche steckt nicht im Link der Pill, sondern steht neben ihm im selben Rahmen
     (.job) und erscheint rechts in den aufgeklappten Details. Über ihr verhält sich die Pill wie überfahren. Sie liegt
     auf `raised` und nimmt deshalb die Rahmentöne als Stufen, wie die Schaltflächen der Rückfrage. */
  .job { position: relative; }
  .job:hover > .pill, .job:has(:focus-visible) > .pill { background: var(--raised); border-color: var(--track); z-index: 3; }
  .job:hover > .pill.lined .line, .job:has(:focus-visible) > .pill.lined .line { opacity: 0; }
  .job:hover > .pill .more, .job:has(:focus-visible) > .pill .more { grid-template-rows: 1fr; opacity: 1; transition-delay: .08s; }
  .job .more > div { padding-right: 46px; }
  .job .more p:last-child { padding-bottom: 19px; }
  .job > .rejob { position: absolute; z-index: 4; right: 6px; top: 40px; opacity: 0; pointer-events: none; background: var(--edge); border-color: var(--cap); transition: opacity .12s linear, background .15s, border-color .15s; }
  .job:has(.lined) > .rejob { top: 35px; }
  .job:hover > .rejob, .job:has(:focus-visible) > .rejob { opacity: 1; pointer-events: auto; transition-delay: .08s, 0s, 0s; }
  .job > .rejob:hover { background: var(--cap); border-color: var(--track); }
  .job > .rejob:active { background: var(--raised); }
  .job:hover > .rejob[aria-disabled="true"], .job:has(:focus-visible) > .rejob[aria-disabled="true"] { opacity: .5; background: var(--edge); border-color: var(--cap); }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper b { min-width: 22px; text-align: center; font-weight: 400; color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 5px 14px; cursor: pointer; font-size: 13px; font-weight: 400; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
  input[type=text] { background: var(--rail); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; min-width: 0; }
  input[type=text]::placeholder { color: var(--muted); }
  input.sw { appearance: none; flex: none; width: 38px; height: 22px; margin: 0; border-radius: 999px; background: var(--rail); border: 1px solid var(--edge); position: relative; cursor: pointer; transition: background .15s, border-color .15s; }
  input.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s var(--ease), background .15s; }
  input.sw:checked { background: var(--raised); border-color: var(--track); }
  input.sw:checked::after { transform: translateX(16px); background: var(--ink); }
  input[type=range] { appearance: none; width: 100%; height: 22px; margin: 0; background: none; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--chart) var(--v), var(--edge) var(--v)); }
  input[type=range]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--ink); border: 0; }
  input[type=range]:disabled { opacity: .5; cursor: default; }
  code { font: 12px Consolas, monospace; color: var(--text); overflow-wrap: anywhere; }
  /* Protokoll: je Meldung eine Zeile aus Zeit, Projekt, Zustandssymbol und Text; die neueste steht oben. */
  .log { list-style: none; margin: 0; padding: 0; }
  .log.open { max-height: 496px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: 92px 128px 16px minmax(0, 1fr); column-gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .log.noproject li { grid-template-columns: 92px 16px minmax(0, 1fr); }
  .log time, .log .lp { font-size: 13px; font-weight: 400; color: var(--muted); }
  .log time { white-space: nowrap; } .log .lp { overflow-wrap: anywhere; }
  .log .ic { width: 16px; height: 16px; align-self: start; margin-top: 2px; } .log .ic svg { width: 10px; height: 10px; }
  .log .lm { overflow-wrap: anywhere; }
  .seg.wide { flex-wrap: wrap; max-width: 100%; }
  .empty { max-width: 52ch; }

  /* Einstellungen: eine Strecke mit einer Haltestelle je Abschnitt */
  .set { max-width: 860px; }
  .route { display: flex; flex-direction: column; gap: 44px; padding-left: 44px; }
  .route section + section { border-top: 0; padding-top: 0; }
  .stop { position: relative; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 20px; }
  .stop:not(:last-child)::before { content: ""; position: absolute; left: -37px; top: 14px; width: 2.5px; height: calc(100% + 44px); background: var(--track); }
  .stophead { display: flex; align-items: baseline; gap: 16px; padding-bottom: 8px; }
  .stopdot { position: absolute; left: -44px; top: 4px; width: 17px; height: 17px; padding: 0; border-radius: 50%; background: var(--ground); border: 2.5px solid var(--track); cursor: pointer; transition: border-color .15s, background .15s; }
  .stopdot::after { content: ""; position: absolute; inset: -10px; }
  .stopdot:hover { border-color: var(--ink); }
  .stop.here .stopdot { border-color: var(--ink); background: var(--ink); }

  .proj { background: var(--surface); border: 1px solid var(--edge); border-radius: 8px; transition: background .2s var(--ease), border-color .2s var(--ease); }
  .proj[data-open="false"]:has(.popen:hover) { background: var(--raised); border-color: var(--track); }
  .phead { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; column-gap: 12px; padding: 4px 12px 4px 4px; }
  .popen { display: flex; align-items: center; gap: 12px; min-width: 0; background: none; border: 0; border-radius: 6px; padding: 10px; cursor: pointer; text-align: left; }
  .popen .g { color: var(--muted); transition: transform .2s var(--ease); }
  .popen[aria-expanded="true"] .g { transform: rotate(90deg); }
  .popen b { font-weight: 400; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .popen .sz { margin-left: auto; padding-left: 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease); }
  .proj[data-open="true"] .pbody { grid-template-rows: 1fr; }
  .pbody > div { overflow: hidden; min-height: 0; }
  .pin { display: flex; flex-direction: column; gap: 14px; margin: 0 16px 0 42px; padding: 14px 0 16px; border-top: 1px solid var(--rule); }
  .rt { flex: 1 1 240px; min-width: 0; }
  .vary:empty { display: none; }
  .sl u[hidden] { display: none; }
  .plim { display: flex; flex-direction: column; gap: 10px; }
  .plim b { font-weight: 400; color: var(--ink); }
  .note .ink, .note.strong { color: var(--text); }
  .note.measure { max-width: 68ch; }
  .plim .sliders { padding-top: 2px; }
  .crow { display: grid; grid-template-columns: minmax(0, 1fr) auto 30px; align-items: center; column-gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .crow small { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .addrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; border: 1px dashed var(--cap); border-radius: 8px; padding: 10px 12px 10px 14px; }
  .addrow form { display: flex; flex: 1 1 340px; gap: 10px; min-width: 0; }
  .quick { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }

  .budget { position: relative; display: flex; gap: 8px; margin-top: 30px; }
  .bseg { min-width: 0; }
  .bseg > div { display: flex; gap: 2px; height: 26px; }
  .bseg i { min-width: 0; background: var(--raised); border: 1px solid var(--cap); border-radius: 6px; }
  .bseg i.svc { background: var(--cap); }
  .bseg i.out { background: transparent; border-style: dashed; }
  .bseg span { display: block; padding-top: 6px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bseg b { display: block; font-weight: 400; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  .bcap { position: absolute; top: -8px; height: 42px; border-left: 2px solid var(--track); }
  .bcap span { position: absolute; bottom: 100%; left: 0; padding: 0 0 2px 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bcap.end span { left: auto; right: 0; padding: 0 6px 2px 0; }
  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 44px; padding-top: 14px; }
  .sl { display: grid; grid-template-columns: 124px minmax(0, 1fr) 54px; align-items: center; column-gap: 14px; }
  .sl .tr { position: relative; display: flex; }
  .sl u { position: absolute; left: calc(8px + (100% - 16px) * var(--s)); top: 0; height: 22px; margin-left: -1px; border-left: 2px dotted var(--ink); pointer-events: none; }
  .sl b { text-align: right; font-weight: 400; color: var(--ink); white-space: nowrap; }

  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 44px; padding: 4px 0 6px; }
  .um { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; }
  .um.solo { grid-template-columns: minmax(0, 1fr); }
  .um i { position: relative; height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--chart) var(--v), var(--edge) var(--v)); }
  /* Ab dieser Marke gilt es als knapp; wo sie sitzt, sagt das Backend (`tightAt`). */

  .um i.alarm { background: linear-gradient(to right, var(--fail) var(--v), var(--edge) var(--v)); }
  .um b { font-weight: 400; color: var(--ink); white-space: nowrap; }
  .um small { font-size: 13px; color: var(--muted); }

  .arow { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .arow > div:first-child { flex: 1; min-width: 0; }
  .arow b { font-weight: 400; color: var(--ink); }
  /* Anmeldung bei GitHub: der Einmalcode als Kennzahl, mit einem Klick als Ganzes markiert. */
  .v.code { user-select: all; }
  .note a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .note a:hover { color: var(--ink); }

  /* Rückfrage: schwebt wie Tooltip und Meldung, eine Stufe über der Fläche, mit Rahmen statt Schatten. */
  dialog { width: min(440px, calc(100vw - 48px)); padding: 22px 24px 20px; background: var(--raised); color: var(--text); border: 1px solid var(--track); border-radius: 8px; }
  dialog::backdrop { background: color-mix(in srgb, var(--rail) 72%, transparent); }
  dialog[open] { animation: rise .2s var(--ease); }
  dialog[open]::backdrop { animation: veil .2s linear; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes veil { from { opacity: 0; } }
  dialog h2 { overflow-wrap: anywhere; }
  dialog p { margin: 8px 0 22px; max-width: 46ch; }
  /* Auf `raised` gibt es keine hellere Fläche mehr: Schaltflächen nehmen hier die Rahmentöne als Stufen. */
  dialog .btn { background: var(--edge); border-color: var(--cap); }
  dialog .btn:hover { background: var(--cap); border-color: var(--track); }
  dialog .btn:active { background: var(--raised); }
  dialog .btn.danger { border-color: var(--fail-edge); }
  /* Was Enter auslöst, ist immer zu sehen, auch wenn die Rückfrage mit der Maus geöffnet wurde. */
  dialog .btn:focus { outline: 2px solid var(--chart); outline-offset: 2px; }

  #tip, #toast { position: fixed; z-index: 5; background: var(--raised); color: var(--ink); border: 1px solid var(--track); border-radius: 6px; font-weight: 400; display: none; }
  input { caret-color: var(--chart); }
  #tip { pointer-events: none; padding: 3px 9px; font-size: 12px; white-space: nowrap; }
  #toast { left: 50%; bottom: 22px; transform: translateX(-50%); padding: 9px 16px; max-width: 90vw; }

  @media (max-width: 900px) { .quiet { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; } .quiet .what { grid-column: 1 / 3; grid-row: 2; } }
  @media (max-width: 1100px) { .band { grid-template-columns: 1fr 1fr; position: static; margin-top: 0; padding-top: 0; } .trio { grid-template-columns: 1fr; } #main { padding: 22px 24px 32px; } }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } #rail { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 10px; } .nav { flex: none; } .brand { padding: 6px 10px; } .railfoot { margin: 0; flex-direction: row; padding: 0; } .nav { width: auto; } .nav > span:not(.ic) { display: none; } .nav.todo b::after { content: " •"; color: var(--fail-text); } #rail, .planwrap { scrollbar-width: none; } .band { grid-template-columns: 1fr 1fr; gap: 16px 20px; } .chart { height: 44px; } .ax .wide { display: none; } #seats { grid-column: 1 / -1; } .head { flex-direction: column; align-items: flex-start; } .eta { margin: 0; text-align: left; } .eta b { font-size: 40px; } .shell #app { grid-template-rows: 32px auto minmax(0, 1fr); } .shell #bar { grid-column: 1; background: var(--rail); padding: 0 14px; font-weight: 600; font-size: 18px; line-height: 34px; color: var(--ink); } .shell #bar::before { content: "RunClub"; } .shell #rail { grid-row: 2; padding-top: 4px; } .shell #rail::before, .shell .brand { display: none; } .shell #main { grid-row: 3; } .sliders, .meters { grid-template-columns: 1fr; } table.fixed { min-width: 620px; } table.fixed th.r { width: 84px; } .popen .sz { display: none; } .popen { flex-wrap: wrap; row-gap: 4px; } .popen .tag { white-space: nowrap; } .route { gap: 36px; padding-left: 36px; } .stop:not(:last-child)::before { left: -29px; height: calc(100% + 36px); } .stopdot { left: -36px; } .pin { margin: 0 12px 0 14px; } .addrow form { flex-basis: 100%; } }
  @media (prefers-reduced-motion: reduce) { .pill, .pill .more, .pill .line, .pill .pg, .btn, .job > .rejob, .plan > svg path, dialog[open], dialog[open]::backdrop, .proj, .pbody, .popen .g, .stopdot, input.sw, input.sw::after { transition: none; } dialog[open], dialog[open]::backdrop { animation: none; } }

const t = (key, ...args) => (TEXT[lang][key] ?? key).replace(/\{(\d)\}/g, (_, i) => args[i]);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// Zahlen, Zeiten und Daten in der Schreibweise der gewählten Sprache.
const locale = () => (lang === 'de' ? 'de-DE' : 'en-GB');
const hourMinute = (date) => new Date(date).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
const num = (n, digits = 1) => n.toLocaleString(locale(), { minimumFractionDigits: digits, maximumFractionDigits: digits, useGrouping: false });
const gb = (b) => num(b / 1073741824) + ' GB';
const mb = (b) => (b >= 1073741824 ? gb(b) : Math.round(b / 1048576) + ' MB');
const clock = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const secondsSince = (iso) => Math.max(0, (Date.now() - new Date(iso)) / 1000);
const span = (s) => (s < 90 ? Math.round(s) + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : s < 129600 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' ' + t('days'));
const ago = (iso) => { const s = secondsSince(iso); return s < 45 ? t('justNow') : t('ago', span(s)); };
const leftText = (iso) => { const s = (new Date(iso) - Date.now()) / 1000; return s < 40 ? t('soon') : t('left', Math.max(1, Math.round(s / 60))); };

const shortRepo = (repo) => repo.split('/')[1]; // der Name ohne den Besitzer

const stateText = (state) => (lang === 'de' ? state : state.split(', ').map((part) => STATES_EN[part] ?? part).join(', '));
const ICONS = { run: '<path d="M6 4.5v7l6-3.5z" fill="currentColor" stroke="none"/>', done: '<path d="M4 8.5l2.8 2.8L12 5.5"/>', fail: '<path d="M5 5l6 6M11 5l-6 6"/>', cancel: '<rect x="5.2" y="5.2" width="5.6" height="5.6" rx="1" fill="currentColor" stroke="none"/>', skip: '<path d="M5 8h6"/>', wait: '<circle cx="8" cy="8" r="1.7" fill="currentColor" stroke="none"/>', idle: '' };

// Setzt den Inhalt nur, wenn er sich geändert hat – so bleiben Mauszeiger-Zustand und Übergänge erhalten.
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return; }
  if (from.nodeType === 3) { if (from.data !== to.data) from.data = to.data; return; }
  if (from.nodeType !== 1) return;
  for (const { name, value } of to.attributes) if (from.getAttribute(name) !== value) from.setAttribute(name, value);
  for (const { name } of [...from.attributes]) if (name !== 'style' && !to.hasAttribute(name)) from.removeAttribute(name);
  if (from.childNodes.length !== to.childNodes.length) { from.innerHTML = to.innerHTML; return; }
  from.childNodes.forEach((child, index) => morph(child, to.childNodes[index]));
}
function put(el, html) {
  if (!el || el.dataset.html === html) return false;
  if (el.dataset.html) { const next = document.createElement(el.tagName); next.innerHTML = html; if (next.childNodes.length === el.childNodes.length) el.childNodes.forEach((child, index) => morph(child, next.childNodes[index])); else el.innerHTML = html; }
  else el.innerHTML = html;
  el.dataset.html = html;
  return true;
}

// Die Rückfrage der App: nennt in der Überschrift, was geschehen soll, darunter die Folge. „Abbrechen“ hat den
// Fokus; Escape und ein Klick neben das Feld brechen ebenfalls ab.
function ask({ title, text, ok, danger }) {
  const box = document.getElementById('ask');
  const yes = document.getElementById('askYes');
  const no = document.getElementById('askNo');
  document.getElementById('askTitle').textContent = title;
  document.getElementById('askText').textContent = text;
  yes.textContent = ok;
  yes.className = 'btn' + (danger ? ' danger' : '');
  no.textContent = t('cancel');
  return new Promise((resolve) => {
    box.returnValue = '';
    yes.onclick = () => box.close('yes');
    no.onclick = () => box.close('');
    box.onclick = (event) => { if (event.target === box) box.close(''); };
    box.onclose = () => resolve(box.returnValue === 'yes');
    box.showModal();
    no.focus();
  });
}

let toastTimer;
function toast(text) { const el = document.getElementById('toast'); el.textContent = text; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 5000); }
async function call(action, body) {
  try {
    const response = await fetch('/api/' + action, { method: 'POST', headers: { 'content-type': 'application/json', 'x-rc-token': TOKEN }, body: JSON.stringify(body ?? {}) });
    const answer = await response.json();
    if (!response.ok) { toast(answer.error || t('stale')); return false; }
    refresh(); return true;
  } catch { toast(t('noAnswer')); return false; }
}

// --- Projektleiste ---

function projectState(entry) {
  const jobs = entry.pipelines.flatMap((p) => p.jobs);
  const failed = jobs.filter((j) => jobState(j) === 'fail').length;
  if (entry.pipelines.length) {
    const finish = entry.pipelines.map((p) => p.finishAt).filter(Boolean).sort().pop();
    return { dot: failed ? 'fail' : 'run', text: [failed ? t('failedN', failed) : '', finish ? '<span data-finish="' + esc(finish) + '"></span>' : t('noRunner')].filter(Boolean).join(' · ') };
  }
  if (entry.pool?.paused) return { dot: 'idle', text: t('paused') };
  const last = entry.lastRun;
  if (last?.conclusion === 'failure') return { dot: 'fail', text: t('failed') + ' <span data-ago="' + esc(last.updatedAt) + '"></span>' };
  if (last && secondsSince(last.updatedAt) < 1800) return { dot: 'done', text: t('finished') + ' <span data-ago="' + esc(last.updatedAt) + '"></span>' };
  return { dot: 'idle', text: t('ready') };
}

// Projekte, deren Jobs ihr Limit erreicht haben oder ihm nahe kamen: Dort gibt es in den Einstellungen etwas zu tun.
function limitTrouble() {
  const at = (state) => data.repos.filter((entry) => entry.pool?.limits?.fit?.state === state);
  const full = at('full');
  const repos = full.length ? full : at('tight');
  return repos.length ? { text: t(full.length ? 'tagFull' : 'tagTight'), repos: repos.map((entry) => entry.repo) } : null;
}

// --- Netzplan ---

function columnsOf(pipeline) {
  const jobs = pipeline.jobs;
  if (!pipeline.graph || jobs.every((j) => !j.needs.length)) { // ohne Abhängigkeiten: in Startreihenfolge, sechs je Spalte
    const ordered = [...jobs].sort((a, b) => String(a.startedAt ?? '9').localeCompare(String(b.startedAt ?? '9')));
    return Array.from({ length: Math.ceil(ordered.length / 6) }, (_, i) => ordered.slice(i * 6, i * 6 + 6));
  }
  const columns = [];
  for (const job of jobs) (columns[job.stage] ??= []).push(job);
  const rowOf = new Map();
  columns.filter(Boolean).forEach((column, index) => { // Reihenfolge wie bei den Vorgängern, damit sich Strecken wenig kreuzen
    if (index) column.sort((a, b) => Math.min(...a.needs.map((n) => rowOf.get(n) ?? 99), 99) - Math.min(...b.needs.map((n) => rowOf.get(n) ?? 99), 99));
    column.forEach((job, row) => rowOf.set(job.name, row / Math.max(1, column.length - 1)));
  });
  return columns.filter(Boolean);
}

// `again`: das Repo, wenn sich die Jobs dieses Laufs erneut starten lassen (der Lauf ist abgeschlossen), sonst leer.
// Läufe und Jobs, die eben erneut gestartet wurden ("Repo/Kennung" -> wann): Ihre Schaltflächen bleiben gesperrt, bis
// GitHub den neuen Versuch zeigt und sie damit verschwinden; ein zweiter Klick brächte nur eine Absage.
const restarted = new Map();
const RESTART_HOLD_MS = 60000;
const held = (repo, id) => (Date.now() - (restarted.get(repo + '/' + id) ?? 0) < RESTART_HOLD_MS ? ' aria-disabled="true"' : '');

function pill(j, again) {
  const state = jobState(j);
  const bit = (text) => (text ? '<span class="bit">' + esc(text) + '</span>' : '');
  const lines = [];
  let time = '';
  const usual = j.estimate ? t('usual', clock(j.estimate)) : '';
  const step = j.step ? t('step', j.step.number, j.step.total, j.step.name) : '';
  if (state === 'run') {
    time = '<span class="tm" data-since="' + esc(j.startedAt) + '" data-est="' + (j.estimate ?? '') + '"></span>';
    if (step) lines.push(esc(step));
    lines.push([bit(seatOf.get(j.runner) ? t('seatN', seatOf.get(j.runner)) : ''), j.estimate ? '<span class="bit" data-usual="' + esc(j.startedAt) + '" data-est="' + j.estimate + '"></span>' : ''].filter(Boolean).join(' · '));
  } else if (state === 'wait') {
    time = j.estimate ? '<span class="tm dim">' + t('approx', clock(j.estimate)) + '</span>' : '';
    lines.push([bit(j.status === 'pending' ? t('notYet') : ''), esc(j.needs.length ? t('waitsFor', j.needs.join(', ')) : t('waitsRunner'))].filter(Boolean).join(' · '));
  } else {
    time = j.duration != null && state !== 'skip' ? '<span class="tm">' + clock(j.duration) + '</span>' : '';
    lines.push(state === 'fail' && step ? esc(step) : state === 'done' && usual ? bit(usual) : bit(t('s_' + state)));
  }
  const full = lines.filter(Boolean);
  const lined = Boolean(full.length) && (mode === 'detail' || state === 'fail');
  const link = '<a class="pill s-' + state + (lined ? ' lined' : '') + '" data-job="' + esc(j.name) + '" data-needs="' + esc(JSON.stringify(j.needs)) + '" href="' + esc(j.url) + '" target="_blank" rel="noopener">' + icon(state) +
    '<span class="n">' + esc(j.name) + '</span>' + time + (lined ? '<span class="line">' + full[0] + '</span>' : '') + '<div class="more"><div>' + full.map((line) => '<p>' + line + '</p>').join('') + '</div></div>' +
    (state === 'run' ? '<i class="pg" data-progress="' + esc(j.startedAt) + '" data-est="' + (j.estimate ?? '') + '"></i>' : '') + '</a>';
  // Die Pill ist ein Link; die Schaltfläche steht deshalb neben ihr, nicht in ihr.
  // Ein ausgesetzter Job lief nie: Da gibt es nichts erneut zu starten.
  if (!again || !j.id || j.status !== 'completed' || state === 'skip') return link;
  return '<div class="job">' + link + '<button class="btn only rejob" data-do="job/rerun" data-repo="' + esc(again) + '" data-id="' + esc(j.id) + '"' + held(again, j.id) + ' aria-label="' + esc(t('rerunJob')) + '" data-tip="' + esc(t('rerunJob')) + '">' + glyph('rerun') + '</button></div>';
}

// `repo` steht im Kopf, wenn `named`. Ein abgeschlossener Lauf trägt unter dem Kopf, was sich erneut starten lässt.
function runBlock(pipeline, running, repo, named) {
  const jobs = pipeline.jobs;
  const done = jobs.filter((j) => j.status === 'completed').length;
  const failed = jobs.filter((j) => jobState(j) === 'fail').length;
  let big;
  let sub;
  if (running) {
    big = pipeline.finishAt ? '<b data-finish="' + esc(pipeline.finishAt) + '" data-short="1"></b>' : '<b class="small">' + t('noRunner') + '</b>';
    sub = [t('untilDone'), t('jobsDone', done, jobs.length), failed ? '<span class="c-fail">' + t('failedN', failed) + '</span>' : '', pipeline.rough ? t('rough') : ''].filter(Boolean).join(' · ');
  } else {
    const word = { success: ['finished', 'c-done'], failure: ['failed', 'c-fail'], cancelled: ['cancelled', ''] }[pipeline.conclusion] ?? ['finished', ''];
    big = '<b class="small ' + word[1] + '">' + t(word[0]) + '</b>';
    sub = '<span data-ago="' + esc(pipeline.updatedAt) + '"></span> · ' + t('took', clock(secondsSince(pipeline.startedAt) - secondsSince(pipeline.updatedAt)));
  }
  const again = !running && repo && pipeline.id ? repo : '';
  const rerun = (text, tip, only) => '<button class="btn" data-do="run/rerun" data-repo="' + esc(repo) + '" data-id="' + esc(pipeline.id) + '"' + (only ? ' data-failed-only="1"' : '') + held(repo, pipeline.id) + ' data-tip="' + esc(t(tip)) + '">' + (only ? '' : glyph('rerun')) + t(text) + '</button>';
  const acts = again ? '<div class="row">' + rerun('rerun', 'rerunTip') + (failed || ['failure', 'cancelled', 'timed_out'].includes(pipeline.conclusion) ? rerun('rerunFailed', 'rerunFailedTip', true) : '') + '</div>' : '';
  const meta = [named ? esc(repo) : '', esc(pipeline.workflow), esc(pipeline.branch || pipeline.event), running ? '<span data-running="' + esc(pipeline.startedAt) + '"></span>' : t('lastRun')].filter(Boolean).join(' · ');
  return '<div class="stack" style="gap:14px"><div class="head"><div><h1>' + esc(pipeline.title || pipeline.workflow) + '</h1><div class="sub"><a href="' + esc(pipeline.url) + '" target="_blank" rel="noopener">' + meta + '</a></div></div><div class="eta">' + big + '<div class="sub">' + sub + '</div></div></div>' + acts +
    '<div class="planwrap"><div class="plan' + (mode === 'detail' ? ' detail' : '') + '"><svg aria-hidden="true"></svg>' + columnsOf(pipeline).map((column) => '<div class="col">' + column.map((j) => pill(j, again)).join('') + '</div>').join('') + '</div></div>' +
    (pipeline.graph ? '' : '<div class="note">' + t('noGraph') + '</div>') + '</div>';
}

// Strecken zwischen den Pills: aus der rechten Mitte des Vorgängers in die linke Mitte des Nachfolgers.
function drawLinks(plan) {
  const box = plan.getBoundingClientRect();
  const pills = new Map([...plan.querySelectorAll('.pill')].map((el) => [el.dataset.job, el]));
  let paths = '';
  for (const [, el] of pills) {
    const to = el.getBoundingClientRect();
    for (const name of JSON.parse(el.dataset.needs)) {
      const parent = pills.get(name);
      if (!parent) continue;
      const from = parent.getBoundingClientRect();
      const x1 = from.right - box.left, y1 = from.top + from.height / 2 - box.top, x2 = to.left - box.left, y2 = to.top + to.height / 2 - box.top, split = x1 + (x2 - x1) * 0.3, join = x2 - (x2 - x1) * 0.3, bend = Math.max(12, (join - split) * 0.55);
      const on = traced && plan.contains(traced) && (name === traced.dataset.job || el.dataset.job === traced.dataset.job);
      paths += '<path data-from="' + esc(name) + '" data-to="' + esc(el.dataset.job) + '" class="' + (/s-(wait|skip)/.test(el.className) ? 'open' : '') + (on ? ' on' : '') + '"' + ' d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' H' + split.toFixed(1) + ' C' + (split + bend).toFixed(1) + ' ' + y1.toFixed(1) + ' ' + (join - bend).toFixed(1) + ' ' + y2.toFixed(1) + ' ' + join.toFixed(1) + ' ' + y2.toFixed(1) + ' H' + x2.toFixed(1) + '"/>';
    }
  }
  plan.querySelector('svg').innerHTML = paths;
  plan.classList.toggle('tracing', Boolean(traced && plan.contains(traced)));
}
const observer = new ResizeObserver((entries) => { for (const plan of new Set(entries.map((entry) => entry.target.closest('.plan')).filter(Boolean))) drawLinks(plan); });
function watchPlans(root) {
  observer.disconnect();
  for (const plan of root.querySelectorAll('.plan')) {
    drawLinks(plan);
    for (const el of plan.querySelectorAll('.pill')) observer.observe(el);
  }
}
// Beim Überfahren einer Pill ihre Strecken hervorheben, die übrigen zurücknehmen.
let traced = null;
function trace(event) {
  // Die Schaltfläche neben einer Pill (siehe .job) zählt zu ihr.
  const pill = event.target.closest ? event.target.closest('.pill') ?? event.target.closest('.job')?.querySelector('.pill') ?? null : null;
  const active = pill && (event.type === 'mouseover' || event.type === 'focusin');
  traced = active ? pill : null;
  for (const plan of document.querySelectorAll('.plan')) {
    const here = active && plan.contains(pill);
    plan.classList.toggle('tracing', Boolean(here));
    for (const path of plan.querySelectorAll('path')) path.classList.toggle('on', Boolean(here) && (path.dataset.from === pill.dataset.job || path.dataset.to === pill.dataset.job));
  }
}
for (const type of ['mouseover', 'mouseout', 'focusin', 'focusout']) document.addEventListener(type, trace);

const legend = () => '<div class="legend">' + ['run', 'done', 'fail', 'cancel', 'skip', 'wait'].map((state) => '<span class="s-' + state + '">' + icon(state) + t('s_' + state) + '</span>').join('') + '</div>';

// --- Auslastung ---

function chart(id, label, value, of, source, max, format, warn, marks, note) {
  const at = source.at || [];
  const values = source.values || [];
  const span = source.span;
  charts[id] = { at, values, span, format };
  const headline = '<div class="k">' + label + '</div>' + (value ? '<div class="v' + (warn ? ' c-fail' : '') + '">' + value + ' <small>' + of + '</small></div>' : '');
  if (values.length < 2) return '<div>' + headline + '<div class="ax"><span>' + t('follows') + '</span></div></div>';
  const end = Date.now();
  const x = (time) => ((1 - (end - time) / span) * 300);
  const y = (v) => 70 - Math.min(1, v / max) * 62;
  const first = Math.max(0, at.findIndex((time) => end - time <= span));
  // Wo länger nichts gemessen wurde (die App war aus), reißt die Kurve ab, statt die Lücke zu überbrücken.
  const pieces = [];
  values.slice(first).forEach((v, i) => {
    if (!i || at[first + i] - at[first + i - 1] > span / 48) pieces.push([]);
    pieces.at(-1).push(x(at[first + i]).toFixed(1) + ',' + y(v).toFixed(1));
  });
  for (const points of pieces) if (points.length === 1) { const [px, py] = points[0].split(','); points.push((Number(px) + 1).toFixed(1) + ',' + py); } // ein einzelner Punkt wäre unsichtbar
  const edge = (point) => point.split(',')[0] + ',74';
  const curve = pieces.map((points) => '<polygon points="' + edge(points[0]) + ' ' + points.join(' ') + ' ' + edge(points.at(-1)) + '"/><polyline points="' + points.join(' ') + '"/>').join('');
  const peak = Math.max(...values.slice(first));
  const peakAt = at[first + values.slice(first).indexOf(peak)];
  const shown = marks.filter((time) => end - time < span);
  return '<div>' + headline + '<svg class="chart' + (warn ? ' warn' : '') + '" data-chart="' + id + '" viewBox="0 0 300 74" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
    '<line class="cap" x1="0" x2="300" y1="8" y2="8"/><line class="mid" x1="0" x2="300" y1="39" y2="39"/>' + shown.map((time) => '<line class="mark" x1="' + x(time).toFixed(1) + '" x2="' + x(time).toFixed(1) + '" y1="0" y2="74"/>').join('') +
    curve + '<line class="peak" x1="0" x2="300" y1="' + y(peak).toFixed(1) + '" y2="' + y(peak).toFixed(1) + '"/></svg>' +
    '<div class="ax"><span>' + (span > 3600000 ? t('before24') : t('before30')) + '</span>' + (shown.length ? '<span class="wide">' + t('started') + '</span>' : '') + '<span>' + t('now') + '</span></div><div class="k' + (warn ? ' c-fail' : '') + '">' + (note ? note + ' · ' : '') + t('peak', format(peak), ago(new Date(peakAt).toISOString())) + '</div></div>';
}

function bandCharts(marks) {
  const m = data.machine;
  const u = m.usage;
  const s = m.series;
  const tight = m.memoryFree < m.memoryTotal * 0.08;
  const src = (key) => ({ at: s.at, values: s[key], span: 30 * 60000 });
  const vmTight = m.vmTight; // die Docker-VM selbst meldet kaum noch freien Speicher: { free }
  return chart('vmMem', t('vmMem'), num((u.vmUsed ?? u.vmMemory + u.otherMemory) / 1073741824), t('of', gb(m.dockerMemory || m.memoryTotal)), src('vmMemory'), m.dockerMemory || m.memoryTotal, gb, Boolean(vmTight), marks, vmTight ? t('freeOnly', gb(vmTight.free)) : '') +
    chart('vmCpu', t('vmCpu'), num(u.vmCpu + u.otherCpu), t('cores', m.dockerCpus), src('vmCpu'), m.dockerCpus, (v) => num(v), false, marks) +
    chart('hostMem', t('hostMem'), num((m.memoryTotal - m.memoryFree) / 1073741824), t('of', gb(m.memoryTotal)), src('hostMemory'), m.memoryTotal, gb, tight, marks, tight ? t('freeOnly', gb(m.memoryFree)) : '');
}

function seats(entries) {
  const many = entries.length > 1;
  const rows = [];
  const idle = [];
  for (const entry of entries) {
    const short = shortRepo(entry.repo);
    entry.runners.forEach((r, index) => {
      if (!r.state.startsWith('arbeitet')) return;
      rows.push('<tr><td style="white-space:nowrap">' + esc(many ? short + ' ' + (index + 1) : index + 1) + '</td><td class="cut" title="' + esc(r.job?.job ?? '') + '">' + esc(r.job?.job ?? '') + '</td><td class="r">' + mb(r.memory) + '</td><td class="r">' + num(r.cores ?? 0) + '</td></tr>');
    });
    const rest = entry.runners.filter((r) => !r.state.startsWith('arbeitet'));
    const states = [...new Set(rest.map((r) => r.state))].map((state) => rest.filter((r) => r.state === state).length + ' ' + stateText(state)).join(', ');
    if (rest.length) idle.push((many ? short + ': ' : '') + states);
  }
  const reserve = entries.reduce((sum, e) => sum + (e.pool?.reserve ?? 0), 0);
  const wanted = entries.reduce((sum, e) => sum + (e.pool?.reserveWanted ?? 0), 0);
  return '<div class="label">' + t('seats') + '</div><div class="seats">' + (rows.length ? '<table><tr><th>' + t('seat') + '</th><th>' + t('job') + '</th><th class="r">' + t('ram') + '</th><th class="r">' + t('coresShort') + '</th></tr>' + rows.join('') + '</table>' : '') +
    idle.map((line) => '<div class="note" style="padding:6px 0;border-bottom:1px solid var(--rule)">' + esc(line) + '</div>').join('') + '<div class="note" style="padding-top:6px">' + t('reserve', reserve, wanted) + '</div></div>';
}

// --- Ansichten ---

// Das Anfragelimit des GitHub-Kontos, wenn es knapp oder aufgebraucht ist; sonst null.
// `out` heißt: RunClub fragt gar nicht mehr ab. Nur das ist eine Störung und rot.
// Die einzige Stelle, die die Zustandswörter des Backends kennt (siehe STATE in github.js).
const quotaState = () => ({ tight: data.quota?.state === 'tight', out: data.quota?.state === 'out' });
const quotaTrouble = () => { const { tight, out } = quotaState(); return tight || out ? { out, text: t(out ? 'quotaOutShort' : 'quotaTightShort') } : null; };
// Dasselbe für das Minuten-Kontingent von GitHub Actions (siehe STATE in minutes.js). `out` heißt: GitHub startet auf
// seinen Runnern nichts mehr. Wer über das Enthaltene hinaus bezahlt, hat sich so entschieden: Das ist nicht knapp.
const minutesState = () => ({ tight: data.minutes?.state === 'tight' && !data.minutes.paid, out: data.minutes?.state === 'out' });
const minutesTrouble = () => { const { tight, out } = minutesState(); return tight || out ? { out, text: t(out ? 'minutesOutShort' : 'minutesTightShort') } : null; };
// Was „Verbrauch“ in der Leiste meldet: eine Zeile, auch wenn beides zutrifft. Aufgebraucht geht vor knapp, bei
// Gleichstand die Anfragen vor den Minuten, weil ohne Anfragen auch die Anzeige stehen bleibt.
const usageTrouble = () => { const found = [quotaTrouble(), minutesTrouble()].filter(Boolean); return found.find((entry) => entry.out) ?? found[0] ?? null; };
// Eine Schiene: gefüllt bis `share` (0 bis 1), rot bei `alarm`, mit der gepunkteten Marke bei `mark`.
const fillBar = (share, alarm, mark) => '<i' + (alarm ? ' class="alarm"' : '') + ' style="--v:' + (Math.min(1, Math.max(0, share || 0)) * 100).toFixed(1) + '%;--mark:' + (mark * 100).toFixed(1) + '%"></i>';
const warnings = (entries) => [data.machine.docker === 'bereit' ? '' : t('docker', data.machine.docker), authTrouble() ?? '', quotaTrouble()?.out ? t('quotaOutTag', hourMinute(data.quota.resetAt)) : '', ...entries.filter((e) => e.error).map((e) => t('github', e.error))].filter(Boolean).map((text) => '<span class="tag c-fail">' + esc(text) + '</span>').join(' ');

// Überschrift einer Ansicht mit einem Satz darunter; `cls` färbt den Satz.
const viewHead = (title, sub, cls) => '<div class="head"><div><h1>' + title + '</h1><div class="sub' + (cls ? ' ' + cls : '') + '">' + sub + '</div></div></div>';

// Repos ohne Pool, in denen nichts vorankommt: je eine Zeile mit dem Angebot, einen Pool anzulegen. Entweder warten
// Jobs auf einen eigenen Runner (welche, steht im Tooltip), oder Läufe sind nicht gestartet, weil die Minuten bei
// GitHub aufgebraucht sind. Das ist eine Störung mit Ausweg: Das Symbol ist rot, der Tooltip nennt den Ausweg.
function unservedRows() {
  return (data.unserved ?? []).map((entry) => {
    // Je Grund: Zustandssymbol, Stamm der Textschlüssel, wie viele es sind, was der Tooltip sagt.
    const row = entry.reason === 'minutes' ? { state: 'fail', text: 'minutes', count: entry.runs, tip: t('minutesTip') } : { state: 'wait', text: 'unserved', count: entry.jobs.length, tip: entry.jobs.join(', ') };
    return '<div class="quiet"><a class="who s-' + row.state + '" href="' + esc(entry.url) + '" target="_blank" rel="noopener" data-tip="' + esc(entry.repo) + '">' + icon(row.state) + esc(shortRepo(entry.repo)) + '</a>' +
      '<div class="what" data-tip="' + esc(row.tip) + '">' + esc(t(row.text + (row.count === 1 ? 'One' : 'Many'), row.count, span(secondsSince(entry.since)))) + '</div>' +
      '<button class="btn" data-pick="' + esc(entry.repo) + '">' + glyph('plus') + t('addButton') + '</button></div>';
  }).join('');
}

// „Alle Projekte“: was läuft, steht groß da; ruhige Projekte je eine Zeile.
function quietRows(entries) {
  return entries.map((entry) => {
    const last = entry.lastRun;
    const state = entry.pool?.paused ? 'idle' : last ? jobState({ status: 'completed', conclusion: last.conclusion }) : 'idle';
    const jobs = last ? [...last.jobs].sort((a, b) => a.stage - b.stage) : [];
    const mini = jobs.length > 1 ? '<span class="mini">' + jobs.slice(0, 14).map((j) => '<span class="s-' + jobState(j) + '" title="' + esc(j.name) + '">' + icon(jobState(j)) + '</span>').join('<i></i>') + '</span>' : '';
    return '<div class="quiet"><button class="who s-' + state + '" data-view="' + esc(entry.repo) + '">' + icon(state) + esc(shortRepo(entry.repo)) + '</button>' +
      '<div class="what">' + (last ? mini + '<a href="' + esc(last.url) + '" target="_blank" rel="noopener">' + esc(last.title || last.workflow) + '</a>' : '<span class="dim">' + t('nothing') + '</span>') + '</div>' +
      '<div class="sub">' + (entry.pool?.paused ? t('paused') : last ? t('s_' + state) + ' <span data-ago="' + esc(last.updatedAt) + '"></span>' : '') + '</div></div>';
  }).join('');
}

function projectBlocks(entry, withRepo) {
  if (entry.pipelines.length) return entry.pipelines.map((p) => runBlock(p, true, entry.repo, withRepo)).join('');
  if (entry.lastRun) return runBlock(entry.lastRun, false, entry.repo);
  return '<div class="head"><div><h1>' + esc(entry.repo) + '</h1><div class="sub">' + t('nothing') + '</div></div></div>';
}

function renderOverview(entries, single) {
  const main = document.getElementById('main');
  if (main.dataset.shape !== 'overview') { main.dataset.shape = 'overview'; main.dataset.html = ''; main.innerHTML = '<div class="stack"><div class="band"><div id="charts" style="display:contents"></div><div id="seats"></div></div><div id="warn"></div><div id="runs" class="stack" style="gap:34px"></div></div>'; }
  put(document.getElementById('warn'), warnings(entries));
  const busy = entries.filter((entry) => entry.pipelines.length);
  const idleHead = viewHead(t('all'), t('idleAll'));
  const blocks = single ? projectBlocks(entries[0]) + legend() : (busy.length ? busy.map((entry) => projectBlocks(entry, true)).join('') + legend() : idleHead) + '<div>' + unservedRows() + quietRows(entries.filter((entry) => !entry.pipelines.length)) + '</div>';
  if (put(document.getElementById('runs'), blocks)) {
    watchPlans(main);
    // Schmale Fenster: die Spalte mit dem ersten laufenden oder roten Job in den Blick holen.
    if (window.innerWidth <= NARROW) main.querySelector('.pill.s-fail, .pill.s-run')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  put(document.getElementById('charts'), bandCharts(entries.flatMap((entry) => entry.pipelines.map((p) => new Date(p.startedAt).getTime()))));
  put(document.getElementById('seats'), seats(entries));
}

// Haltestelle „GitHub-Anfragen“: Kennzahl und Schiene zeigen das Verbrauchte, wie bei den Speicherspitzen mit der
// Marke, ab der es knapp ist; ab dort fragt RunClub seltener ab. Was noch frei ist und wann es weitergeht, steht im Kopf.
// Rot ist nur das erreichte Limit: Knapp verlangt nichts und vergeht von selbst.
function quotaStop() {
  const q = data.quota;
  if (!q) return '';
  const count = (n) => n.toLocaleString(locale());
  const { tight, out } = quotaState();
  const until = hourMinute(q.resetAt);
  const minutes = Math.max(1, Math.round((new Date(q.resetAt) - Date.now()) / 60000));
  return routeStop('github', t('quotaTitle'), t('quotaReset', count(q.remaining), until, minutes),
    '<div><div class="k">' + t('quotaLabel') + '</div><div class="v' + (out ? ' c-fail' : '') + '">' + count(q.limit - q.remaining) + ' <small>' + t('quotaOf', count(q.limit)) + '</small></div></div>' +
    '<div class="um solo">' + fillBar((q.limit - q.remaining) / q.limit, out, q.tightAt) + '</div>' +
    '<div class="note measure' + (tight ? ' strong' : '') + '">' + (out ? '<span class="c-fail">' + t('quotaOut', until) + '</span> <span class="ink">' + t('quotaOutMore') + '</span>' : t(tight ? 'quotaTight' : 'quotaOk', until)) + '</div>');
}

// Haltestelle „GitHub-Minuten“: was das Konto in diesem Monat auf GitHubs eigenen Runnern verbraucht hat, gebaut wie
// die GitHub-Anfragen. Die Bezugsgröße ist eine Annahme aus dem Tarif (siehe minutes.js); ohne sie gibt es nur die
// Kennzahl. Knapp verlangt nichts. Rot ist das Aufgebrauchte, weil es einen Ausweg gibt: eigene Runner oder ein Budget.
// Fehlt das freiwillige Recht dafür, steht hier nur der Satz mit dem Weg zur Haltestelle „GitHub“ der Einstellungen.
function minutesStop() {
  const m = data.minutes;
  const lacking = data.auth?.optional.find((entry) => entry.purpose === 'minutes');
  if (!m) return !lacking ? '' : routeStop('minutes', t('minutesTitle'), '', '<div class="row"><span class="rt note">' + t('minutesNoScope', '<code>' + esc(lacking.scope) + '</code>') + '</span><button class="btn" data-view="settings" data-goto="auth">' + t('toAuth') + '</button></div>');
  const count = (n) => n.toLocaleString(locale());
  const { tight, out } = minutesState();
  // Der Monat der Abrechnung wechselt nach Weltzeit.
  const day = new Date(m.resetAt).toLocaleDateString(locale(), { day: 'numeric', month: 'long', timeZone: 'UTC' });
  const systems = [['Linux', m.systems.linux], ['Windows', m.systems.windows], ['macOS', m.systems.macos], [t('minutesOther'), m.systems.other]].filter(([, value]) => value > 0);
  const about = [
    systems.length > 1 ? t('minutesParts', systems.map(([name, value]) => name + ' ' + count(value)).join(', ')) : systems.length ? t('minutesAll', systems[0][0]) : '',
    m.included ? t('minutesAssumed', count(m.included), esc(m.plan.charAt(0).toUpperCase() + m.plan.slice(1))) : t('minutesNoPlan'),
    m.paid ? t('minutesPaid', count(m.paid), m.cost.toLocaleString(locale(), { style: 'currency', currency: 'USD' })) : '',
  ].filter(Boolean).join(' ');
  return routeStop('minutes', t('minutesTitle'), m.included ? t('minutesReset', count(Math.max(0, m.included - m.used)), day) : t('minutesResetOnly', day),
    '<div><div class="k">' + t('minutesLabel') + '</div><div class="v' + (out ? ' c-fail' : '') + '">' + count(m.used) + (m.included ? ' <small>' + t('of', count(m.included)) + '</small>' : '') + '</div></div>' +
    (m.included ? '<div class="um solo">' + fillBar(m.used / m.included, out, m.tightAt) + '</div>' : '') +

function renderUsage() {
  const main = document.getElementById('main');
  main.dataset.shape = 'usage';
  const m = data.machine;
  const day = dayData ?? [];
  const src = (key) => ({ at: day.map((p) => p.at), values: day.map((p) => p[key + 'Max']), span: 24 * 3600000 });
  // Die höchste gemessene Spitze eines Projekts, gemessen an dem, was ein Job darf.
  const tightAt = m.limitsView.tightAt; // ab diesem Anteil am Limit gilt eine Spitze als knapp
  const meter = (label, peak, allowed) => {
    const tight = peak > allowed * tightAt;
    return '<div class="um"><span>' + label + '</span>' + fillBar(allowed ? peak / allowed : 0, tight, tightAt) + '<b' + (tight ? ' class="c-fail"' : '') + '>' + mb(peak) + ' <small>' + t('of', gb(allowed)) + '</small></b></div>';
  };
  const projects = data.repos.map((entry, index) => {
    const u = entry.usage ?? { jobs: [] };
    // Gemessen wird am Limit dieses Projekts; ohne eigene Werte ist das das Limit für alle.
    const allowRunner = entry.pool?.limits ? entry.pool.limits.values.runnerMemory * GIB : limitBytes(m.limits.runnerMemory);
    const allowDocker = entry.pool?.limits ? entry.pool.limits.values.dockerMemory * GIB : limitBytes(m.limits.dockerMemory);
    const peakRunner = Math.max(0, ...u.jobs.map((j) => j.peakRunner));
    const peakDocker = Math.max(0, ...u.jobs.map((j) => j.peakDocker));
    // Der Wert, der die Schiene bestimmt, tritt in der Tabelle hervor.
    const cell = (value, peak) => '<td class="r' + (value > 0 && value === peak ? ' top' : '') + '">' + (value > 0 ? mb(value) : '–') + '</td>';
    // Zwei Workflows können einen Job gleich nennen: Nur dann steht der Workflow dabei.
    // Kommt ein Jobname im Projekt mehrfach vor, steht der Workflow dabei: in der Tabelle gedämpft, im Satz mit Punkt.
    const sharesName = (j) => j.workflow && u.jobs.some((other) => other !== j && other.job === j.job);
    const jobLabel = (j, dim) => esc(j.job) + (sharesName(j) ? (dim ? ' <span class="dim">' + esc(j.workflow) + '</span>' : ' · ' + esc(j.workflow)) : '');
    const rows = u.jobs.map((j) => '<tr><td>' + jobLabel(j, true) + '</td>' + cell(j.peakRunner, peakRunner) + cell(j.peakDocker, peakDocker) + '<td class="r">' + (j.peakMemory ? num(j.peakCpu) : '–') + '</td><td class="r">' + (j.peakMemory ? num(j.cpu) : '–') + '</td><td class="r">' + clock(j.duration) + '</td><td class="r">' + j.runs + '</td></tr>').join('');
    // Was am nächsten an seinem Limit liegt: welcher Job, welche Seite, wie viel.
    const near = [['Runner', peakRunner, allowRunner, 'peakRunner'], ['Docker', peakDocker, allowDocker, 'peakDocker']].filter(([, peak, allowed]) => peak > allowed * tightAt).sort((a, b) => b[1] / b[2] - a[1] / a[2])[0];
    const peaks = peakRunner + peakDocker > 0 ? '<div><div class="k">' + t('peakTitle') + '</div><div class="meters">' + meter('Runner', peakRunner, allowRunner) + meter('Docker', peakDocker, allowDocker) + '</div></div>' +
      (near ? '<div class="row"><span class="rt note c-fail">' + t('nearLimit', jobLabel(u.jobs.find((j) => j[near[3]] === near[1])), mb(near[1]), gb(near[2]), near[0]) + '</span><button class="btn" data-view="settings" data-goto="limits">' + glyph('gauge') + t('toLimits') + '</button></div>' : '') : '';
    const body = !rows ? '<div class="note">' + t('noUsage') + '</div>' : peaks +
      '<div class="scroll"><table class="fixed"><tr><th>' + t('job') + '</th><th class="r">' + t('ramRunner') + '</th><th class="r">' + t('ramDocker') + '</th><th class="r">' + t('cpuPeak') + '</th><th class="r">' + t('cpuAvg') + '</th><th class="r">' + t('usualTime') + '</th><th class="r">' + t('runs') + '</th></tr>' + rows + '</table></div>' +
      (u.wait ? '<div class="note">' + t('wait', span(u.wait.usual), span(u.wait.longest), u.wait.jobs) + '</div>' : '');
    return routeStop('p' + index, shortRepo(entry.repo), u.jobs.length ? t(u.jobs.length === 1 ? 'jobMeasured' : 'jobsMeasured', u.jobs.length) : '', body);
  }).join('');
  put(main, '<div class="stack set"><div class="head"><div><h1>' + t('usage') + '</h1></div></div><div class="route">' +
    routeStop('day', t('day'), '', '<div class="trio">' + chart('dayVmMem', t('vmMem'), '', '', src('vmMemory'), m.dockerMemory || m.memoryTotal, gb, false, []) + chart('dayVmCpu', t('vmCpu'), '', '', src('vmCpu'), m.dockerCpus, (v) => num(v), false, []) + chart('dayHostMem', t('hostMem'), '', '', src('hostMemory'), m.memoryTotal, gb, false, []) + '</div>') +
    quotaStop() + minutesStop() + projects + '</div></div>');
}

const glyph = (name, cls) => '<svg class="g' + (cls ? ' ' + cls : '') + '" viewBox="0 0 16 16" aria-hidden="true">' + GLYPHS[name] + '</svg>';

// Von heute genügt die Uhrzeit; Älteres nennt den Tag und spart dafür die Sekunden.
function logTime(iso) {
  const at = new Date(iso);

    : at.toLocaleDateString(locale(), { day: '2-digit', month: '2-digit' }) + ' ' + hourMinute(at);
