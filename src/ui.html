      '<div class="pbody"><div' + (open ? '' : ' inert') + '><div class="pin">' + guardNote + missing + route + limits + '<div>' + caches + '</div>' + foot + '</div></div></div></div>';
  }).join('');
  // Suggestions only where a pool is possible (see `free` in listRepos).
  const free = (repoList ?? []).filter((r) => r.free);
  const add = '<div class="addrow"><span>' + t('add') + '</span><form id="add"><input type="text" id="addRepo" class="grow" list="repoList" placeholder="' + t('addPlaceholder') + '" aria-label="' + t('add') + '" autocomplete="off" spellcheck="false">' +
    '<datalist id="repoList">' + free.map((r) => '<option value="' + esc(r.repo) + '">').join('') + '</datalist><button class="btn" type="submit">' + glyph('plus') + t('addButton') + '</button></form>' +
    (free.length ? '<span class="quick"><span class="note">' + t('addQuick') + '</span>' : '') + free.slice(0, 3).map((r) => '<button class="btn" data-pick="' + esc(r.repo) + '" data-tip="' + esc(t('addQuickTip', r.repo)) + '">' + esc(shortRepo(r.repo)) + '</button>').join('') + (free.length ? '</span>' : '') + installNote() + '</div><div class="note">' + esc(t('addHint')) + '</div>';

  // --- Limits per job: what all slots together may use, measured against the Docker VM ---
  // With the cache switched on, each project runs a build service with the Docker limit, even while the pool is paused.
  const serviceBytes = (entry) => (entry.pool.cache ? limitsFor(entry).dockerMemory * GIB : 0);
  const places = (entry) => (entry.pool.paused ? 0 : entry.pool.parallel);
  const active = withPool.filter((entry) => places(entry) || serviceBytes(entry));
  const slots = active.reduce((sum, entry) => sum + places(entry), 0);
  const services = active.reduce((sum, entry) => sum + serviceBytes(entry), 0);
  const jobBytes = (entry) => { const values = limitsFor(entry); return (values.runnerMemory + values.dockerMemory) * GIB; };
  const allowed = (entry) => places(entry) * jobBytes(entry) + serviceBytes(entry);
  const total = active.reduce((sum, entry) => sum + allowed(entry), 0);
  const vm = m.dockerMemory;
  const over = vm > 0 && total > vm;
  const tooBig = vm > 0 && active.some((entry) => places(entry) && jobBytes(entry) + serviceBytes(entry) > vm); // a single job with its build service may already use more than the VM has
  const capAt = vm / (Math.max(total, vm) || 1) * 100;
  const gbClean = (bytes) => { const value = Math.round(bytes / GIB * 10) / 10; return num(value, value % 1 ? 1 : 0) + ' GB'; };
  // Filled is what fits into the VM at full limit. The build services always run and therefore come first;
  // the slots fit into the rest, smallest first.
  const fitting = active.map(() => 0); // per project: this many of its slots fit
  const serviceFits = active.map(() => false);
  let used = 0;
  const fill = (parts, mark) => { for (const part of parts.filter((p) => p.bytes).sort((a, b) => a.bytes - b.bytes)) { if (used + part.bytes > vm) break; used += part.bytes; mark(part.index); } };
  fill(active.map((entry, index) => ({ index, bytes: serviceBytes(entry) })), (index) => { serviceFits[index] = true; });
  fill(active.flatMap((entry, index) => Array.from({ length: places(entry) }, () => ({ index, bytes: jobBytes(entry) }))), (index) => { fitting[index] += 1; });
  const fits = fitting.reduce((sum, count) => sum + count, 0);
  const cell = (bytes, cls) => '<i' + (cls ? ' class="' + cls + '"' : '') + ' style="flex:' + (bytes / GIB).toFixed(3) + '"></i>';
  const cells = (entry, index) => Array.from({ length: places(entry) }, (_, place) => cell(jobBytes(entry), place < fitting[index] ? '' : 'out')).join('') + (serviceBytes(entry) ? cell(serviceBytes(entry), serviceFits[index] ? 'svc' : 'svc out') : '');
  const caption = (entry) => [places(entry) ? places(entry) + ' × ' + gbClean(jobBytes(entry)) : '', serviceBytes(entry) ? t('budgetService', gbClean(serviceBytes(entry))) : ''].filter(Boolean).join(' + ');
  const segments = active.map((entry, index) => '<div class="bseg" style="flex:' + (allowed(entry) / GIB).toFixed(3) + '"><div>' + cells(entry, index) + '</div><span><b>' + esc(shortRepo(entry.repo)) + '</b>' + caption(entry) + '</span></div>').join('');
  const budget = !slots || !vm ? '' : '<div><div class="k">' + t(services ? 'budgetLabelService' : 'budgetLabel', slots) + '</div><div class="v' + (tooBig ? ' c-fail' : '') + '">' + gbClean(total) + ' <small>' + t('budgetOf', gbClean(vm)) + '</small></div>' +
    '<div class="budget">' + segments + (total < vm ? '<div style="flex:' + ((vm - total) / GIB).toFixed(3) + '"></div>' : '') + '<div class="bcap' + (capAt > 60 ? ' end' : '') + '" style="left:' + capAt.toFixed(2) + '%"><span>' + t('vmMark') + '</span></div></div>' +
    '<div class="note measure' + (tooBig ? ' c-fail' : '') + '" style="padding-top:12px">' + (!over ? t('budgetOk') : tooBig ? t('budgetOver1') : t(fits === 1 ? 'budgetOverOne' : 'budgetOver', fits, slots)) + info(t('infoMemory'), over && !tooBig ? t('budgetOverInfo') : '', t('budgetHow')) + '</div></div>';
  // Free runners keep their limits until the next job; whoever doesn't want to wait rebuilds them.
  const stale = withPool.reduce((sum, entry) => sum + (entry.pool.limits?.stale ?? 0), 0);
  const rebuild = !stale ? '' : '<div class="row"><span class="rt note">' + t(stale === 1 ? 'staleOne' : 'staleMany', stale) + '</span>' + button('rebuild', t('rebuild'), { do: 'pool/rebuild' }) + '</div>';
  // The suggestion applies to all projects together: a default for the majority, own limits for outliers.
  const plan = lv.plan;
  const outliers = plan ? withPool.filter((entry) => plan.own[entry.repo]).map((entry) => esc(shortRepo(entry.repo))) : [];
  const planned = !plan ? '<div class="note">' + t('suggestNone') + '</div>' : '<div class="row"><span class="rt note">' +
    '<span class="ink">' + (plan.applied ? t('planApplied') : t('planText', gbShort(plan.shared.runnerMemory), gbShort(plan.shared.dockerMemory), plan.shared.runnerCpus) + (outliers.length ? ' ' + t('planOwn', outliers.join(', ')) : '')) + '</span>' + info(t('infoSuggest'), t('planWhy')) + '</span>' +
    (plan.applied ? '' : button('gauge', t('suggestApply'), { do: 'limits/plan' })) + '</div>';
  const limitsAll = '<div class="vary">' + budget + '</div>' + sliders(shared, plan?.shared, '') + '<div class="vary">' + planned + '</div><div class="vary">' + rebuild + '</div>';

  // --- App and log ---
  const arow = (title, hint, control, more = '') => '<div class="arow"><div><b>' + title + '</b>' + (more ? info(title, ...[].concat(more)) : '') + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>' + control + '</div>';
  // Version and update (from main.js; missing when the backend runs on its own).
  const up = data.app?.update;
  const busy = data.repos.flatMap((entry) => entry.runners).filter((r) => r.state === SLOT.WORKING).length;
  const failCode = up?.error && ['private', 'network', 'http', 'broken', 'missing', 'other'].includes(up.error.code) ? up.error.code : 'other';
  const upState = !up ? '' : up.error ? t('updFail_' + failCode) : ({
    dev: t('updDev'), idle: t('updIdle'), checking: t('updChecking'), downloading: t('updDownloading', esc(up.available ?? '')),
    current: t('updCurrent', up.checkedAt ? new Date(up.checkedAt).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' }) : '–'), ready: '',
  })[up.phase] ?? '';
  // In development mode the channel stays visible but disabled: there is nothing to fetch.
  const dev = up?.phase === 'dev';
  const channel = (value, text) => '<button data-do="app/channel" data-channel="' + value + '" aria-pressed="' + (up.channel === value) + '"' + (dev ? ' aria-disabled="true" data-tip="' + esc(t('updDevTip')) + '"' : '') + '>' + text + '</button>';
  const checkNow = up && (up.error || ['current', 'error', 'idle'].includes(up.phase)) && !['checking', 'downloading'].includes(up.phase) ? '<button class="btn" data-do="app/check">' + t('updCheck') + '</button>' : '';
  const update = !up ? '' : arow(esc(t('version', up.version)), upState, checkNow, up.error ? [t('updWhy_' + failCode, up.error.status ? '(' + up.error.status + ')' : ''), t('updVersionInfo')] : t('updVersionInfo')) +
    arow(t('updChannel'), '', '<span class="seg" role="group" aria-label="' + t('updChannel') + '">' + channel('stable', t('updStable')) + channel('beta', t('updBeta')) + '</span>', t('updInfo')) +
    (!up.ready ? '' : arow(esc(t('updReady', up.ready)), '', button('update', t('updInstall'), { do: 'app/update', confirm: t('confirmUpdate', up.ready) }, { why: busy === 1 ? t('updBusyOne') : busy ? t('updBusy', busy) : '' }), t('updReadyHint')));
  const app = update + (data.app ? arow(t('autostart'), '', '<input type="checkbox" class="sw" id="autostart" aria-label="' + t('autostart') + '"' + (data.app.autostart ? ' checked' : '') + '>') : '') +
    arow(t('view'), '', seg('mode', [['compact', t('compact')], ['detail', t('detail')]], mode), t('viewHint')) + arow(t('language'), '', seg('lang', [['de', 'Deutsch'], ['en', 'English']], lang)) +
    '<div class="row" style="padding-top:12px">' + button('power', t('quit'), { do: 'shutdown', confirm: t('confirmQuit') }, { cls: 'danger push' }) + '</div>';
  // The filter offers every project with a pool and every one that still has messages (a removed pool).
  const logRepos = [...new Set([...withPool.map((entry) => entry.repo), ...logData.map((entry) => entry.repo).filter(Boolean)])];
  if (logRepo && logRepo !== LOG_GENERAL && !logRepos.includes(logRepo)) logRepo = '';
  // General errors belong to a project too: that is often where the cause is (Docker not answering).
  const logShown = logData.filter((entry) => !logRepo || (logRepo === LOG_GENERAL ? !entry.repo : entry.repo === logRepo || (!entry.repo && entry.kind === 'error'))).reverse();
  const logPick = (repo, text) => '<button data-log-repo="' + esc(repo) + '" aria-pressed="' + (logRepo === repo) + '">' + esc(text) + '</button>';
  const logRow = (entry) => { const state = LOG_STATE[entry.kind]; return '<li' + (state ? ' class="s-' + state + '"' : '') + '><time datetime="' + esc(entry.at) + '" data-tip="' + esc(new Date(entry.at).toLocaleString(locale())) + '">' + logTime(entry.at) + '</time>' +
    (logRepo ? '' : '<span class="lp"' + (entry.repo ? ' data-tip="' + esc(entry.repo) + '"' : '') + '>' + esc((entry.repo ?? '').split('/').pop()) + '</span>') + (state ? icon(state) : '<span></span>') +
    // Under a project general errors show up too; without a project column the row itself says so.
    '<span class="lm">' + (logRepo && logRepo !== LOG_GENERAL && !entry.repo ? '<span class="dim">' + t('logGeneral') + ' · </span>' : '') + esc(logText(entry)) + '</span></li>'; };
  // The latest messages are shown; copy and save take the whole file.
  const log = '<div class="row">' + (logRepos.length > 1 ? '<span class="seg wide" role="group" aria-label="' + t('logFilter') + '">' + logPick('', t('logAll')) + logRepos.map((repo) => logPick(repo, shortRepo(repo))).join('') + logPick(LOG_GENERAL, t('logGeneral')) + '</span>' : '') +
    '<span class="row push"><button class="btn" data-log-copy data-tip="' + t('logCopyTip') + '">' + glyph('copy') + t('logCopy') + '</button><a class="btn" href="/api/log/file" download="runclub.log" data-tip="' + t('logSaveTip') + '">' + glyph('save') + t('logSave') + '</a></span></div>' +
    (logShown.length ? '<ul class="log' + (logRepo ? ' noproject' : '') + (logOpen ? ' open' : '') + '"' + (logOpen ? ' tabindex="0"' : '') + '>' + (logOpen ? logShown : logShown.slice(0, LOG_SHORT)).map(logRow).join('') + '</ul>' : logRepo ? '<div class="note">' + t('logNone') + '</div>' : '') +
    (logShown.length > LOG_SHORT ? '<div class="row"><button class="btn" data-log aria-expanded="' + logOpen + '">' + glyph('open') + t(logOpen ? 'showLess' : 'showAll') + '</button></div>' : '');

  // "GitHub" comes first: the sign-in is the precondition for everything after it, and so the line reads in the
  // order of setting up. If all is well, it is two rows.
  const html = '<div class="stack set"><div class="head"><div><h1>' + t('settings') + '</h1></div></div><div class="route">' +
    (data.auth ? stop('auth', 'GitHub', '', authBody()) : '') + stop('projects', t('projects'), withPool.length ? t('projectsSum', withPool.length, withPool.reduce((sum, entry) => sum + entry.pool.parallel, 0)) : '', projects + add, [t('projectsInfo')]) +
    stop('limits', t('limitsTitle'), t('limitsNew'), limitsAll, [t('limitsInfo')]) + stop('app', t('app'), '', app) + stop('log', t('log'), !logShown.length ? '' : logShown.length === 1 ? t('logSideOne') : !logOpen && logShown.length > LOG_SHORT ? t('logSideOf', LOG_SHORT, logShown.length) : t('logSide', logShown.length), log, [t('logInfo')]) + '</div></div>';
  // Do not rebuild while the input field holds something not yet submitted.
  if (document.activeElement?.id === 'addRepo' && document.activeElement.value && main.dataset.html) return;
  put(main, html);
  // Sliders and switches remember what the user last set; the shown state comes from the data.
  for (const el of main.querySelectorAll('input[type=range]')) el.value = el.getAttribute('value');
  const autostart = document.getElementById('autostart');
  if (autostart) autostart.checked = autostart.hasAttribute('checked');
}

function renderEmpty() {
  const main = document.getElementById('main');
  main.dataset.shape = 'empty';
  // Without a sign-in no project can be created: then it is the first step.
  const trouble = authTrouble();
  // If the machine lacks something for Docker, that is a section of its own below the step; it does not hold it up.
  const setup = setupMissing().length ? '<div class="setup first"><div><h2>' + t('setupTitle') + '</h2>' + info(t('setupTitle'), t('setupInfo')) + '<div class="note">' + t('setupText') + '</div></div>' + setupRows(true) + '</div>' : '';
  if (trouble) { put(main, '<div class="stack empty">' + viewHead(esc(t('authFirstTitle')), t('authFirstText'), '', info(t('authFirstTitle'), t('authOutInfo'))) + authBody(true) + setup + '</div>'); return; }
  // No repo granted yet (the app is installed nowhere): then installing is the next step.
  if (repoList && !repoList.length && githubUrl(data.auth?.install)) {
    put(main, '<div class="stack empty">' + viewHead(t('firstTitle'), t('installFirstText'), '', info(t('firstTitle'), t('projectsInfo'))) + '<div class="row">' + githubButton(data.auth.install, t('installFirst')) + '</div><div class="note">' + esc(t('addHint')) + '</div>' + setup + '</div>');
    return;
  }
  put(main, '<div class="stack empty">' + viewHead(t('firstTitle'), t('firstText'), '', info(t('firstTitle'), t('projectsInfo'))) + '<div class="row">' +
    (repoList ?? []).filter((r) => r.free).slice(0, 8).map((r) => '<button class="btn" data-pick="' + esc(r.repo) + '">' + glyph('plus') + esc(r.repo) + '</button>').join('') + '</div>' + installNote() + '<div class="note">' + esc(t('addHint')) + '</div>' + setup + '</div>');
}

// --- Quit ---

// Quitting as a run: one station per project that tears down its runners, then cleanup and sign-off. The stations
// are not jobs and not links; lines and drawing are the network map's. There is no red here: if a
// step fails, that goes into the log, and the teardown continues.
function station(key, needs, state, name, time, detail, progress) {
  return '<div class="pill lined s-' + state + '" data-job="' + esc(key) + '" data-needs="' + esc(JSON.stringify(needs)) + '">' + icon(state) + '<span class="n">' + esc(name) + '</span>' + time +
    '<span class="line">' + detail + '</span>' + (progress == null ? '' : '<i class="pg" style="--p:' + progress + '%"></i>') + '</div>';
}
const tookTime = (from, to) => '<span class="tm">' + clock((new Date(to) - new Date(from)) / 1000) + '</span>';
// A stage after the teardown: waiting with the estimate, running with the time since start, done with its duration.
function stageTime(stage) {
  if (stage.state === 'done') return tookTime(stage.startedAt, stage.endedAt);
  if (stage.state === 'run') return '<span class="tm" data-since="' + esc(stage.startedAt) + '"></span>';
  return stage.estimate ? '<span class="tm dim">' + t('approx', clock(stage.estimate)) + '</span>' : '';
}

function renderShutdown(end) {
  const main = document.getElementById('main');
  if (main.dataset.shape !== 'shutdown') { main.dataset.shape = 'shutdown'; main.dataset.html = ''; main.innerHTML = ''; }
  const projects = end.projects.map((p) => {
    if (p.endedAt) return station(p.repo, [], 'done', shortRepo(p.repo), tookTime(end.startedAt, p.endedAt), esc(!p.total ? t('endNone') : p.total === 1 ? t('endRemovedOne') : t('endRemovedAll', p.total)));
    const [open, close] = TEXT[lang].endQuote;
    const detail = p.job ? '<span class="c-run abort"><span>' + t('endAborting') + '</span><span>' + open + '</span><span class="jn">' + esc(p.job) + '</span><span>' + close + '</span></span>' : esc(t('endRemoved', p.removed, p.total));
    return station(p.repo, [], 'run', shortRepo(p.repo), '<span class="tm" data-since="' + esc(end.startedAt) + '"></span>', detail, p.total ? Math.round(p.removed / p.total * 100) : 0);
  });
  const { cleanup, signoff } = end;
  const signoffWhat = signoff.state === 'run' ? t('endSignoffDone', signoff.done, signoff.total) : signoff.total === 1 ? t('endSignoffOne') : t('endSignoffWhat', signoff.total);
  // Without an estimate or once it is exceeded, the elapsed time counts; a frozen remaining time would look like a hung app.
  const big = end.finishAt ? '<span class="sub">' + t('endLeft') + '</span><b data-until="' + esc(end.finishAt) + '"></b>' : '<span class="sub">' + t(end.over ? 'endOver' : 'endSoFar') + '</span><b data-since="' + esc(end.startedAt) + '"></b>';
  const html = '<div class="stack"><div class="head"><div><h1>' + t('endTitle') + '</h1><p class="lede">' + t('endText') + '</p></div><div class="eta">' + big + '</div></div>' +
    '<div class="planwrap"><div class="plan"><svg aria-hidden="true"></svg><div class="col">' + projects.join('') + '</div>' +
    '<div class="col">' + station('cleanup', end.projects.map((p) => p.repo), cleanup.state, t('endCleanup'), stageTime(cleanup), esc(t('endCleanupWhat'))) + '</div>' +
    '<div class="col">' + station('signoff', ['cleanup'], signoff.state, t('endSignoff'), stageTime(signoff), esc(signoffWhat), signoff.state === 'run' && signoff.total ? Math.round(signoff.done / signoff.total * 100) : null) + '</div></div></div>' +
    '<p class="note measure">' + esc(end.last ? t('endHint', clock(end.last), end.wait) : t('endHintFirst', end.wait)) + '</p></div>';
  if (put(main, html)) watchPlans(main);
}

function render() {
  if (!data) return;
  document.documentElement.lang = lang;
  // On quit the window belongs to the teardown; an open confirmation is thereby settled.
  document.documentElement.classList.toggle('ending', Boolean(data.shutdown));
  if (data.shutdown) {
    if (document.getElementById('ask').open) document.getElementById('ask').close('');
    hideInfo();
    renderShutdown(data.shutdown);
    tick();
    return;
  }
  seatOf = new Map(data.repos.flatMap((entry) => entry.runners.map((r, index) => [r.name, index + 1])));
  renderRail();
  const entry = data.repos.find((r) => r.repo === view);
  if (view !== 'usage' && view !== 'settings' && !data.repos.length) renderEmpty();
  else if (view === 'usage') renderUsage();
  else if (view === 'settings') renderSettings();
  else if (entry) renderOverview([entry], true);
  else { view = 'all'; renderOverview(data.repos, false); }
  tick();
  placeInfo(); // the info surface follows its symbol if the new state moved it
}

// Running times keep counting in the page between polls.
function tick() {
  for (const el of document.querySelectorAll('[data-since]')) {
    const s = secondsSince(el.dataset.since);
    const est = Number(el.dataset.est);
    el.textContent = clock(s);
    el.classList.toggle('over', Boolean(est) && s > est * 1.15 && s - est > 10);
  }
  for (const el of document.querySelectorAll('[data-usual]')) { const est = Number(el.dataset.est); const s = secondsSince(el.dataset.usual); el.textContent = s > est * 1.15 && s - est > 10 ? t('late', clock(est)) : t('usual', clock(est)); }
  for (const el of document.querySelectorAll('[data-progress]')) { const est = Number(el.dataset.est); el.parentElement.style.setProperty('--p', (est ? Math.min(100, secondsSince(el.dataset.progress) / est * 100) : 0) + '%'); }
  for (const el of document.querySelectorAll('[data-finish]')) el.textContent = el.dataset.short ? leftText(el.dataset.finish).replace(/^noch |\s*left$/g, '') : leftText(el.dataset.finish);
  for (const el of document.querySelectorAll('[data-ago]')) el.textContent = ago(el.dataset.ago);
  for (const el of document.querySelectorAll('[data-running]')) el.textContent = t('since', clock(secondsSince(el.dataset.running)));
  // The remaining time on quit; once it is over, the next poll delivers the elapsed time (see shutdown.js).
  for (const el of document.querySelectorAll('[data-until]')) el.textContent = clock(Math.max(1, (new Date(el.dataset.until) - Date.now()) / 1000));
}

// Until the first answer, the wordmark and a sentence show instead of an empty surface; if the answer fails to come, the
// sentence says so.
function renderStart(failed) {
  const main = document.getElementById('main');
  main.dataset.shape = 'start';
  put(document.getElementById('rail'), '<div class="brand">RunClub</div>');
  put(main, '<div class="stack">' + viewHead(t('all'), t(failed ? 'noAnswer' : 'starting'), failed ? 'c-fail' : '') + '</div>');
}

async function refresh() {
  const before = data?.ui;
  const signedIn = data?.auth?.state;
  // On quit a service that no longer answers is the expected end: the window closes shortly.
  try { data = await (await fetch('/api/status')).json(); } catch { if (data?.shutdown) return; if (data) toast(t('noAnswer')); else renderStart(true); return; }
  if (before && data.ui && data.ui !== before) { location.reload(); return; }
  // Freshly signed in: the account's repos could not be read so far.
  if (signedIn && signedIn !== 'in' && data.auth?.state === 'in') loadRepos();
  render();
  if (view === 'settings' && data.logStamp !== logStamp) loadLog();
}
async function loadLog() { try { const response = await fetch('/api/log'); if (!response.ok) return; const answer = await response.json(); logData = answer.entries; logStamp = answer.stamp; if (view === 'settings') render(); } catch { /* the log comes with the next poll */ } }
// Puts a text on the clipboard and reports whether it worked. `text` may also have to be fetched first
// (a function); if that fails, it counts as a failed copy. `done(text)` builds the message.
async function copyText(text, done, failed) {
  try {
    const found = typeof text === 'function' ? await text() : text;
    await navigator.clipboard.writeText(found);
    toast(done(found));
  } catch { toast(failed); }
}
async function fetchLogFile() {
  const response = await fetch('/api/log/file');
  if (!response.ok) throw new Error('keine Datei');
  return response.text();
}
const copyLog = () => copyText(fetchLogFile, (text) => t('logCopied', text.split('\n').filter(Boolean).length), t('logCopyFailed'));
// Back from the browser (say after installing the app on GitHub): fetch the repos again.
window.addEventListener('focus', () => { if (data?.auth?.state === 'in') loadRepos(); });
async function loadRepos() { try { const response = await fetch('/api/repos'); if (response.ok) { repoList = await response.json(); render(); } } catch { /* suggestions are extras */ } }
async function loadDay() { try { dayData = await (await fetch('/api/metrics/day')).json(); if (view === 'usage') render(); } catch { /* history is an extra */ } }
async function addPool(repo) { if (await call('pool/add', { repo, parallel: 1 })) { toast(t('added')); loadRepos(); return true; } return false; }

document.addEventListener('click', async (event) => {
  const nav = event.target.closest('[data-view]');
  if (nav) { view = nav.dataset.view; store.set('view', view); document.getElementById('main').scrollTop = 0; hereStop = ''; if (view === 'usage') loadDay(); if (view === 'settings') { loadRepos(); loadLog(); const trouble = limitTrouble(); if (trouble && !trouble.repos.includes(openRepo)) openRepo = trouble.repos[0]; }
    render();
    // A reference can name a stop of the target view.
    if (nav.dataset.goto) { hereStop = nav.dataset.goto; render(); document.getElementById('stop-' + hereStop)?.scrollIntoView({ block: 'start' }); }
    return; }
  const set = event.target.closest('[data-set]');
  if (set) { if (set.dataset.set === 'mode') mode = set.dataset.value; else lang = set.dataset.value; store.set(set.dataset.set, set.dataset.value); document.getElementById('main').dataset.shape = ''; render(); return; }
  const pick = event.target.closest('[data-pick]');
  if (pick) { pick.disabled = true; if (!await addPool(pick.dataset.pick)) pick.disabled = false; return; }
  const opener = event.target.closest('[data-open-repo]');
  if (opener) { openRepo = openRepo === opener.dataset.openRepo ? '' : opener.dataset.openRepo; store.set('open', openRepo); render(); return; }
  const dot = event.target.closest('[data-stop]');
  if (dot) { document.getElementById('stop-' + dot.dataset.stop)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if (event.target.closest('[data-log]')) { logOpen = !logOpen; render(); return; }
  const logPick = event.target.closest('[data-log-repo]');
  if (logPick) { logRepo = logPick.dataset.logRepo; render(); return; }
  if (event.target.closest('[data-log-copy]')) { copyLog(); return; }
  const copy = event.target.closest('[data-copy]');
  if (copy) { const what = copy.dataset.copied ?? 'code'; copyText(copy.dataset.copy, () => t(what + 'Copied'), t(what + 'CopyFailed')); return; }
  const el = event.target.closest('button[data-do]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const { do: action, confirm: question, ...body } = el.dataset;
  // The heading is the action itself, as a question; the confirm button repeats it.
  const label = el.getAttribute('aria-label') || el.textContent.trim();
  if (question && !await ask({ title: label + '?', text: question, ok: label, danger: el.classList.contains('danger') })) return;
  for (const key of ['paused', 'cache', 'on', 'inherit', 'failedOnly']) if (key in body) body[key] = body[key] === '1';
  if ('parallel' in body) body.parallel = Number(body.parallel);
  el.setAttribute('aria-disabled', 'true');
  document.getElementById('tip').style.display = 'none';
  // The button stays disabled on quit and after a re-run; otherwise it is back after the answer,
  // even if nothing changes.
  const done = await call(action, body);
  // The service quits shortly after its answer (see actions.js); then the page shows the teardown.
  if (done && (action === 'shutdown' || action === 'app/update')) { setTimeout(refresh, 300); return; }
  if (done && action.endsWith('/rerun')) { restarted.set(body.repo + '/' + body.id, Date.now()); toast(t('rerunDone')); render(); return; } // on GitHub the run only reappears after a moment
  el.removeAttribute('aria-disabled');
});
document.addEventListener('submit', async (event) => { if (event.target.id !== 'add') return; event.preventDefault(); const input = document.getElementById('addRepo'); if (await addPool(input.value.trim())) { input.value = ''; render(); } });
document.addEventListener('change', async (event) => {
  if (event.target.id === 'autostart') { call('app/autostart', { on: event.target.checked }); return; }
  if (!event.target.dataset?.limit || !draft) return;
  // The slider is released: save, and drop the draft only once the new state is there.
  const sent = draft;
  if (await call('limits/set', { ...sent.values, ...(sent.repo ? { repo: sent.repo } : {}) })) await refresh();
  if (draft === sent) draft = null;
  render();
});
// While a slider is being moved, the bar above it follows along.
document.addEventListener('input', (event) => {
  const key = event.target.dataset?.limit;
  if (!key) return;
  const repo = event.target.dataset.repo ?? '';
  draft = { repo, values: { ...(draft && draft.repo === repo ? draft.values : {}), [key]: Number(event.target.value) } };
  render();
});
// The stop the settings are currently at stands out.
document.getElementById('main').addEventListener('scroll', (event) => {
  if (view !== 'settings' && view !== 'usage') return;
  const main = event.currentTarget;
  const stops = [...main.querySelectorAll('.stop')];
  const top = main.getBoundingClientRect().top;
  let current = stops[0];
  for (const el of stops) if (el.getBoundingClientRect().top - top < 160) current = el;
  if (main.scrollTop + main.clientHeight >= main.scrollHeight - 4) current = stops.at(-1);
  const key = current?.id.slice(5);
  if (key && key !== here()) { hereStop = key; render(); }
}, { passive: true });

// The app's tooltip: at the mouse pointer or, with keyboard use, above the element.
function showTip(text, x, y) {
  const tip = document.getElementById('tip');
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, x)) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('focusin', (event) => {
  const el = event.target.closest ? event.target.closest('[data-tip]') : null;
  if (!el || !el.matches(':focus-visible')) return;
  const box = el.getBoundingClientRect();
  showTip(el.dataset.tip, box.left, box.top - 32);
});
document.addEventListener('focusout', () => { document.getElementById('tip').style.display = 'none'; });

// The info surface: shows the explanation of an info element (see info), anchored to the symbol. It sits below it and
// only if there is no room there, above; sideways it stays within the window. Hover, keyboard focus and click open
// it; leaving, focus change and Escape close it. The content is a copy of the hidden explanation in the button (`.ib`).
let infoAt = null; // the info element whose explanation is currently shown
let infoHeld = false; // pinned by a click: stays when the pointer leaves
function placeInfo() {
  const box = document.getElementById('info');
  if (!infoAt) return;
  // If a new state replaced the element, the surface belongs to nothing any more.
  if (!infoAt.isConnected) { hideInfo(); return; }
  const at = infoAt.getBoundingClientRect();
  const below = at.bottom + 8;
  box.style.left = Math.max(8, Math.min(window.innerWidth - box.offsetWidth - 8, at.left - 14)) + 'px';
  box.style.top = (below + box.offsetHeight <= window.innerHeight - 8 ? below : Math.max(8, at.top - 8 - box.offsetHeight)) + 'px';
}
function showInfo(el) {
  const box = document.getElementById('info');
  if (infoAt !== el) infoHeld = false;
  infoAt = el;
  box.innerHTML = el.querySelector('.ib')?.innerHTML ?? '';
  box.style.display = 'block';
  placeInfo();
}
function hideInfo() {
  infoAt = null;
  infoHeld = false;
  document.getElementById('info').style.display = 'none';
}
const infoOf = (target) => (target?.closest ? target.closest('.info') : null);
// Pointer on the symbol or on the surface itself: the surface can be reached for reading and selecting.
const inInfo = (target) => Boolean(target?.closest && (target.closest('#info') || (infoAt && target.closest('.info') === infoAt)));
// There is a gap between symbol and surface: leaving therefore closes only after a moment, and whoever reaches symbol
// or surface again by then keeps it.
let infoLeave = 0;
document.addEventListener('mouseover', (event) => { if (inInfo(event.target)) clearTimeout(infoLeave); const el = infoOf(event.target); if (el && el !== infoAt) showInfo(el); });
document.addEventListener('mouseout', (event) => {
  if (!infoAt || !inInfo(event.target) || inInfo(event.relatedTarget) || infoHeld || infoAt.matches(':focus-visible')) return;
  clearTimeout(infoLeave);
  infoLeave = setTimeout(() => { if (infoAt && !infoHeld && !infoAt.matches(':hover, :focus-visible') && !document.getElementById('info').matches(':hover')) hideInfo(); }, 180);
});
document.addEventListener('focusin', (event) => { const el = infoOf(event.target); if (el && el.matches(':focus-visible')) showInfo(el); else if (infoAt && !el && !infoHeld && !infoAt.matches(':hover')) hideInfo(); });
document.addEventListener('focusout', (event) => { if (infoAt && infoOf(event.target) === infoAt && !infoHeld && !infoAt.matches(':hover')) hideInfo(); });
// One click pins the surface, a second closes it; so does a click beside it.
document.addEventListener('click', (event) => {
  const el = infoOf(event.target);
  if (el) { if (infoAt === el && infoHeld) hideInfo(); else { showInfo(el); infoHeld = true; } return; }
  if (infoHeld && !event.target.closest?.('#info')) hideInfo();
});
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && infoAt) hideInfo(); });
document.getElementById('main').addEventListener('scroll', placeInfo, { passive: true });
window.addEventListener('resize', placeInfo);
document.addEventListener('mouseleave', () => { document.getElementById('tip').style.display = 'none'; });

// History under the mouse pointer: time and value, plus a line at that spot.
document.addEventListener('mousemove', (event) => {
  const tip = document.getElementById('tip');
  const hinted = event.target.closest ? event.target.closest('[data-tip]') : null;
  if (hinted) { showTip(hinted.dataset.tip, event.clientX + 12, event.clientY - 34); return; }
  const svg = event.target.closest ? event.target.closest('svg.chart') : null;
  const source = svg && charts[svg.dataset.chart];
  if (!source || !source.at.length) { tip.style.display = 'none'; return; }
  const box = svg.getBoundingClientRect();
  const time = Date.now() - source.span * (1 - (event.clientX - box.left) / box.width);
  let index = 0;
  source.at.forEach((at, i) => { if (Math.abs(at - time) < Math.abs(source.at[index] - time)) index = i; });
  const x = (1 - (Date.now() - source.at[index]) / source.span) * 300;
  let line = svg.querySelector('.cross');
  if (!line) { line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); line.setAttribute('class', 'cross'); line.setAttribute('y1', 0); line.setAttribute('y2', 74); svg.appendChild(line); }
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  tip.textContent = (source.span > 3600000 ? hourMinute(source.at[index]) : new Date(source.at[index]).toLocaleTimeString(locale())) + ' · ' + source.format(source.values[index]);
  tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, event.clientX + 12) + 'px';
  tip.style.top = (event.clientY - 34) + 'px';
});
window.addEventListener('resize', () => document.querySelectorAll('.plan').forEach(drawLinks));
document.fonts?.ready.then(() => document.querySelectorAll('.plan').forEach(drawLinks));

renderStart(false); loadRepos(); if (view === 'usage') loadDay();
// Poll more often on quit: the teardown only takes seconds.
(function poll() { refresh().finally(() => setTimeout(poll, data?.shutdown ? 1000 : 3000)); })();
setInterval(tick, 1000); setInterval(() => { if (view === 'usage') loadDay(); }, 60000);
</script></body></html>
