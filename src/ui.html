// Die erste Haltestelle einer Ansicht. In den Einstellungen ist das „GitHub“; ein Backend, das die Anmeldung noch nicht
// meldet (die Seite ist neuer als das laufende Programm), hat sie nicht.
const firstStop = () => (view === 'usage' ? 'day' : data?.auth ? 'auth' : 'projects');
let hereStop = ''; // die Haltestelle, an der die Seite gerade steht; leer heißt: an der ersten
const here = () => hereStop || firstStop();
// Ein Abschnitt an der Strecke: Ring, Überschrift, rechts eine Randnotiz, darunter der Inhalt.
const routeStop = (key, title, side, body) => '<section class="stop' + (here() === key ? ' here' : '') + '" id="stop-' + key + '"><button class="stopdot" data-stop="' + key + '" aria-label="' + esc(title) + '"></button>' +
  '<div class="stophead"><h2 class="grow">' + esc(title) + '</h2>' + (side ? '<span class="note">' + side + '</span>' : '') + '</div>' + body + '</section>';
let draft = null; // Limits, solange ein Regler bewegt wird: { repo ('' = für alle), values: { runnerMemory, … } }

function renderSettings() {
  const main = document.getElementById('main');
  main.dataset.shape = 'settings';
  // Namen mit Großbuchstaben werden zu `data-runner-memory`, damit sie als `dataset.runnerMemory` zurückkommen.
  const attrs = (values) => Object.entries(values).map(([k, v]) => ' data-' + k.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase()) + '="' + esc(v) + '"').join('');
  // Symbol mit Wort. `only` zeigt nur das Symbol; die Aktion steht dann als Tooltip und für Vorleseprogramme daran.
  // `why` sperrt die Schaltfläche und nennt den Grund im Tooltip.
  const button = (name, text, values, { cls = '', only = false, why = '' } = {}) => '<button class="btn' + (only ? ' only' : '') + (cls ? ' ' + cls : '') + '"' + (only ? ' aria-label="' + esc(text) + '"' : '') + (only || why ? ' data-tip="' + esc(why || text) + '"' : '') + (why ? ' aria-disabled="true"' : '') + attrs(values) + '>' + glyph(name) + (only ? '' : esc(text)) + '</button>';
  const seg = (name, options, current) => '<span class="seg">' + options.map(([value, text]) => '<button data-set="' + name + '" data-value="' + value + '" aria-pressed="' + (current === value) + '">' + text + '</button>').join('') + '</span>';
  const stop = routeStop;

  const withPool = data.repos.filter((entry) => entry.pool);

  // --- Limits: für alle Projekte oder je Projekt eigene ---
  const m = data.machine;
  const lv = m.limitsView ?? {
    values: { runnerMemory: limitBytes(m.limits.runnerMemory) / GIB, dockerMemory: limitBytes(m.limits.dockerMemory) / GIB, runnerCpus: m.limits.runnerCpus, dockerCpus: m.limits.dockerCpus },
    bounds: { memory: { min: 1, max: 8, step: 0.5 }, cpus: { min: 1, max: m.dockerCpus || 1, step: 1 } }, suggestion: null,
  };
  const gbShort = (value) => num(value, value % 1 ? 1 : 0);
  // Ein Regler, der gerade bewegt wird, geht dem gespeicherten Stand vor.
  const moved = (repo) => (draft && draft.repo === repo ? draft.values : {});
  const shared = { ...lv.values, ...moved('') };
  const limitsFor = (entry) => ({ ...(entry.pool.limits?.own ? entry.pool.limits.values : shared), ...moved(entry.repo) });
  const slider = (key, label, range, unit, values, hints, repo) => {
    const share = (value) => (range.max > range.min ? Math.min(1, Math.max(0, (value - range.min) / (range.max - range.min))) : 0);
    const hint = hints?.[key];
    return '<label class="sl"><span>' + label + '</span><span class="tr" style="--s:' + (hint == null ? 0 : share(hint).toFixed(3)) + '"><input type="range" data-limit="' + key + '" data-repo="' + esc(repo) + '" min="' + range.min + '" max="' + range.max + '" step="' + range.step + '" value="' + values[key] + '" style="--v:' + (share(values[key]) * 100).toFixed(1) + '%">' +
      '<u' + (hint == null ? ' hidden' : '') + '></u></span><b>' + unit(values[key]) + '</b></label>';
  };
  // Runner und Docker eines Jobs haben eine gemeinsame Obergrenze. Der Hinweis steht immer da; wer beim Ziehen
  // darüber kommt, liest stattdessen, was beim Loslassen geschieht.
  const cap = lv.bounds.memory.total;
  const capNote = (values) => (cap === undefined ? '' : '<div class="note' + (values.runnerMemory + values.dockerMemory > cap ? ' strong' : '') + '">' +
    (values.runnerMemory + values.dockerMemory > cap ? t('capOver', gbShort(values.runnerMemory + values.dockerMemory), gbShort(cap)) : t('capNote', gbShort(cap))) + '</div>');
  const sliders = (values, hints, repo) => '<div class="sliders">' + slider('runnerMemory', t('memRunner'), lv.bounds.memory, (v) => gbShort(v) + ' GB', values, hints, repo) + slider('dockerMemory', t('memDocker'), lv.bounds.memory, (v) => gbShort(v) + ' GB', values, hints, repo) +
    slider('runnerCpus', t('cpuRunner'), lv.bounds.cpus, (v) => v, values, hints, repo) + slider('dockerCpus', t('cpuDocker'), lv.bounds.cpus, (v) => v, values, hints, repo) + '</div>' + capNote(values);
  // Der Vorschlag aus den Messwerten, mit Knopf, solange die gespeicherten Limits davon abweichen.
  const suggested = (hints, saved, repo) => {
    if (!hints) return '<div class="note">' + t('suggestNone') + '</div>';
    const same = LIMIT_KEYS.every((key) => hints[key] === saved[key]);
    return '<div class="row"><span class="rt note"><span class="ink">' + (same ? t('suggestSame') : t('suggestText', gbShort(hints.runnerMemory), gbShort(hints.dockerMemory), hints.runnerCpus)) + '</span><br>' + t('suggestWhy') + '</span>' +
      (same ? '' : button('gauge', t('suggestApply'), { do: 'limits/set', ...(repo ? { repo } : {}), ...Object.fromEntries(LIMIT_KEYS.map((key) => [key, hints[key]])) })) + '</div>';
  };

  // --- Projekte: je Projekt eine Zeile, eine davon aufgeklappt ---
  const projects = withPool.map((entry) => {
    const p = entry.pool;
    const repo = entry.repo;
    const open = openRepo === repo;
    const size = (key) => (p.sizes ? mb(p.sizes[key]) : '…');
    const crow = (title, detail, amount, action) => '<div class="crow"><span>' + title + (detail ? '<small>' + detail + '</small>' : '') + '</span><span>' + amount + '</span>' + action + '</div>';
    const clear = (what, text) => button('clear', text, { do: 'pool/clear', repo, what, confirm: t('confirmClear', repo) }, { only: true });
    const r = p.routing;
    const snippet = '<code>${{ fromJSON(vars.CI_RUNNER || \'"ubuntu-latest"\') }}</code>';
    const route = !r ? '' : '<div class="row"><span class="rt' + (!r.here && r.uses !== 'fixed' ? ' c-fail' : '') + '">' +
      (r.error ? esc(r.error) : r.uses === 'fixed' ? t('routeFixed') : r.uses === 'none' ? t('routeNone') + ' ' + snippet : r.here ? t('routeOn') : t('routeOff')) + '</span>' +
      (r.uses === 'fixed' ? '' : r.here ? button('route', t('routeBack'), { do: 'pool/routing', repo, on: '', confirm: t('confirmBack', repo) }) : button('route', t('routeTo'), { do: 'pool/routing', repo, on: '1' })) + '</div>';
    const caches = (p.cache ? crow(t('packages'), '', size('packages'), clear('packages', t('clearOf', t('packages')))) + crow(t('layers'), '', size('build'), clear('build', t('clearOf', t('layers'))))
      : '<div class="crow"><span class="dim">' + t('cacheIsOff') + '</span><span></span><span></span></div>') +
      crow(t('images', p.images.length), p.images.map(esc).join(' · '), size('images'), clear('images', t('forgetImages')));
    // Limits: wie alle Projekte oder eigene Werte, damit ein hungriges Projekt nicht hohe Limits für alle erzwingt.
    const own = Boolean(p.limits?.own);
    // Wie gut die Limits zum Projekt passen: knapp und ausgeschöpft sind Störungen, großzügig nur ein Hinweis.
    const fit = p.limits?.fit ?? { state: 'ok' };
    const pressing = fit.state === 'full' || fit.state === 'tight';
    const fitTag = { full: t('tagFull'), tight: t('tagTight'), generous: t('tagGenerous') }[fit.state];
    const fitNote = fit.state === 'ok' ? '' : '<div class="note' + (pressing ? ' c-fail' : '') + '">' + t({ full: 'fitFull', tight: 'fitTight', generous: 'fitGenerous', measuring: 'fitMeasuring' }[fit.state], fit.runs, lv.needRuns ?? 5, Math.round(lv.tightAt * 100)) + '</div>';
    const mine = limitsFor(entry);
    const choice = (text, pressed, values) => '<button data-do="limits/set" data-repo="' + esc(repo) + '"' + attrs(values) + ' aria-pressed="' + pressed + '">' + text + '</button>';
    const limits = !p.limits ? '' : '<div class="plim"><div class="row"><b class="grow">' + t('limitsTitle') + '</b><span class="seg">' + choice(t('limitsShared'), !own, { inherit: '1' }) + choice(t('limitsOwn'), own, Object.fromEntries(LIMIT_KEYS.map((key) => [key, mine[key]]))) + '</span></div>' +
      (own ? sliders(mine, p.limits.suggestion, repo) + suggested(p.limits.suggestion, p.limits.values, repo) : '<div class="note">' + t('limitsSharedNote', gbShort(mine.runnerMemory), gbShort(mine.dockerMemory), mine.runnerCpus, mine.dockerCpus) + '</div>') + '<div class="vary">' + fitNote + '</div></div>';
    const foot = '<div class="row">' + button(p.paused ? 'resume' : 'pause', p.paused ? t('resume') : t('pause'), { do: 'pool/set', repo, paused: p.paused ? '' : '1' }) +
      button('cache', p.cache ? t('cacheOff') : t('cacheOn'), { do: 'pool/set', repo, cache: p.cache ? '' : '1' }) +
      // Was löscht, steht abgesetzt am rechten Ende.
      '<span class="row push">' + button('clear', t('clearAll'), { do: 'pool/clear', repo, what: 'all', confirm: t('confirmClear', repo) }) + button('remove', t('remove'), { do: 'pool/remove', repo, confirm: t('confirmRemove', repo) }, { cls: 'danger' }) + '</span></div>';
    return '<div class="proj" data-open="' + open + '"><div class="phead"><button class="popen" data-open-repo="' + esc(repo) + '" aria-expanded="' + open + '" data-tip="' + esc(repo) + '">' + glyph('open') + '<b>' + esc(shortRepo(repo)) + '</b>' +
      (p.paused ? '<span class="tag">' + t('paused') + '</span>' : '') + (p.limits?.own ? '<span class="tag">' + t('ownTag') + '</span>' : '') + (fitTag ? '<span class="tag' + (pressing ? ' c-fail' : '') + '">' + fitTag + '</span>' : '') + (p.busy ? '<span class="tag">' + t('rebuilding') + '</span>' : '') +
      '<span class="sz">' + t('cachesSum', p.sizes ? mb(p.sizes.packages + p.sizes.images + p.sizes.build) : '…') + '</span></button>' +
      '<span class="note">' + t('slots') + '</span><span class="stepper">' + button('minus', t('fewer'), { do: 'pool/set', repo, parallel: p.parallel - 1 }, { only: true, why: p.parallel <= 1 ? t('minSlots') : '' }) + '<b>' + p.parallel + '</b>' +
      button('plus', t('more'), { do: 'pool/set', repo, parallel: p.parallel + 1 }, { only: true, why: p.parallel >= 4 ? t('maxSlots') : '' }) + '</span></div>' +
      '<div class="pbody"><div' + (open ? '' : ' inert') + '><div class="pin">' + route + limits + '<div>' + caches + '</div>' + foot + '</div></div></div></div>';
  }).join('');
  // Vorschläge nur, wo ein Pool möglich ist (siehe `free` in listRepos).
  const free = (repoList ?? []).filter((r) => r.free);
  const add = '<div class="addrow"><span>' + t('add') + '</span><form id="add"><input type="text" id="addRepo" class="grow" list="repoList" placeholder="' + t('addPlaceholder') + '" aria-label="' + t('add') + '" autocomplete="off" spellcheck="false">' +
    '<datalist id="repoList">' + free.map((r) => '<option value="' + esc(r.repo) + '">').join('') + '</datalist><button class="btn" type="submit">' + glyph('plus') + t('addButton') + '</button></form>' +
    (free.length ? '<span class="quick"><span class="note">' + t('addQuick') + '</span>' : '') + free.slice(0, 3).map((r) => '<button class="btn" data-pick="' + esc(r.repo) + '" data-tip="' + esc(t('addQuickTip', r.repo)) + '">' + esc(shortRepo(r.repo)) + '</button>').join('') + (free.length ? '</span>' : '') + '</div><div class="note">' + esc(t('addHint')) + '</div>';

  // --- Limits je Job: was alle Plätze zusammen dürfen, gemessen an der Docker-VM ---
  // Mit eingeschaltetem Cache läuft je Projekt ein Build-Dienst mit dem Docker-Limit, auch während der Pool pausiert.
  const serviceBytes = (entry) => (entry.pool.cache ? limitsFor(entry).dockerMemory * GIB : 0);
  const places = (entry) => (entry.pool.paused ? 0 : entry.pool.parallel);
  const active = withPool.filter((entry) => places(entry) || serviceBytes(entry));
  const slots = active.reduce((sum, entry) => sum + places(entry), 0);
  const services = active.reduce((sum, entry) => sum + serviceBytes(entry), 0);
  const jobBytes = (entry) => { const values = limitsFor(entry); return (values.runnerMemory + values.dockerMemory) * GIB; };
  const allowed = (entry) => places(entry) * jobBytes(entry) + serviceBytes(entry);
  const total = active.reduce((sum, entry) => sum + allowed(entry), 0);
  const vm = m.dockerMemory;
  const over = vm > 0 && total > vm;
  const tooBig = vm > 0 && active.some((entry) => places(entry) && jobBytes(entry) + serviceBytes(entry) > vm); // schon ein Job allein darf mit seinem Build-Dienst mehr, als die VM hat
  const capAt = vm / (Math.max(total, vm) || 1) * 100;
  const gbClean = (bytes) => { const value = Math.round(bytes / GIB * 10) / 10; return num(value, value % 1 ? 1 : 0) + ' GB'; };
  // Gefüllt ist, was mit vollem Limit in die VM passt. Die Build-Dienste laufen immer und kommen deshalb zuerst;
  // in den Rest passen die Plätze, die kleinsten voran.
  const fitting = active.map(() => 0); // je Projekt: so viele seiner Plätze passen
  const serviceFits = active.map(() => false);
  let used = 0;
  const fill = (parts, mark) => { for (const part of parts.filter((p) => p.bytes).sort((a, b) => a.bytes - b.bytes)) { if (used + part.bytes > vm) break; used += part.bytes; mark(part.index); } };
  fill(active.map((entry, index) => ({ index, bytes: serviceBytes(entry) })), (index) => { serviceFits[index] = true; });
  fill(active.flatMap((entry, index) => Array.from({ length: places(entry) }, () => ({ index, bytes: jobBytes(entry) }))), (index) => { fitting[index] += 1; });
  const fits = fitting.reduce((sum, count) => sum + count, 0);
  const cell = (bytes, cls) => '<i' + (cls ? ' class="' + cls + '"' : '') + ' style="flex:' + (bytes / GIB).toFixed(3) + '"></i>';
  const cells = (entry, index) => Array.from({ length: places(entry) }, (_, place) => cell(jobBytes(entry), place < fitting[index] ? '' : 'out')).join('') + (serviceBytes(entry) ? cell(serviceBytes(entry), serviceFits[index] ? 'svc' : 'svc out') : '');
  const caption = (entry) => [places(entry) ? places(entry) + ' × ' + gbClean(jobBytes(entry)) : '', serviceBytes(entry) ? t('budgetService', gbClean(serviceBytes(entry))) : ''].filter(Boolean).join(' + ');
  const segments = active.map((entry, index) => '<div class="bseg" style="flex:' + (allowed(entry) / GIB).toFixed(3) + '"><div>' + cells(entry, index) + '</div><span><b>' + esc(shortRepo(entry.repo)) + '</b>' + caption(entry) + '</span></div>').join('');
  const budget = !slots || !vm ? '' : '<div><div class="k">' + t(services ? 'budgetLabelService' : 'budgetLabel', slots) + '</div><div class="v' + (tooBig ? ' c-fail' : '') + '">' + gbClean(total) + ' <small>' + t('budgetOf', gbClean(vm)) + '</small></div>' +
    '<div class="budget">' + segments + (total < vm ? '<div style="flex:' + ((vm - total) / GIB).toFixed(3) + '"></div>' : '') + '<div class="bcap' + (capAt > 60 ? ' end' : '') + '" style="left:' + capAt.toFixed(2) + '%"><span>' + t('vmMark') + '</span></div></div>' +
    '<div class="note measure' + (tooBig ? ' c-fail' : '') + '" style="padding-top:12px">' + (!over ? t('budgetOk') : tooBig ? t('budgetOver1') : t(fits === 1 ? 'budgetOverOne' : 'budgetOver', fits, slots)) + '</div></div>';
  // Freie Runner tragen ihre Limits bis zum nächsten Job; wer nicht warten will, baut sie neu auf.
  const stale = withPool.reduce((sum, entry) => sum + (entry.pool.limits?.stale ?? 0), 0);
  const rebuild = !stale ? '' : '<div class="row"><span class="rt note">' + t(stale === 1 ? 'staleOne' : 'staleMany', stale) + '</span>' + button('rebuild', t('rebuild'), { do: 'pool/rebuild' }) + '</div>';
  // Der Vorschlag gilt für alle Projekte zusammen: ein Standard für die Mehrheit, eigene Limits für Ausreißer.
  const plan = lv.plan;
  const outliers = plan ? withPool.filter((entry) => plan.own[entry.repo]).map((entry) => esc(shortRepo(entry.repo))) : [];
  const planned = !plan ? '<div class="note">' + t('suggestNone') + '</div>' : '<div class="row"><span class="rt note">' +
    '<span class="ink">' + (plan.applied ? t('planApplied') : t('planText', gbShort(plan.shared.runnerMemory), gbShort(plan.shared.dockerMemory), plan.shared.runnerCpus) + (outliers.length ? ' ' + t('planOwn', outliers.join(', ')) : '')) + '</span><br>' + t('planWhy') + '</span>' +
    (plan.applied ? '' : button('gauge', t('suggestApply'), { do: 'limits/plan' })) + '</div>';
  const limitsAll = '<div class="vary">' + budget + '</div>' + sliders(shared, plan?.shared, '') + '<div class="vary">' + planned + '</div><div class="vary">' + rebuild + '</div>';

  // --- App und Protokoll ---
  const arow = (title, hint, control) => '<div class="arow"><div><b>' + title + '</b>' + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>' + control + '</div>';
  const app = (data.app ? arow(t('autostart'), '', '<input type="checkbox" class="sw" id="autostart" aria-label="' + t('autostart') + '"' + (data.app.autostart ? ' checked' : '') + '>') : '') +
    arow(t('view'), t('viewHint'), seg('mode', [['compact', t('compact')], ['detail', t('detail')]], mode)) + arow(t('language'), '', seg('lang', [['de', 'Deutsch'], ['en', 'English']], lang)) +
    '<div class="row" style="padding-top:12px">' + button('power', t('quit'), { do: 'shutdown', confirm: t('confirmQuit') }, { cls: 'danger push' }) + '</div>';
  // Filtern lässt sich nach jedem Projekt mit Pool und nach jedem, von dem noch Meldungen da sind (ein entfernter Pool).
  const logRepos = [...new Set([...withPool.map((entry) => entry.repo), ...logData.map((entry) => entry.repo).filter(Boolean)])];
  if (logRepo && logRepo !== LOG_GENERAL && !logRepos.includes(logRepo)) logRepo = '';
  // Zu einem Projekt gehören auch die allgemeinen Fehler: Dort steht oft die Ursache (Docker antwortet nicht).
  const logShown = logData.filter((entry) => !logRepo || (logRepo === LOG_GENERAL ? !entry.repo : entry.repo === logRepo || (!entry.repo && entry.kind === 'error'))).reverse();
  const logPick = (repo, text) => '<button data-log-repo="' + esc(repo) + '" aria-pressed="' + (logRepo === repo) + '">' + esc(text) + '</button>';
  const logRow = (entry) => { const state = LOG_STATE[entry.kind]; return '<li' + (state ? ' class="s-' + state + '"' : '') + '><time datetime="' + esc(entry.at) + '" data-tip="' + esc(new Date(entry.at).toLocaleString(locale())) + '">' + logTime(entry.at) + '</time>' +
    (logRepo ? '' : '<span class="lp"' + (entry.repo ? ' data-tip="' + esc(entry.repo) + '"' : '') + '>' + esc((entry.repo ?? '').split('/').pop()) + '</span>') + (state ? icon(state) : '<span></span>') +
    // Unter einem Projekt stehen auch allgemeine Fehler; ohne Projektspalte sagt das die Zeile selbst.
    '<span class="lm">' + (logRepo && logRepo !== LOG_GENERAL && !entry.repo ? '<span class="dim">' + t('logGeneral') + ' · </span>' : '') + esc(logText(entry)) + '</span></li>'; };
  // Gezeigt werden die letzten Meldungen; Kopieren und Speichern nehmen die ganze Datei.
  const log = '<div class="row">' + (logRepos.length > 1 ? '<span class="seg wide" role="group" aria-label="' + t('logFilter') + '">' + logPick('', t('logAll')) + logRepos.map((repo) => logPick(repo, shortRepo(repo))).join('') + logPick(LOG_GENERAL, t('logGeneral')) + '</span>' : '') +
    '<span class="row push"><button class="btn" data-log-copy data-tip="' + t('logCopyTip') + '">' + glyph('copy') + t('logCopy') + '</button><a class="btn" href="/api/log/file" download="runclub.log" data-tip="' + t('logSaveTip') + '">' + glyph('save') + t('logSave') + '</a></span></div>' +
    (logShown.length ? '<ul class="log' + (logRepo ? ' noproject' : '') + (logOpen ? ' open' : '') + '"' + (logOpen ? ' tabindex="0"' : '') + '>' + (logOpen ? logShown : logShown.slice(0, LOG_SHORT)).map(logRow).join('') + '</ul>' : logRepo ? '<div class="note">' + t('logNone') + '</div>' : '') +
    (logShown.length > LOG_SHORT ? '<div class="row"><button class="btn" data-log aria-expanded="' + logOpen + '">' + glyph('open') + t(logOpen ? 'showLess' : 'showAll') + '</button></div>' : '');

  // „GitHub“ steht vorn: Die Anmeldung ist die Voraussetzung für alles danach, und die Strecke liest sich so in der
  // Reihenfolge des Einrichtens. Ist alles in Ordnung, sind es zwei Zeilen.
  const html = '<div class="stack set"><div class="head"><div><h1>' + t('settings') + '</h1></div></div><div class="route">' +
    (data.auth ? stop('auth', 'GitHub', '', authBody()) : '') + stop('projects', t('projects'), withPool.length ? t('projectsSum', withPool.length, withPool.reduce((sum, entry) => sum + entry.pool.parallel, 0)) : '', projects + add) +
    stop('limits', t('limitsTitle'), t('limitsNew'), limitsAll) + stop('app', t('app'), '', app) + stop('log', t('log'), !logShown.length ? '' : logShown.length === 1 ? t('logSideOne') : !logOpen && logShown.length > LOG_SHORT ? t('logSideOf', LOG_SHORT, logShown.length) : t('logSide', logShown.length), log) + '</div></div>';
  // Nicht neu aufbauen, solange im Eingabefeld etwas steht, das noch nicht abgeschickt ist.
  if (document.activeElement?.id === 'addRepo' && document.activeElement.value && main.dataset.html) return;
  put(main, html);
  // Regler und Schalter merken sich, was der Nutzer zuletzt eingestellt hat; der gezeigte Stand kommt aus den Daten.
  for (const el of main.querySelectorAll('input[type=range]')) el.value = el.getAttribute('value');
  const autostart = document.getElementById('autostart');
  if (autostart) autostart.checked = autostart.hasAttribute('checked');
}

function renderEmpty() {
  const main = document.getElementById('main');
  main.dataset.shape = 'empty';
  // Ohne Anmeldung lässt sich kein Projekt anlegen: Dann ist sie der erste Schritt.
  if (authTrouble()) { put(main, '<div class="stack empty">' + viewHead(t('authLogin'), t('authFirstText')) + authBody(true) + '</div>'); return; }
  put(main, '<div class="stack empty">' + viewHead(t('firstTitle'), t('firstText')) + '<div class="row">' +
    (repoList ?? []).filter((r) => r.free).slice(0, 8).map((r) => '<button class="btn" data-pick="' + esc(r.repo) + '">' + glyph('plus') + esc(r.repo) + '</button>').join('') + '</div><div class="note">' + esc(t('addHint')) + '</div></div>');
}

function render() {
  if (!data) return;
  document.documentElement.lang = lang;
  seatOf = new Map(data.repos.flatMap((entry) => entry.runners.map((r, index) => [r.name, index + 1])));
  renderRail();
  const entry = data.repos.find((r) => r.repo === view);
  if (view !== 'usage' && view !== 'settings' && !data.repos.length) renderEmpty();
  else if (view === 'usage') renderUsage();
  else if (view === 'settings') renderSettings();
  else if (entry) renderOverview([entry], true);
  else { view = 'all'; renderOverview(data.repos, false); }
  tick();
}

// Laufende Zeiten zählen zwischen den Abfragen in der Seite weiter.
function tick() {
  for (const el of document.querySelectorAll('[data-since]')) {
    const s = secondsSince(el.dataset.since);
    const est = Number(el.dataset.est);
    el.textContent = clock(s);
    el.classList.toggle('over', Boolean(est) && s > est * 1.15 && s - est > 10);
  }
  for (const el of document.querySelectorAll('[data-usual]')) { const est = Number(el.dataset.est); const s = secondsSince(el.dataset.usual); el.textContent = s > est * 1.15 && s - est > 10 ? t('late', clock(est)) : t('usual', clock(est)); }
  for (const el of document.querySelectorAll('[data-progress]')) { const est = Number(el.dataset.est); el.parentElement.style.setProperty('--p', (est ? Math.min(100, secondsSince(el.dataset.progress) / est * 100) : 0) + '%'); }
  for (const el of document.querySelectorAll('[data-finish]')) el.textContent = el.dataset.short ? leftText(el.dataset.finish).replace(/^noch |\s*left$/g, '') : leftText(el.dataset.finish);
  for (const el of document.querySelectorAll('[data-ago]')) el.textContent = ago(el.dataset.ago);
  for (const el of document.querySelectorAll('[data-running]')) el.textContent = t('since', clock(secondsSince(el.dataset.running)));
}

// Bis zur ersten Antwort stehen Wortmarke und ein Satz da statt einer leeren Fläche; bleibt die Antwort aus, sagt
// der Satz das.
function renderStart(failed) {
  const main = document.getElementById('main');
  main.dataset.shape = 'start';
  put(document.getElementById('rail'), '<div class="brand">RunClub</div>');
  put(main, '<div class="stack">' + viewHead(t('all'), t(failed ? 'noAnswer' : 'starting'), failed ? 'c-fail' : '') + '</div>');
}

async function refresh() {
  const before = data?.ui;
  const signedIn = data?.auth?.state;
  try { data = await (await fetch('/api/status')).json(); } catch { if (data) toast(t('noAnswer')); else renderStart(true); return; }
  if (before && data.ui && data.ui !== before) { location.reload(); return; }
  // Frisch angemeldet: Die Repos des Kontos ließen sich bisher nicht lesen.
  if (signedIn && signedIn !== 'in' && data.auth?.state === 'in') loadRepos();
  render();
  if (view === 'settings' && data.logStamp !== logStamp) loadLog();
}
async function loadLog() { try { const response = await fetch('/api/log'); if (!response.ok) return; const answer = await response.json(); logData = answer.entries; logStamp = answer.stamp; if (view === 'settings') render(); } catch { /* das Protokoll kommt mit der nächsten Abfrage */ } }
async function copyLog() {
  try {
    const response = await fetch('/api/log/file');
    if (!response.ok) throw new Error('keine Datei');
    const text = await response.text();
    await navigator.clipboard.writeText(text);
    toast(t('logCopied', text.split('\n').filter(Boolean).length));
  } catch { toast(t('logCopyFailed')); }
}
async function loadRepos() { try { const response = await fetch('/api/repos'); if (response.ok) { repoList = await response.json(); render(); } } catch { /* Vorschläge sind Beiwerk */ } }
async function loadDay() { try { dayData = await (await fetch('/api/metrics/day')).json(); if (view === 'usage') render(); } catch { /* Verlauf ist Beiwerk */ } }
async function addPool(repo) { if (await call('pool/add', { repo, parallel: 1 })) { toast(t('added')); loadRepos(); return true; } return false; }

document.addEventListener('click', async (event) => {
  const nav = event.target.closest('[data-view]');
  if (nav) { view = nav.dataset.view; store.set('view', view); document.getElementById('main').scrollTop = 0; hereStop = ''; if (view === 'usage') loadDay(); if (view === 'settings') { loadRepos(); loadLog(); const trouble = limitTrouble(); if (trouble && !trouble.repos.includes(openRepo)) openRepo = trouble.repos[0]; }
    render();
    // Ein Verweis kann eine Haltestelle der Zielansicht nennen.
    if (nav.dataset.goto) { hereStop = nav.dataset.goto; render(); document.getElementById('stop-' + hereStop)?.scrollIntoView({ block: 'start' }); }
    return; }
  const set = event.target.closest('[data-set]');
  if (set) { if (set.dataset.set === 'mode') mode = set.dataset.value; else lang = set.dataset.value; store.set(set.dataset.set, set.dataset.value); document.getElementById('main').dataset.shape = ''; render(); return; }
  const pick = event.target.closest('[data-pick]');
  if (pick) { pick.disabled = true; if (!await addPool(pick.dataset.pick)) pick.disabled = false; return; }
  const opener = event.target.closest('[data-open-repo]');
  if (opener) { openRepo = openRepo === opener.dataset.openRepo ? '' : opener.dataset.openRepo; store.set('open', openRepo); render(); return; }
  const dot = event.target.closest('[data-stop]');
  if (dot) { document.getElementById('stop-' + dot.dataset.stop)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if (event.target.closest('[data-log]')) { logOpen = !logOpen; render(); return; }
  const logPick = event.target.closest('[data-log-repo]');
  if (logPick) { logRepo = logPick.dataset.logRepo; render(); return; }
  if (event.target.closest('[data-log-copy]')) { copyLog(); return; }
  const copy = event.target.closest('[data-copy]');
  if (copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); toast(t('authCopied')); } catch { toast(t('authCopyFailed')); } return; }
  const el = event.target.closest('button[data-do]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const { do: action, confirm: question, ...body } = el.dataset;
  // Die Überschrift ist die Aktion selbst, als Frage; die Schaltfläche zum Bestätigen wiederholt sie.
  const label = el.getAttribute('aria-label') || el.textContent.trim();
  if (question && !await ask({ title: label + '?', text: question, ok: label, danger: el.classList.contains('danger') })) return;
  for (const key of ['paused', 'cache', 'on', 'inherit', 'failedOnly']) if (key in body) body[key] = body[key] === '1';
  if ('parallel' in body) body.parallel = Number(body.parallel);
  el.setAttribute('aria-disabled', 'true');
  document.getElementById('tip').style.display = 'none';
  // Der Knopf bleibt beim Beenden und nach einem erneuten Start gesperrt; sonst ist er nach der Antwort wieder da,
  // auch wenn sich nichts ändert.
  const done = await call(action, body);
  if (done && action === 'shutdown') { toast(t('quitting')); return; }
  if (done && action.endsWith('/rerun')) { restarted.set(body.repo + '/' + body.id, Date.now()); toast(t('rerunDone')); render(); return; } // bei GitHub erscheint der Lauf erst nach einem Augenblick wieder
  el.removeAttribute('aria-disabled');
});
document.addEventListener('submit', async (event) => { if (event.target.id !== 'add') return; event.preventDefault(); const input = document.getElementById('addRepo'); if (await addPool(input.value.trim())) { input.value = ''; render(); } });
document.addEventListener('change', async (event) => {
  if (event.target.id === 'autostart') { call('app/autostart', { on: event.target.checked }); return; }
  if (!event.target.dataset?.limit || !draft) return;
  // Der Regler ist losgelassen: speichern und den Entwurf erst fallen lassen, wenn der neue Stand da ist.
  const sent = draft;
  if (await call('limits/set', { ...sent.values, ...(sent.repo ? { repo: sent.repo } : {}) })) await refresh();
  if (draft === sent) draft = null;
  render();
});
// Solange ein Regler bewegt wird, rechnet der Balken darüber mit.
document.addEventListener('input', (event) => {
  const key = event.target.dataset?.limit;
  if (!key) return;
  const repo = event.target.dataset.repo ?? '';
  draft = { repo, values: { ...(draft && draft.repo === repo ? draft.values : {}), [key]: Number(event.target.value) } };
  render();
});
// Die Haltestelle, an der die Einstellungen gerade stehen, tritt hervor.
document.getElementById('main').addEventListener('scroll', (event) => {
  if (view !== 'settings' && view !== 'usage') return;
  const main = event.currentTarget;
  const stops = [...main.querySelectorAll('.stop')];
  const top = main.getBoundingClientRect().top;
  let current = stops[0];
  for (const el of stops) if (el.getBoundingClientRect().top - top < 160) current = el;
  if (main.scrollTop + main.clientHeight >= main.scrollHeight - 4) current = stops.at(-1);
  const key = current?.id.slice(5);
  if (key && key !== here()) { hereStop = key; render(); }
}, { passive: true });

// Der Tooltip der App: am Mauszeiger oder, bei Tastaturbedienung, über dem Element.
function showTip(text, x, y) {
  const tip = document.getElementById('tip');
  tip.textContent = text;
  tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, x)) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('focusin', (event) => {
  const el = event.target.closest ? event.target.closest('[data-tip]') : null;
  if (!el || !el.matches(':focus-visible')) return;
  const box = el.getBoundingClientRect();
  showTip(el.dataset.tip, box.left, box.top - 32);
});
document.addEventListener('focusout', () => { document.getElementById('tip').style.display = 'none'; });
document.addEventListener('mouseleave', () => { document.getElementById('tip').style.display = 'none'; });

// Verlauf unter dem Mauszeiger: Zeitpunkt und Wert, dazu eine Linie an der Stelle.
document.addEventListener('mousemove', (event) => {
  const tip = document.getElementById('tip');
  const hinted = event.target.closest ? event.target.closest('[data-tip]') : null;
  if (hinted) { showTip(hinted.dataset.tip, event.clientX + 12, event.clientY - 34); return; }
  const svg = event.target.closest ? event.target.closest('svg.chart') : null;
  const source = svg && charts[svg.dataset.chart];
  if (!source || !source.at.length) { tip.style.display = 'none'; return; }
  const box = svg.getBoundingClientRect();
  const time = Date.now() - source.span * (1 - (event.clientX - box.left) / box.width);
  let index = 0;
  source.at.forEach((at, i) => { if (Math.abs(at - time) < Math.abs(source.at[index] - time)) index = i; });
  const x = (1 - (Date.now() - source.at[index]) / source.span) * 300;
  let line = svg.querySelector('.cross');
  if (!line) { line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); line.setAttribute('class', 'cross'); line.setAttribute('y1', 0); line.setAttribute('y2', 74); svg.appendChild(line); }
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  tip.textContent = (source.span > 3600000 ? hourMinute(source.at[index]) : new Date(source.at[index]).toLocaleTimeString(locale())) + ' · ' + source.format(source.values[index]);
  tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, event.clientX + 12) + 'px';
  tip.style.top = (event.clientY - 34) + 'px';
});
window.addEventListener('resize', () => document.querySelectorAll('.plan').forEach(drawLinks));
document.fonts?.ready.then(() => document.querySelectorAll('.plan').forEach(drawLinks));

renderStart(false); refresh(); loadRepos(); if (view === 'usage') loadDay();
setInterval(refresh, 3000); setInterval(tick, 1000); setInterval(() => { if (view === 'usage') loadDay(); }, 60000);
</script></body></html>
