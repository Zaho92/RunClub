<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunClub</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e3e6ea; --bar:#e9ecf0; --soft:#f1f3f6;
          --ok:#1f9d55; --busy:#c77700; --off:#8a9099; --bad:#c0392b; --fill:#3b6fd4; --accent:#2f5fc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171b; --card:#1e2126; --text:#e8eaed; --muted:#9aa1ab; --line:#2c3037; --bar:#2a2e35; --soft:#252930;
            --ok:#3ecf7c; --busy:#f0a43a; --off:#737a85; --bad:#ff6b5e; --fill:#6f9bf0; --accent:#8fb2f5; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; }
  header { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  .spacer { flex:1; }
  h2 { font-size:16px; margin:0; }
  .repo { margin-top:28px; }
  .repohead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .name { font-weight:600; }
  .tag { font-size:12px; border:1px solid var(--line); border-radius:5px; padding:1px 7px; color:var(--muted); white-space:nowrap; }
  .tag.warn { color:var(--busy); border-color:var(--busy); }
  .state { margin-left:auto; display:flex; align-items:center; gap:7px; font-weight:600; color:var(--off); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--off); flex:none; }
  .s-bereit .dot { background:var(--ok); } .s-bereit .state { color:var(--ok); }
  .s-arbeitet .dot { background:var(--busy); animation:pulse 1.2s infinite; } .s-arbeitet .state { color:var(--busy); }
  .s-unterwegs .dot { background:var(--busy); }
  .s-gestoert .dot { background:var(--bad); } .s-gestoert .state { color:var(--bad); }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .s-arbeitet .dot { animation:none; } .bar i { transition:none; } }
  .job { margin-top:8px; font-size:14px; }
  a { color:var(--accent); }
  .meters { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
  @media (max-width:560px) { .meters { grid-template-columns:1fr; } .state { margin-left:0; width:100%; } }
  .label { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .label b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar { height:8px; background:var(--bar); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--fill); border-radius:4px; transition:width .6s; }
  .small { margin-top:8px; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  .warn { color:var(--busy); } .bad { color:var(--bad); }
  button { font:inherit; font-size:13px; padding:5px 11px; border-radius:7px; border:1px solid var(--line); background:var(--soft); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.danger { color:var(--bad); }
  button.step { width:30px; padding:5px 0; }
  button:disabled { opacity:.5; cursor:default; }
  input { font:inherit; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--text); min-width:0; }
  details { margin-top:10px; }
  summary { cursor:pointer; font-size:13px; color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:13px; margin-top:8px; }
  td { padding:5px 8px 5px 0; border-top:1px solid var(--line); vertical-align:middle; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.act { text-align:right; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  pre { font:12px/1.5 Consolas, monospace; white-space:pre-wrap; overflow-wrap:anywhere; margin:8px 0 0; color:var(--muted); }
  code { font:13px Consolas, monospace; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:14px; max-width:90vw; display:none; }
  .add { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .add input { flex:1 1 220px; }
  .check { display:flex; align-items:center; gap:6px; align-self:center; cursor:pointer; }
  .picks { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .picks:empty { display:none; }
  .tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-top:12px; }
  @media (max-width:820px) { .tiles { grid-template-columns:1fr 1fr; } }
  .tile .value { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile .value span { font-size:13px; font-weight:400; color:var(--muted); }
  .tile .sub { font-size:12px; min-height:17px; }
  .spark { display:block; width:100%; height:44px; margin-top:6px; border-bottom:1px solid var(--line); cursor:crosshair; }
  .spark polyline { fill:none; stroke:var(--fill); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; }
  .spark polygon { fill:var(--fill); opacity:.12; }
  .spark line { stroke:var(--muted); stroke-width:1; vector-effect:non-scaling-stroke; }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:2px; }
  #tip { position:fixed; z-index:5; pointer-events:none; background:var(--text); color:var(--bg); padding:4px 9px; border-radius:6px; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; display:none; }
  .pipe .eta { margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pipe .bar { margin-top:10px; }
  .pipe .title { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:0 1 auto; }
  .jobs td { padding:6px 8px 6px 0; }
  .jobs td.mark { width:22px; text-align:center; font-weight:700; color:var(--off); }
  .jobs td.jbar { width:22%; min-width:70px; padding-right:0; }
  .jobs .j-ok .mark { color:var(--ok); } .jobs .j-bad .mark { color:var(--bad); }
  .jobs .j-run .mark { color:var(--busy); animation:pulse 1.2s infinite; }
  .jobs .j-wait, .jobs .j-skip { color:var(--muted); } .jobs .j-wait a, .jobs .j-skip a { color:var(--muted); }
  .jobs .j-ok .bar i { background:var(--ok); } .jobs .over .bar i { background:var(--busy); }
  @media (prefers-reduced-motion: reduce) { .jobs .j-run .mark { animation:none; } }
  @media (max-width:560px) { .jobs td.jbar { display:none; } }
</style></head><body><main>
<header>
  <div><h1>RunClub</h1><div class="sub" id="sub">lädt …</div></div>
  <span class="spacer"></span>
  <label class="sub check" id="autostart" hidden title="Startet RunClub beim Anmelden im Infobereich, ohne Fenster"><input type="checkbox" id="autostartBox"> Mit Windows starten</label>
  <button data-do="shutdown" class="danger" title="Beendet alle Runner und dieses Programm">Alles beenden</button>
</header>
<div id="machine"></div>
<div id="repos"></div>

<div class="repo">
  <div class="repohead"><h2>Linux-Runner für ein weiteres Repo</h2></div>
  <div class="card">
    <form class="add" id="add">
      <input id="addRepo" list="repoList" placeholder="Repo suchen oder besitzer/name" aria-label="Repo" autocomplete="off" spellcheck="false">
      <datalist id="repoList"></datalist>
      <button type="submit">Pool anlegen</button>
    </form>
    <div class="picks" id="picks"></div>
    <div class="small">Die Jobs des Repos brauchen <code>runs-on: [self-hosted, Linux]</code>. Je Job entsteht ein frischer Container mit eigenem Docker-Daemon.</div>
  </div>
</div>

<details id="logbox"><summary>Protokoll</summary><pre id="log"></pre></details>
</main>
<div id="toast" role="status"></div>
<div id="tip"></div>
<script>
const TOKEN = '__TOKEN__';
const gb = (b) => (b / 1073741824).toFixed(1).replace('.', ',') + ' GB';
const mb = (b) => b >= 1073741824 ? gb(b) : Math.round(b / 1048576) + ' MB';
const pct = (n) => n.toFixed(n < 10 ? 1 : 0).replace('.', ',') + ' %';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const since = (iso) => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return s < 60 ? s + ' s' : s < 3600 ? Math.floor(s / 60) + ' min ' + (s % 60) + ' s' : Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min'; };
const ago = (iso) => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return s < 90 ? 'gerade eben' : s < 3600 ? 'vor ' + Math.round(s / 60) + ' min' : s < 86400 ? 'vor ' + Math.round(s / 3600) + ' h' : 'vor ' + Math.round(s / 86400) + ' Tagen'; };
const clock = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const elapsed = (iso) => Math.max(0, (Date.now() - new Date(iso)) / 1000);
const left = (iso) => { const s = (new Date(iso) - Date.now()) / 1000; return s < 40 ? 'gleich fertig' : 'noch ≈ ' + (s < 90 ? '1 min' : Math.round(s / 60) + ' min'); };
const shortRunner = (name) => String(name ?? '').replace(/^.*-linux-/, 'Runner ');
const stepText = (step) => step ? 'Schritt ' + step.number + '/' + step.total + ': ' + step.name : '';
const cores = (n) => n.toFixed(1).replace('.', ',');
const limitBytes = (text) => { const m = String(text).match(/^([\d.]+)\s*([gm])/i); return m ? Number(m[1]) * (m[2].toLowerCase() === 'g' ? 1073741824 : 1048576) : 0; };
const SPAN = 30 * 60000; // Verlauf: die letzte halbe Stunde
const FORMAT = { hostCpu: (v) => cores(v) + ' Kerne', vmCpu: (v) => cores(v) + ' Kerne', hostMemory: (v) => gb(v), vmMemory: (v) => gb(v) };
let SERIES = { at: [] };

// Verlauf einer Messgröße als Linie; die Höhe reicht von 0 bis `max` (alle Kerne, aller Speicher).
function spark(key, max) {
  const values = SERIES[key] || [];
  if (values.length < 2) return '<div class="spark"></div><div class="axis"><span>Verlauf folgt …</span></div>';
  const end = Date.now();
  const points = values.map((v, i) => ((1 - (end - SERIES.at[i]) / SPAN) * 300).toFixed(1) + ',' + (42 - Math.min(1, v / max) * 40).toFixed(1));
  const first = points[0].split(',')[0];
  const last = points[points.length - 1].split(',')[0];
  return '<svg class="spark" data-key="' + key + '" viewBox="0 0 300 44" preserveAspectRatio="none" role="img" aria-label="Verlauf der letzten 30 Minuten">' +
    '<polygon points="' + first + ',44 ' + points.join(' ') + ' ' + last + ',44"/><polyline points="' + points.join(' ') + '"/></svg>' +
    '<div class="axis"><span>vor 30 min</span><span>jetzt</span></div>';
}
const tile = (key, label, value, of, sub, max, warn) => '<div class="tile"><div class="label"><span>' + label + '</span></div><div class="value' + (warn ? ' warn' : '') + '">' + value + ' <span>' + of + '</span></div><div class="sub">' + sub + '</div>' + spark(key, max) + '</div>';

function machineCard(data) {
  const m = data.machine;
  const u = m.usage;
  const all = data.repos.flatMap((r) => r.runners);
  const used = m.memoryTotal - m.memoryFree;
  const split = (own, other, format) => other > own * 0.05 + 0.05 ? 'Runner ' + format(own) + ' · andere ' + format(other) : 'nur Runner';
  const perJob = limitBytes(m.limits.runnerMemory) + limitBytes(m.limits.dockerMemory);
  const slots = data.repos.reduce((sum, r) => sum + (r.pool && !r.pool.paused ? r.pool.parallel : 0), 0);
  const over = m.dockerMemory && perJob * slots > m.dockerMemory;
  return '<div class="card"><div class="row"><span class="name">Rechner</span>' +
    (m.docker === 'bereit' ? '' : '<span class="tag warn">Docker: ' + esc(m.docker) + '</span>') +
    '<span class="state" style="color:var(--muted);font-weight:400">' + all.filter((r) => r.state.startsWith('arbeitet')).length + ' arbeiten · ' + all.filter((r) => r.state.startsWith('bereit')).length + ' bereit</span></div><div class="tiles">' +
    tile('hostCpu', 'Windows · CPU', cores(u.hostCpu), 'von ' + m.cores + ' Kernen', '', m.cores) +
    tile('hostMemory', 'Windows · Arbeitsspeicher', gb(used), 'von ' + gb(m.memoryTotal), m.memoryFree < m.memoryTotal * 0.08 ? '<span class="warn">nur ' + gb(m.memoryFree) + ' frei</span>' : gb(m.memoryFree) + ' frei', m.memoryTotal, m.memoryFree < m.memoryTotal * 0.08) +
    tile('vmCpu', 'Docker-VM · CPU', cores(u.vmCpu + u.otherCpu), 'von ' + m.dockerCpus + ' Kernen', split(u.vmCpu, u.otherCpu, cores), m.dockerCpus) +
    tile('vmMemory', 'Docker-VM · Container', gb(u.vmMemory + u.otherMemory), m.dockerMemory ? 'von ' + gb(m.dockerMemory) : '', split(u.vmMemory, u.otherMemory, mb), m.dockerMemory || m.memoryTotal) +
    '</div><div class="small' + (over ? ' warn' : '') + '">Erlaubt je Job: ' + gb(perJob) + ' Arbeitsspeicher (' + esc(m.limits.runnerMemory) + ' Runner + ' + esc(m.limits.dockerMemory) + ' Docker). ' +
    'Bei ' + slots + ' Plätzen zusammen bis zu ' + gb(perJob * slots) + (m.dockerMemory ? ' – die Docker-VM hat ' + gb(m.dockerMemory) + (over ? '. Die Limits schützen so nicht vor einer vollen VM.' : '.') : '.') + '</div></div>';
}

// Gemessener Verbrauch je Job und die Wartezeit auf einen Runner.
function usageBox(repo, u, limits) {
  if (!u || (!u.jobs.length && !u.wait)) return '';
  const runs = u.jobs.reduce((sum, j) => sum + j.runs, 0);
  const rows = u.jobs.map((j) => '<tr><td>' + esc(j.job) + '<div class="sub">' + j.runs + (j.runs === 1 ? ' Durchlauf' : ' Durchläufe') + ' · zuletzt ' + ago(j.lastAt) + '</div></td>' +
    '<td class="num">' + clock(j.duration) + '</td><td class="num">' + (j.peakMemory ? mb(j.peakMemory) : '–') + '</td><td class="num">' + (j.peakMemory ? cores(j.cpu) : '–') + '</td><td class="num">' + (j.peakMemory ? cores(j.peakCpu) : '–') + '</td></tr>').join('');
  const notes = [];
  if (u.wait) notes.push('Wartezeit auf einen Runner: üblich ' + Math.round(u.wait.usual) + ' s, längste ' + clock(u.wait.longest) + ' min (letzte ' + u.wait.jobs + ' Jobs).');
  const peakRunner = Math.max(0, ...u.jobs.map((j) => j.peakRunner));
  const peakDocker = Math.max(0, ...u.jobs.map((j) => j.peakDocker));
  if (peakRunner + peakDocker > 0) {
    const allowRunner = limitBytes(limits.runnerMemory);
    const allowDocker = limitBytes(limits.dockerMemory);
    const room = (bytes) => Math.max(1, Math.ceil(bytes * 1.5 / 1073741824 * 2) / 2);
    let note = 'Höchste Spitze: Runner ' + mb(peakRunner) + ', Docker ' + mb(peakDocker) + ' (erlaubt ' + esc(limits.runnerMemory) + ' + ' + esc(limits.dockerMemory) + ').';
    if (peakRunner > allowRunner * 0.85 || peakDocker > allowDocker * 0.85) note += ' <span class="warn">Ein Job stößt ans Limit.</span>';
    else if (runs >= 5 && (room(peakRunner) * 1073741824 < allowRunner || room(peakDocker) * 1073741824 < allowDocker)) note += ' Mit 50 % Luft würden ' + String(room(peakRunner)).replace('.', ',') + ' + ' + String(room(peakDocker)).replace('.', ',') + ' GB reichen.';
    notes.push(note);
  }
  return '<details data-keep="usage-' + esc(repo) + '"><summary>Verbrauch je Job (' + runs + ' gemessen)</summary>' +
    (rows ? '<div class="scroll"><table><tr class="sub"><td>Job</td><td class="num">Dauer üblich</td><td class="num">RAM-Spitze</td><td class="num">CPU Ø (Kerne)</td><td class="num">CPU-Spitze</td></tr>' + rows + '</table></div>' : '') +
    notes.map((n) => '<div class="small">' + n + '</div>').join('') + '</details>';
}

const meter = (label, value, share) => '<div><div class="label"><span>' + label + '</span><b>' + value + '</b></div><div class="bar"><i style="width:' + Math.min(100, share).toFixed(1) + '%"></i></div></div>';
const stateClass = (state) => state.startsWith('bereit') ? 's-bereit' : state.startsWith('arbeitet') ? 's-arbeitet' : state.startsWith('gestört') ? 's-gestoert' : /^(startet|räumt|wartet)/.test(state) ? 's-unterwegs' : '';
const attrs = (o) => Object.entries(o).map(([k, v]) => ' data-' + k + '="' + esc(v) + '"').join('');
const button = (text, o, cls, title) => '<button' + attrs(o) + (cls ? ' class="' + cls + '"' : '') + (title ? ' title="' + esc(title) + '"' : '') + '>' + text + '</button>';

let toastTimer;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 5000);
}

async function call(action, body) {
  try {
    const response = await fetch('/api/' + action, { method: 'POST', headers: { 'content-type': 'application/json', 'x-rc-token': TOKEN }, body: JSON.stringify(body ?? {}) });
    const data = await response.json();
    if (!response.ok) { toast(data.error || 'Das hat nicht geklappt.'); return false; }
    refresh(); return true;
  } catch { toast('Der Dienst antwortet nicht.'); return false; }
}

function runnerCard(repo, r, index, pairLimit) {
  const j = r.job;
  const job = j ? '<div class="job">Job <b>' + esc([j.workflow, j.job].filter(Boolean).join(' / ')) + '</b>' + (j.branch ? ' auf <code>' + esc(j.branch) + '</code>' : '') + (j.startedAt ? ', ' + clock(elapsed(j.startedAt)) + (j.estimate ? ' von üblich ' + clock(j.estimate) : '') : '') + (j.step ? ' · ' + esc(stepText(j.step)) : '') + ' · <a href="' + esc(j.url) + '" target="_blank" rel="noopener">bei GitHub</a></div>' : '';
  let controls = '';
  if (!r.state.startsWith('arbeitet') && !r.state.includes('läuft aus')) controls = button('Neu aufbauen', { do: 'slot/restart', repo, index }, '', 'Verwirft dieses Paar und stellt ein frisches bereit');
  return '<div class="card ' + stateClass(r.state) + '"><div class="row"><span class="name">' + esc(r.name) + '</span><span class="tag">' + r.kind + '</span>' + controls +
    '<span class="state"><span class="dot"></span>' + esc(r.state) + '</span></div>' + job +
    '<div class="meters">' + meter('CPU (' + esc(r.cpuBase) + ' = 100 %)', pct(r.cpu), r.cpu) + meter('Arbeitsspeicher (erlaubt ' + gb(pairLimit) + ')', mb(r.memory), r.memory / pairLimit * 100) + '</div>' +
    '<div class="small">' + esc(r.note) + '</div></div>';
}

function jobRow(j) {
  let cls, mark, detail, time, share = 0;
  if (j.status === 'completed') {
    const ok = j.conclusion === 'success';
    const skipped = j.conclusion === 'skipped';
    cls = ok ? 'j-ok' : skipped ? 'j-skip' : 'j-bad';
    mark = ok ? '✓' : skipped ? '–' : '✕';
    detail = ok ? shortRunner(j.runner) : ({ skipped: 'übersprungen', cancelled: 'abgebrochen', failure: 'fehlgeschlagen' }[j.conclusion] || j.conclusion || '');
    const slow = ok && j.estimate && j.duration > j.estimate * 1.25 && j.duration - j.estimate > 10;
    time = j.duration == null || skipped ? '' : clock(j.duration) + (ok && j.estimate ? ' <span class="sub' + (slow ? ' warn' : '') + '">sonst ' + clock(j.estimate) + '</span>' : '');
    share = skipped ? 0 : 100;
  } else if (j.status === 'in_progress') {
    const run = elapsed(j.startedAt);
    const over = j.estimate && run > j.estimate * 1.25 && run - j.estimate > 10;
    cls = 'j-run' + (over ? ' over' : '');
    mark = '●';
    detail = [shortRunner(j.runner), stepText(j.step)].filter(Boolean).join(' · ');
    time = clock(run) + (j.estimate ? ' <span class="sub' + (over ? ' warn' : '') + '">von ' + clock(j.estimate) + '</span>' : '');
    share = j.estimate ? Math.min(100, run / j.estimate * 100) : 0;
  } else {
    cls = 'j-wait';
    mark = '○';
    detail = j.status === 'pending' ? 'steht noch aus' : 'wartet auf einen Runner';
    time = j.estimate ? '<span class="sub">≈ ' + clock(j.estimate) + '</span>' : '';
  }
  return '<tr class="' + cls + '"><td class="mark">' + mark + '</td><td><a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.name) + '</a><div class="sub">' + esc(detail) + '</div></td>' +
    '<td class="num">' + time + '</td><td class="jbar"><div class="bar"><i style="width:' + share.toFixed(1) + '%"></i></div></td></tr>';
}

function pipelineCard(p) {
  const open = p.jobs.filter((j) => j.status !== 'completed').length;
  const eta = p.finishAt ? left(p.finishAt) : 'wartet auf einen Runner';
  return '<div class="card pipe"><div class="row"><a class="name" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.workflow) + '</a>' +
    '<span class="tag">' + esc(p.branch || p.event) + '</span><span class="title">' + esc(p.title || '') + '</span>' +
    '<span class="eta' + (p.finishAt ? '' : ' warn') + '"' + (p.rough ? ' title="Für einige Jobs gibt es noch keine Erfahrungswerte – grob geschätzt"' : '') + '>' + eta + (p.rough && p.finishAt ? ' ?' : '') + '</span></div>' +
    '<div class="bar"><i style="width:' + (p.progress * 100).toFixed(1) + '%"></i></div>' +
    '<div class="small">' + (p.jobs.length - open) + ' von ' + p.jobs.length + ' Jobs fertig · läuft seit ' + since(p.startedAt) + '</div>' +
    '<div class="scroll"><table class="jobs">' + p.jobs.map(jobRow).join('') + '</table></div></div>';
}

function poolCard(repo, p) {
  const s = p.sizes;
  const size = (key) => s ? mb(s[key]) : '…';
  const clear = (what, text) => button(text, { do: 'pool/clear', repo, what, confirm: 'Wirklich leeren? Der nächste Lauf lädt alles neu und ist langsamer.' });
  const rows = p.cache
    ? '<tr><td>Pakete (NuGet, npm)</td><td class="num">' + size('packages') + '</td><td class="act">' + clear('packages', 'Leeren') + '</td></tr>' +
      '<tr><td>Build-Layer von <code>docker build</code>' + (p.buildService ? ' · Dienst ' + mb(p.buildService.memory) : '') + '</td><td class="num">' + size('build') + '</td><td class="act">' + clear('build', 'Leeren') + '</td></tr>'
    : '<tr><td colspan="3">Paket- und Build-Cache sind aus: Jeder Job lädt Pakete und baut Layer neu.</td></tr>';
  return '<div class="card"><div class="row"><span class="name">Pool</span>' +
    (p.paused ? '<span class="tag warn">pausiert</span>' : '') + (p.busy ? '<span class="tag warn">wird umgebaut</span>' : '') +
    '<span class="tag" title="Fertig vorbereitete Paare; ein frei gewordener Platz ist damit in Sekunden wieder bereit">Reserve ' + p.reserve + ' von ' + p.reserveWanted + '</span>' +
    '<span class="spacer" style="flex:1"></span><span class="sub">Plätze</span>' +
    button('−', { do: 'pool/set', repo, parallel: p.parallel - 1 }, 'step', 'Ein Platz weniger') + '<b>' + p.parallel + '</b>' + button('+', { do: 'pool/set', repo, parallel: p.parallel + 1 }, 'step', 'Ein Platz mehr') +
    button(p.paused ? 'Fortsetzen' : 'Pausieren', { do: 'pool/set', repo, paused: p.paused ? '' : '1' }, '', p.paused ? '' : 'Freie Runner werden beendet, laufende Jobs laufen zu Ende') +
    '</div>' +
    '<details data-keep="cache-' + esc(repo) + '"><summary>Was zwischen den Jobs bleibt</summary><div class="scroll"><table>' + rows +
    '<tr><td>Abbilder in der Vorlage (' + p.images.length + ', gelernt aus den Jobs)</td><td class="num">' + size('images') + '</td><td class="act">' + clear('images', 'Vergessen') + '</td></tr></table></div>' +
    (p.images.length ? '<div class="small">' + p.images.map(esc).join(' · ') + '</div>' : '') +
    '<div class="row" style="margin-top:10px">' + clear('all', 'Alles leeren und neu lernen') +
    button(p.cache ? 'Paket- und Build-Cache abschalten' : 'Paket- und Build-Cache einschalten', { do: 'pool/set', repo, cache: p.cache ? '' : '1' }) +
    button('Pool entfernen', { do: 'pool/remove', repo, confirm: 'Pool für ' + repo + ' mit allen Caches entfernen? Jobs dieses Repos warten danach.' }, 'danger') + '</div></details></div>';
}

function runsBox(repo, runs) {
  if (!runs.length) return '';
  const word = (r) => r.status !== 'completed' ? '<span class="warn">' + ({ queued: 'wartet', in_progress: 'läuft' }[r.status] || esc(r.status)) + '</span>'
    : r.conclusion === 'success' ? 'grün' : r.conclusion === 'failure' ? '<span class="bad">rot</span>' : esc({ cancelled: 'abgebrochen', skipped: 'übersprungen' }[r.conclusion] || r.conclusion);
  return '<details data-keep="runs-' + esc(repo) + '"><summary>Letzte Läufe</summary><div class="scroll"><table>' + runs.map((r) =>
    '<tr><td><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a> · ' + esc(r.title || '') + '<div class="sub"><code>' + esc(r.branch) + '</code> · ' + ago(r.at) + '</div></td><td>' + word(r) + '</td><td class="act">' +
    (r.status === 'completed' ? (r.conclusion === 'failure' ? button('Rote Jobs erneut', { do: 'run/rerun', repo, id: r.id, failedOnly: '1' }) + ' ' : '') + button('Erneut', { do: 'run/rerun', repo, id: r.id }) : '') + '</td></tr>').join('') + '</table></div></details>';
}

async function refresh() {
  let data;
  try { data = await (await fetch('/api/status')).json(); }
  catch { document.getElementById('sub').innerHTML = '<span class="warn">Der Dienst läuft nicht. Starte RunClub neu.</span>'; return; }
  const m = data.machine;
  SERIES = m.series;
  const pairLimit = limitBytes(m.limits.runnerMemory) + limitBytes(m.limits.dockerMemory);
  document.getElementById('sub').textContent = 'Stand ' + new Date(data.at).toLocaleTimeString('de-DE');
  document.getElementById('machine').innerHTML = machineCard(data);

  const open = new Set([...document.querySelectorAll('details[data-keep][open]')].map((d) => d.dataset.keep));
  document.getElementById('repos').innerHTML = data.repos.map((entry) => {
    let linux = 0;
    return '<div class="repo"><div class="repohead"><h2>' + esc(entry.repo) + '</h2>' +
      (entry.waiting ? '<span class="tag warn">' + entry.waiting + ' Job' + (entry.waiting > 1 ? 's warten' : ' wartet') + '</span>' : '') +
      (entry.error ? '<span class="tag warn">GitHub: ' + esc(entry.error) + '</span>' : '') + '</div>' +
      (entry.pipelines || []).map(pipelineCard).join('') +
      (entry.pool ? poolCard(entry.repo, entry.pool) : '') +
      entry.runners.map((r) => runnerCard(entry.repo, r, r.kind === 'Linux' ? linux++ : 0, pairLimit)).join('') +
      usageBox(entry.repo, entry.usage, m.limits) +
      runsBox(entry.repo, entry.runs) + '</div>';
  }).join('') || '<div class="card">Noch kein Runner eingerichtet.</div>';
  if (data.app) { document.getElementById('autostart').hidden = false; document.getElementById('autostartBox').checked = data.app.autostart; }
  document.querySelectorAll('details[data-keep]').forEach((d) => { if (open.has(d.dataset.keep)) d.open = true; });
  document.getElementById('log').textContent = data.log.join('\n');
}

document.addEventListener('click', async (event) => {
  const el = event.target.closest('button[data-do]');
  if (!el) return;
  const { do: action, confirm: question, ...body } = el.dataset;
  if (action === 'shutdown') {
    if (!confirm('Alle Runner und dieses Programm beenden? Jobs warten, bis es wieder läuft.')) return;
    if (await call('shutdown')) toast('Wird beendet …');
    return;
  }
  if (question && !confirm(question)) return;
  for (const key of ['paused', 'cache', 'failedOnly']) if (key in body) body[key] = body[key] === '1';
  for (const key of ['parallel', 'index']) if (key in body) body[key] = Number(body[key]);
  el.disabled = true;
  await call(action, body);
});

async function addPool(repo) {
  if (!await call('pool/add', { repo, parallel: 1 })) return false;
  toast('Pool angelegt. Die Runner stehen in etwa einer Minute bereit.');
  loadRepos();
  return true;
}

document.getElementById('add').addEventListener('submit', async (event) => {
  event.preventDefault();
  const input = document.getElementById('addRepo');
  if (await addPool(input.value.trim())) input.value = '';
});

// Repos aus dem GitHub-Konto: alle als Vorschlag beim Tippen, die zuletzt bewegten ohne Pool als Knöpfe.
async function loadRepos() {
  let repos;
  try { const response = await fetch('/api/repos'); repos = await response.json(); if (!response.ok) return; } catch { return; }
  const free = repos.filter((r) => !r.pool);
  document.getElementById('repoList').innerHTML = free.map((r) => '<option value="' + esc(r.repo) + '">').join('');
  document.getElementById('picks').innerHTML = free.slice(0, 6).map((r) => '<button data-pick="' + esc(r.repo) + '" title="zuletzt bewegt ' + ago(r.pushedAt) + '">+ ' + esc(r.repo) + '</button>').join('');
}

document.getElementById('picks').addEventListener('click', (event) => {
  const el = event.target.closest('button[data-pick]');
  if (el) { el.disabled = true; addPool(el.dataset.pick); }
});

document.getElementById('autostartBox').addEventListener('change', (event) => call('app/autostart', { on: event.target.checked }));

loadRepos();

// Verlauf unter dem Mauszeiger: Zeitpunkt und Wert, dazu eine Linie an der Stelle.
document.addEventListener('mousemove', (event) => {
  const tip = document.getElementById('tip');
  const svg = event.target.closest ? event.target.closest('svg.spark') : null;
  if (!svg || !SERIES.at.length) { tip.style.display = 'none'; return; }
  const box = svg.getBoundingClientRect();
  const time = Date.now() - SPAN * (1 - (event.clientX - box.left) / box.width);
  let index = 0;
  SERIES.at.forEach((at, i) => { if (Math.abs(at - time) < Math.abs(SERIES.at[index] - time)) index = i; });
  const key = svg.dataset.key;
  const x = (1 - (Date.now() - SERIES.at[index]) / SPAN) * 300;
  let line = svg.querySelector('line');
  if (!line) { line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); line.setAttribute('y1', 0); line.setAttribute('y2', 44); svg.appendChild(line); }
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  tip.textContent = new Date(SERIES.at[index]).toLocaleTimeString('de-DE') + ' · ' + FORMAT[key](SERIES[key][index]);
  tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, event.clientX + 12) + 'px';
  tip.style.top = (event.clientY - 34) + 'px';
});

refresh(); setInterval(refresh, 3000);
</script></body></html>
